<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Editor · Dự bị STANKIN, khoa học nền và kỹ năng học đại học Nga</title>
<link rel="stylesheet" href="../../platform/ui/index.css?v=bfis-e10">
<link rel="stylesheet" href="../../platform/ui/editor.css?v=bfis-e10">
</head>
<body data-bui="1" data-bui-editor="foundation">
<main id="bui-main" class="wrap" role="main">
  <aside class="panel">
    <span class="bui-badge bui-badge--info">Data Editor</span>
    <h1>Dữ liệu môn Dự bị STANKIN, khoa học nền và kỹ năng học đại học Nga</h1>
    <p>Chọn một file JSON, chỉnh nội dung và kiểm tra cú pháp trước khi tải xuống. File xuất ra giữ nguyên tên để đưa lại vào <code>subjects/foundation/data/</code>.</p>
    <label class="bui-field" for="fileSel">
      <span class="bui-label">Nguồn dữ liệu</span>
      <select id="fileSel" class="bui-select">
        <option>curriculum.json</option>
        <option>lessons.json</option>
        <option>formulas.json</option>
        <option>exercises.json</option>
        <option>tests.json</option>
        <option>knowledge-index.json</option>
      </select>
      <span class="bui-help">Dữ liệu được nạp cục bộ từ thư mục môn học.</span>
    </label>
    <div class="bui-context-actions">
      <button class="bui-button" type="button" id="loadBtn">Nạp lại</button>
      <button class="bui-button bui-button--primary" type="button" id="downloadBtn">Tải file đã chỉnh</button>
      <a class="bui-button" href="./index.html" target="_blank" rel="noopener">Mở môn học</a>
    </div>
    <div id="editorStatus" class="bui-next-action" aria-live="polite">
      <h3>Sẵn sàng</h3>
      <p>Chưa có thay đổi.</p>
    </div>
  </aside>
  <section class="panel" aria-label="Nội dung JSON">
    <label class="bui-field" for="txt">
      <span class="bui-label">Nội dung</span>
      <textarea id="txt" spellcheck="false" autocomplete="off" aria-describedby="editorHint"></textarea>
      <span id="editorHint" class="bui-help">JSON phải hợp lệ trước khi tải xuống.</span>
    </label>
  </section>
</main>
<script src="../../platform/ui/runtime.js?v=bfis-e10"></script>
<script>
const fileSel=document.getElementById('fileSel');
const txt=document.getElementById('txt');
const status=document.getElementById('editorStatus');
function setStatus(title,message,kind='info'){
  status.className='bui-next-action '+(kind==='error'?'bui-card--danger':'');
  status.innerHTML='<h3>'+title+'</h3><p>'+message+'</p>';
}
async function loadFile(){
  const f=fileSel.value;
  setStatus('Đang nạp','Đang đọc '+f+'...');
  try{
    const r=await fetch('./data/'+f,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    txt.value=JSON.stringify(await r.json(),null,2);
    setStatus('Đã nạp',f+' sẵn sàng để chỉnh sửa.');
  }catch(e){
    setStatus('Không thể tải dữ liệu','Kiểm tra file trong thư mục data rồi thử lại.','error');
  }
}
function downloadFile(){
  const f=fileSel.value;
  try{JSON.parse(txt.value)}
  catch(e){setStatus('JSON chưa hợp lệ','Sửa lỗi cú pháp trước khi tải file.','error');txt.focus();return}
  const a=document.createElement('a');
  const url=URL.createObjectURL(new Blob([txt.value],{type:'application/json'}));
  a.href=url;a.download=f;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),0);
  setStatus('Đã chuẩn bị file','Trình duyệt đang tải '+f+'.');
}
document.getElementById('loadBtn').addEventListener('click',loadFile);
document.getElementById('downloadBtn').addEventListener('click',downloadFile);
fileSel.addEventListener('change',loadFile);
txt.addEventListener('input',()=>setStatus('Có thay đổi','Kiểm tra JSON trước khi tải xuống.'));
loadFile();
</script>
</body>
</html>
