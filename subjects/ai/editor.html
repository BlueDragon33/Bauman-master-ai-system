<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editor · Machine Learning, Neural Systems và đánh giá mô hình</title><style>body{margin:0;background:#f4f7fc;color:#10233f;font-family:Inter,"Segoe UI",Arial,sans-serif}.wrap{display:grid;grid-template-columns:340px 1fr;gap:14px;padding:18px;height:100vh}.panel{background:#fff;border:1px solid #d9e4f3;border-radius:18px;padding:16px}textarea{width:100%;height:calc(100vh - 38px);border:1px solid #d5e0ef;border-radius:14px;padding:12px;font-family:Consolas,monospace}button,select{border:1px solid #d5e0ef;border-radius:12px;background:#fff;padding:10px 13px;font-weight:800}button.primary{background:#2563eb;color:#fff}</style></head><body><div class="wrap"><div class="panel"><h1>Dữ liệu môn Machine Learning, Neural Systems và đánh giá mô hình</h1><p>Chọn file JSON, chỉnh nội dung rồi tải xuống để chép lại vào thư mục <code>subjects/ai/data/</code> bằng VS Code.</p><select id="fileSel"><option>curriculum.json</option><option>lessons.json</option><option>formulas.json</option><option>exercises.json</option><option>tests.json</option><option>knowledge-index.json</option></select><button onclick="loadFile()">Nạp</button><button class="primary" onclick="downloadFile()">Tải file đã chỉnh</button><button onclick="window.open('./index.html','_blank')">Mở môn học</button></div><div class="panel"><textarea id="txt"></textarea></div></div><script>async function loadFile(){const f=document.getElementById('fileSel').value;const r=await fetch('./data/'+f);document.getElementById('txt').value=JSON.stringify(await r.json(),null,2)}function downloadFile(){const f=document.getElementById('fileSel').value;try{JSON.parse(document.getElementById('txt').value)}catch(e){alert('JSON chưa hợp lệ');return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([document.getElementById('txt').value],{type:'application/json'}));a.download=f;a.click();URL.revokeObjectURL(a.href)}loadFile()</script></body></html>
