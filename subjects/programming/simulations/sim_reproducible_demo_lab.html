<!doctype html><html lang='vi'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Reproducible Demo Lab</title><style>
:root{--bg:#071225;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--text:#e5f4ff;--muted:#9fb6d6;--gold:#facc15;--cyan:#22d3ee}
*{box-sizing:border-box}body{font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;margin:0;background:radial-gradient(circle at 20% 0%,rgba(34,211,238,.20),transparent 30%),linear-gradient(135deg,#071225,#0f172a);color:var(--text)}main{max-width:1100px;margin:auto;padding:24px}.card{border:1px solid var(--line);border-radius:26px;background:var(--card);padding:22px;box-shadow:0 22px 70px rgba(0,0,0,.30)}h1{margin:0 0 8px;font-size:28px}p{color:var(--muted);line-height:1.55}code{font-family:'Cascadia Code','JetBrains Mono',Consolas,monospace;color:var(--gold);white-space:pre-wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:grid;gap:8px;background:rgba(255,255,255,.06);padding:14px;border-radius:18px;border:1px solid var(--line);font-weight:800}input{width:100%;accent-color:#22d3ee}.meter{height:18px;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden;border:1px solid var(--line)}.meter i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#22d3ee,#facc15);border-radius:inherit}.result{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.result article{padding:14px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.06)}.result b{display:block;font-size:24px;color:#fff}.result span{color:var(--muted);font-size:13px}.note{margin-top:16px;padding:14px;border-radius:18px;background:rgba(250,204,21,.10);border:1px solid rgba(250,204,21,.25)}@media(max-width:780px){.grid,.result{grid-template-columns:1fr}}</style></head><body><main><section class='card'><h1>Reproducible Demo Lab</h1><p>Đổi mức offline, dữ liệu mẫu và script để đánh giá demo bảo vệ.</p><p><b>Workflow/cú pháp lõi:</b> <code>make reproduce → figures → defense</code></p><div class='grid'><label>Quy mô dữ liệu/code <input id='a' type='range' min='1' max='100' value='45'><span id='av'></span><div class='meter'><i id='am'></i></div></label><label>Chất lượng test/tài liệu <input id='b' type='range' min='0' max='100' value='70'><span id='bv'></span><div class='meter'><i id='bm'></i></div></label></div><div class='result'><article><span>Rủi ro demo</span><b id='risk'></b></article><article><span>Khả năng tái lập</span><b id='rep'></b></article><article><span>Gợi ý</span><b id='hint'></b></article></div><div class='note' id='explain'></div></section></main><script>
const a=document.getElementById('a'),b=document.getElementById('b');
const av=document.getElementById('av'),bv=document.getElementById('bv'),am=document.getElementById('am'),bm=document.getElementById('bm'),risk=document.getElementById('risk'),rep=document.getElementById('rep'),hint=document.getElementById('hint'),ex=document.getElementById('explain');
function draw(){let A=+a.value,B=+b.value;let R=Math.min(100,A*.65+(100-B)*.8);let P=Math.max(0,100-R*.7+B*.35);av.textContent=A+' / 100';bv.textContent=B+' / 100';am.style.width=A+'%';bm.style.width=B+'%';risk.textContent=Math.round(R)+'%';rep.textContent=Math.round(P)+'%';hint.textContent=R>60?'thêm test + README':'ổn, refactor nhẹ';ex.innerHTML='Khi quy mô tăng mà test/tài liệu thấp, rủi ro demo tăng. Kết luận tốt cần input/output rõ, script chạy lại, dữ liệu mẫu, log và artifact.'}a.oninput=b.oninput=draw;draw();
</script></body></html>
