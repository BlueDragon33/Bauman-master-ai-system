name: Bauman Live Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bauman-live
  cancel-in-progress: true

jobs:
  deploy-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    environment: bauman-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BAUMAN_CONTROL_PRODUCTION_D1_DATABASE_ID: ${{ secrets.BAUMAN_CONTROL_PRODUCTION_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN }}
      BAUMAN_CONTROL_PRODUCTION_ORIGIN: ${{ vars.BAUMAN_CONTROL_PRODUCTION_ORIGIN }}
      BAUMAN_RUNTIME_PRODUCTION_ORIGIN: ${{ vars.BAUMAN_RUNTIME_PRODUCTION_ORIGIN }}
      BAUMAN_ACCESS_MODE: standalone

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Require live deployment basics
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BAUMAN_CONTROL_PRODUCTION_D1_DATABASE_ID BAUMAN_CONTROL_PRODUCTION_ORIGIN BAUMAN_RUNTIME_PRODUCTION_ORIGIN; do
            [[ -n "${!key:-}" ]] || { echo "::error::$key is required."; exit 1; }
          done

      - name: Install Control dependencies
        working-directory: control-service
        run: npm ci --no-audit --no-fund

      - name: Package standalone live runtime
        run: node scripts/prepare-cloudflare-production.mjs

      - name: Apply live D1 migrations
        working-directory: control-service
        run: npx wrangler d1 migrations apply bauman-control-db --remote --config wrangler.production.jsonc

      - name: Deploy Control live
        working-directory: control-service
        run: npx wrangler deploy --config wrangler.production.jsonc

      - name: Deploy Learning Runtime live
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.runtime.production.jsonc

      - name: Quick live check
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            if curl --fail --silent --show-error --max-time 12 "$BAUMAN_RUNTIME_PRODUCTION_ORIGIN/" >/dev/null; then
              echo "Bauman live runtime reachable."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Bauman live runtime did not become reachable."
          exit 1

      - name: Live summary
        run: |
          echo "Bauman main -> live completed."
          echo "Access mode: standalone"
          echo "Revision: $GITHUB_SHA"
