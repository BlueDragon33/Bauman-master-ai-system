name: Bauman Cloudflare Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Gõ DEPLOY_PRODUCTION để publish Bauman Control + Learning Runtime lên production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bauman-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: bauman-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BAUMAN_CONTROL_PREVIEW_D1_DATABASE_ID: ${{ secrets.BAUMAN_CONTROL_PREVIEW_D1_DATABASE_ID }}
      BAUMAN_CONTROL_PRODUCTION_D1_DATABASE_ID: ${{ secrets.BAUMAN_CONTROL_PRODUCTION_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN }}
      BAUMAN_CONTROL_PREVIEW_ORIGIN: ${{ vars.BAUMAN_CONTROL_PREVIEW_ORIGIN }}
      BAUMAN_RUNTIME_PREVIEW_ORIGIN: ${{ vars.BAUMAN_RUNTIME_PREVIEW_ORIGIN }}
      BAUMAN_CONTROL_PRODUCTION_ORIGIN: ${{ vars.BAUMAN_CONTROL_PRODUCTION_ORIGIN }}
      BAUMAN_RUNTIME_PRODUCTION_ORIGIN: ${{ vars.BAUMAN_RUNTIME_PRODUCTION_ORIGIN }}
      BAUMAN_ACCESS_MODE: managed
      RUSSIAN_RELEASE_EVIDENCE_DIR: artifacts/russian-release-annex
      RUSSIAN_OBSERVATION_INTERVAL_SECONDS: "20"

    steps:
      - name: Require explicit production confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm }}" != "DEPLOY_PRODUCTION" ]]; then
            echo '::error::Production deployment cancelled. Enter DEPLOY_PRODUCTION exactly.'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Require production credentials and isolated bindings
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BAUMAN_CONTROL_PREVIEW_D1_DATABASE_ID BAUMAN_CONTROL_PRODUCTION_D1_DATABASE_ID APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN BAUMAN_CONTROL_PREVIEW_ORIGIN BAUMAN_RUNTIME_PREVIEW_ORIGIN BAUMAN_CONTROL_PRODUCTION_ORIGIN BAUMAN_RUNTIME_PRODUCTION_ORIGIN; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::$key is required in the bauman-production GitHub environment."
              exit 1
            fi
          done
      - name: Install Bauman Control dependencies
        working-directory: control-service
        run: npm ci --no-audit --no-fund

      - name: Validate production publish boundary
        run: node scripts/validate-cloudflare-production.mjs

      - name: Preserve existing runtime and control regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/runtime-device-gate-regression.mjs
          (cd control-service && npm run gate)

      - name: Verify exact preview revision before production
        shell: bash
        run: |
          set -euo pipefail
          BAUMAN_DEPLOYMENT_URL="$BAUMAN_CONTROL_PREVIEW_ORIGIN/__deployment" \
          BAUMAN_EXPECTED_REVISION="$GITHUB_SHA" \
          BAUMAN_EXPECTED_CHANNEL="cloudflare-preview" \
          BAUMAN_EXPECTED_RUNTIME="control-service" \
          node scripts/wait-cloudflare-deployment-revision.mjs > /tmp/bauman-preview-control.json
          BAUMAN_DEPLOYMENT_URL="$BAUMAN_RUNTIME_PREVIEW_ORIGIN/__deployment" \
          BAUMAN_EXPECTED_REVISION="$GITHUB_SHA" \
          BAUMAN_EXPECTED_CHANNEL="cloudflare-preview" \
          BAUMAN_EXPECTED_RUNTIME="learning-runtime" \
          node scripts/wait-cloudflare-deployment-revision.mjs > /tmp/bauman-preview-runtime.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const control = JSON.parse(fs.readFileSync('/tmp/bauman-preview-control.json', 'utf8'));
          const runtime = JSON.parse(fs.readFileSync('/tmp/bauman-preview-runtime.json', 'utf8'));
          if (!control.databaseReady) throw new Error('Bauman Control preview is not deployment-ready.');
          if (!control.controlSecretConfigured) throw new Error('Bauman Control preview secret readiness is not proven.');
          if (!runtime.controlOriginConfigured) throw new Error('Bauman Learning Runtime preview is not deployment-ready.');
          console.log('Exact-revision preview promotion gate PASS.');
          NODE

      - name: Materialize immutable Russian release preflight evidence
        run: node scripts/russian-release-annex-evidence.mjs preflight

      - name: Materialize isolated production configs and runtime assets
        run: node scripts/prepare-cloudflare-production.mjs

      - name: Dry-run all production artifacts before any remote mutation
        shell: bash
        run: |
          set -euo pipefail
          (cd control-service && npx wrangler deploy --dry-run --outdir dist-production --config wrangler.production.jsonc)
          npx --yes wrangler@4.92.0 deploy --dry-run --outdir .wrangler/runtime-production --config wrangler.runtime.production.jsonc

      - name: Record immutable deployment artifact identity
        run: node scripts/russian-release-annex-evidence.mjs artifact

      - name: Export Bauman production D1 backup before migration
        working-directory: control-service
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "../$RUSSIAN_RELEASE_EVIDENCE_DIR"
          npx wrangler d1 export bauman-control-db --remote --skip-confirmation --output "../$RUSSIAN_RELEASE_EVIDENCE_DIR/bauman-control-predeploy.sql" --config wrangler.production.jsonc
          BACKUP_SHA="$(sha256sum "../$RUSSIAN_RELEASE_EVIDENCE_DIR/bauman-control-predeploy.sql" | awk '{print $1}')"
          BACKUP_BYTES="$(wc -c < "../$RUSSIAN_RELEASE_EVIDENCE_DIR/bauman-control-predeploy.sql" | tr -d ' ')"
          printf '{"schema":"RUSSIAN_BACKUP_DECISION_RESULT_V1","decision":"BACKUP_REQUIRED","status":"PASS","artifact":"bauman-control-predeploy.sql","sha256":"%s","bytes":%s,"revision":"%s"}\n' "$BACKUP_SHA" "$BACKUP_BYTES" "$GITHUB_SHA" > "../$RUSSIAN_RELEASE_EVIDENCE_DIR/RUSSIAN_BACKUP_DECISION_RESULT.json"

      - name: Apply migrations to Bauman production D1
        working-directory: control-service
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx wrangler d1 migrations apply bauman-control-db --remote --config wrangler.production.jsonc 2>&1 | tee "../$RUSSIAN_RELEASE_EVIDENCE_DIR/migration-output.log"
          code="${PIPESTATUS[0]}"
          set -e
          MIGRATION_EXIT_CODE="$code" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const dir='../'+process.env.RUSSIAN_RELEASE_EVIDENCE_DIR;
          const manifest=JSON.parse(fs.readFileSync(dir+'/RUSSIAN_MIGRATION_MANIFEST.json','utf8'));
          const log=fs.readFileSync(dir+'/migration-output.log');
          const code=Number(process.env.MIGRATION_EXIT_CODE||1);
          fs.writeFileSync(dir+'/RUSSIAN_MIGRATION_RESULT.json',JSON.stringify({
            schema:'RUSSIAN_MIGRATION_RESULT_V1',
            status:code===0?'PASS':'FAIL',
            revision:process.env.GITHUB_SHA,
            exitCode:code,
            migrationManifestSha256:manifest.sha256,
            migrationCount:Array.isArray(manifest.files)?manifest.files.length:0,
            outputLogSha256:crypto.createHash('sha256').update(log).digest('hex'),
            outputBytes:log.length
          },null,2)+'\n');
          NODE
          if [[ "$code" -ne 0 ]]; then
            exit "$code"
          fi

      - name: Deploy Bauman Control production Worker
        working-directory: control-service
        run: npx wrangler deploy --config wrangler.production.jsonc

      - name: Deploy Bauman Learning Runtime production Worker
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.runtime.production.jsonc

      - name: Smoke test production stack
        shell: bash
        run: |
          set -euo pipefail
          BAUMAN_DEPLOYMENT_URL="$BAUMAN_CONTROL_PRODUCTION_ORIGIN/__deployment" \
          BAUMAN_EXPECTED_REVISION="$GITHUB_SHA" \
          BAUMAN_EXPECTED_CHANNEL="cloudflare-production" \
          BAUMAN_EXPECTED_RUNTIME="control-service" \
          node scripts/wait-cloudflare-deployment-revision.mjs > /tmp/bauman-prod-control.json
          BAUMAN_DEPLOYMENT_URL="$BAUMAN_RUNTIME_PRODUCTION_ORIGIN/__deployment" \
          BAUMAN_EXPECTED_REVISION="$GITHUB_SHA" \
          BAUMAN_EXPECTED_CHANNEL="cloudflare-production" \
          BAUMAN_EXPECTED_RUNTIME="learning-runtime" \
          node scripts/wait-cloudflare-deployment-revision.mjs > /tmp/bauman-prod-runtime.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const control = JSON.parse(fs.readFileSync('/tmp/bauman-prod-control.json', 'utf8'));
          const runtime = JSON.parse(fs.readFileSync('/tmp/bauman-prod-runtime.json', 'utf8'));
          if (!control.databaseReady) throw new Error('Production Control read-back mismatch.');
          if (!control.controlSecretConfigured) throw new Error('Production Control secret readiness is not proven.');
          if (!runtime.controlOriginConfigured) throw new Error('Production Runtime read-back mismatch.');
          NODE

          CONTROL_STATUS_CODE="$(curl --silent --show-error --output /tmp/bauman-prod-status-anonymous.json --write-out '%{http_code}' --max-time 20 "$BAUMAN_CONTROL_PRODUCTION_ORIGIN/api/control/status" || true)"
          if [[ "$CONTROL_STATUS_CODE" != "403" ]]; then
            echo "::error::Anonymous Bauman control status must remain fail-closed with HTTP 403; got $CONTROL_STATUS_CODE."
            cat /tmp/bauman-prod-status-anonymous.json || true
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync('/tmp/bauman-prod-status-anonymous.json', 'utf8'));
          if (value.code !== 'CONTROL_TICKET_FORBIDDEN') throw new Error('Anonymous Bauman control status did not fail closed with CONTROL_TICKET_FORBIDDEN.');
          NODE

          curl --fail --silent --show-error --max-time 20 "$BAUMAN_RUNTIME_PRODUCTION_ORIGIN/" > /tmp/bauman-prod-home.html
          grep -Fq "name=\"bauman-control-origin\" content=\"$BAUMAN_CONTROL_PRODUCTION_ORIGIN\"" /tmp/bauman-prod-home.html
          grep -Fq 'assets/js/platform/device-access-gate.js' /tmp/bauman-prod-home.html
          curl --fail --silent --show-error --max-time 20 "$BAUMAN_RUNTIME_PRODUCTION_ORIGIN/subjects/russian/" > /tmp/bauman-prod-russian.html
          grep -Fq 'assets/russian-future-ui.js' /tmp/bauman-prod-russian.html
          grep -Fq 'assets/russian-future-ui.css' /tmp/bauman-prod-russian.html
          grep -Fq 'assets/russian-optional-data-loader.js' /tmp/bauman-prod-russian.html

      - name: Bootstrap isolated Russian production smoke device session
        run: node scripts/russian-production-smoke-device.mjs bootstrap

      - name: Verify Russian production identity, security, offline contract and content drift
        run: node scripts/russian-release-annex-evidence.mjs verify

      - name: Run production subject smoke browser acceptance
        shell: bash
        env:
          BAUMAN_E2E_BASE_URL: ${{ vars.BAUMAN_RUNTIME_PRODUCTION_ORIGIN }}/
          BAUMAN_E2E_DEVICE_SESSION: ${{ env.BAUMAN_PRODUCTION_SMOKE_DEVICE_SESSION }}
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

          BAUMAN_E2E_ARTIFACT_DIR=artifacts/math-production-rc \
            node tests/math-p6-rc-browser.mjs
          BAUMAN_E2E_ARTIFACT_DIR=artifacts/math-production-reasoning \
            node tests/math-p3-reasoning-browser.mjs

          BAUMAN_E2E_ARTIFACT_DIR=artifacts/russian-production-journeys \
            node tests/russian-ru08-journeys-browser.mjs
          BAUMAN_E2E_ARTIFACT_DIR=artifacts/russian-production-author \
            node tests/russian-ru08-author-browser.mjs
          BAUMAN_E2E_ARTIFACT_DIR=artifacts/russian-production-offline-browser \
            node tests/russian-offline-shell-browser.mjs

          cp artifacts/russian-production-journeys/summary.json \
            "$RUSSIAN_RELEASE_EVIDENCE_DIR/RUSSIAN_PRODUCTION_RU08_JOURNEYS.json"
          cp artifacts/russian-production-author/summary.json \
            "$RUSSIAN_RELEASE_EVIDENCE_DIR/RUSSIAN_PRODUCTION_RU08_AUTHOR.json"
          cp artifacts/russian-production-offline-browser/summary.json \
            "$RUSSIAN_RELEASE_EVIDENCE_DIR/RUSSIAN_PRODUCTION_OFFLINE_BROWSER.json"
          cp artifacts/math-production-rc/summary.json \
            "$RUSSIAN_RELEASE_EVIDENCE_DIR/MATH_PRODUCTION_RC_SMOKE.json"
          cp artifacts/math-production-reasoning/summary.json \
            "$RUSSIAN_RELEASE_EVIDENCE_DIR/MATH_PRODUCTION_REASONING_SMOKE.json"

      - name: Observe exact Russian production revision
        run: node scripts/russian-release-annex-evidence.mjs observe

      - name: Close Russian Release Annex state machine
        run: node scripts/russian-release-annex-evidence.mjs close

      - name: Revoke ephemeral Russian production smoke device
        if: always()
        run: node scripts/russian-production-smoke-device.mjs cleanup

      - name: Upload Russian release closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: russian-release-annex-${{ github.run_id }}
          path: |
            artifacts/russian-release-annex
            artifacts/russian-production-journeys
            artifacts/russian-production-author
            artifacts/russian-production-offline-browser
            artifacts/math-production-rc
            artifacts/math-production-reasoning
          if-no-files-found: error
          retention-days: 30

      - name: Production deployment summary
        shell: bash
        run: |
          echo 'Bauman production release closure completed.'
          echo 'Control Worker: bauman-control'
          echo 'D1: bauman-control-db'
          echo 'Learning Worker: bauman-master-ai'
          echo "Revision: $GITHUB_SHA"
          echo 'State: STABLE only after exact identity, backup, migration, smoke, offline/PWA, drift and observation gates passed.'
          echo 'Promotion source: exact same revision verified live in Cloudflare preview before production.'
          echo 'Manager-owned BAUMAN_CONTROL_SERVICE_SECRET preserved; Bauman deploy does not rotate the shared control-plane secret.'
