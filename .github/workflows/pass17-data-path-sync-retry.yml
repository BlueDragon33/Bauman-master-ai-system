name: Pass 17 theory data path synchronization retry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pass17-data-path-sync-retry.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch and verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p129=Path('subjects/math/assets/theory_skin/theory-tab-E129.js')
          p211=Path('subjects/math/assets/theory_skin/theory-slideshow-reader-content-E211.js')
          ps=Path('CODEX_STATE.md')
          a=p129.read_text(encoding='utf-8')
          b=p211.read_text(encoding='utf-8')

          a,n=re.subn(r"(    localSet\(CONTENT_OVERLAY_KEY,payload\);\n)(    return \{payload:payload,stats:)",r"\1    try{ window.dispatchEvent(new CustomEvent('bauman:theory-content-updated',{detail:{source:RELEASE,payload:payload,records:current.length}})); }catch(_){ }\n\2",a,count=1)
          assert n==1,n

          b,n=re.subn(r"/\* E223 Reader Pro content bridge: amber lesson formula popup\. \*/", "/* E240 Reader Pro shared theory content bridge: DB-first, durable JSON fallback. */",b,count=1)
          assert n==1,n
          b,n=re.subn(r"var RELEASE='E223_READER_PRO_FORMULA_MODAL_AMBER_LESSON_LAYOUT';", "var RELEASE='E240_SHARED_THEORY_CONTENT_SOURCE';",b,count=1)
          assert n==1,n
          b,n=re.subn(r"var records=\[\], byId=\{\}, byTitle=\{\}, ready=false, loading=false, last='', formulaPopupState=null, fallbackModal=null;", "var records=[], byId={}, byTitle={}, ready=false, loading=false, last='', formulaPopupState=null, fallbackModal=null;\n  var lastPayloadRef=null, dataSource='unloaded';",b,count=1)
          assert n==1,n

          load_block="""  function runtimePayload(){
    var payload=window.DB&&window.DB.theory_lecture_content;
    return payload&&Array.isArray(payload.records)?payload:null;
  }
  function indexPayload(j,source){
    records=(j&&j.records)||[];
    byId={}; byTitle={};
    records.forEach(function(r){
      if(r.lessonId)byId[norm(r.lessonId)]=r;
      if(r.lessonTitle)byTitle[norm(r.lessonTitle)]=r;
      if(r.title)byTitle[norm(r.title)]=r;
    });
    lastPayloadRef=j||null;
    dataSource=source||'unknown';
    ready=true;
    return true;
  }
  function load(force){
    if(force){ready=false;records=[];byId={};byTitle={};last='';}
    if(ready||loading)return Promise.resolve(ready);
    loading=true;
    var live=runtimePayload();
    var request=live?Promise.resolve({payload:live,source:'window.DB.theory_lecture_content'}):fetch('data/theory_lecture_content.json',{cache:'no-store'}).then(function(r){
      if(!r.ok)throw new Error('theory content HTTP '+r.status);
      return r.json().then(function(j){return {payload:j,source:'data/theory_lecture_content.json'};});
    });
    return request.then(function(result){return indexPayload(result.payload,result.source);}).catch(function(e){
      console.warn('[E240] theory content unavailable',e);
      return false;
    }).finally(function(){loading=false;});
  }

  function deck"""
          b,n=re.subn(r"  function load\(\)\{.*?\n  \}\n\n  function deck",load_block,b,count=1,flags=re.S)
          assert n==1,n

          b,n=re.subn(r"(    if\(!/Reader Pro/i\.test\(m\)\)\{d\.classList\.remove\('e211-reader-pro'\);return;\}\n)(    if\(!ready\)\{load\(\)\.then\(schedule\); return;\})",r"\1    var live=runtimePayload();\n    if(ready&&live&&live!==lastPayloadRef){load(true).then(schedule);return;}\n\2",b,count=1)
          assert n==1,n

          b,n=re.subn(r"(  function boot\(\)\{\n    load\(\)\.then\(schedule\);\n    try\{new MutationObserver\(schedule\)\.observe\(document\.body,\{childList:true,subtree:true,attributes:true,attributeFilter:\['class'\]\}\);\}catch\(_\)\{\}\n)",r"\1    window.addEventListener('bauman:theory-content-updated',function(){load(true).then(schedule);});\n    window.addEventListener('storage',function(e){if(e&&e.key==='bauman_math_e129_theory_content_overlay_v1')load(true).then(schedule);});\n",b,count=1)
          assert n==1,n

          export_new="  window.BAUMAN_MATH_E211_READER_CONTENT={release:RELEASE,apply:apply,reload:function(){return load(true).then(schedule);},selfCheck:function(){var r=findRecord();return {ok:true,release:RELEASE,ready:ready,record:r&&(r.lessonTitle||r.lessonId)||'',mode:mode(),slideIndex:currentIndex(),formulaPopup:!!formulaPopupState,dataSource:dataSource,recordCount:records.length,dbPreferred:true,durableFallback:true};}};"
          b,n=re.subn(r"  window\.BAUMAN_MATH_E211_READER_CONTENT=\{release:RELEASE,apply:apply,selfCheck:function\(\)\{.*?\}\};",export_new,b,count=1)
          assert n==1,n

          checks=[
            "bauman:theory-content-updated" in a,
            "window.DB&&window.DB.theory_lecture_content" in b,
            "fetch('data/theory_lecture_content.json'" in b,
            "live!==lastPayloadRef" in b,
            "dataSource:dataSource" in b,
            "reload:function(){return load(true).then(schedule);}" in b,
          ]
          assert all(checks),checks
          p129.write_text(a,encoding='utf-8')
          p211.write_text(b,encoding='utf-8')

          s=ps.read_text(encoding='utf-8')
          s=re.sub(r'Current task: `[^`]+`','Current task: `THEORY_DATA_PATH_SYNCHRONIZATION_C01_L04_PASS_17`',s,count=1)
          s=re.sub(r'Status: `[^`]+`','Status: `PASS_17_DATA_PATH_SYNC_STATIC_VERIFY_PASS`',s,count=1)
          s=re.sub(r'- Runtime completion workflow: \d+/6 passes complete\.','- Runtime completion workflow: 3/6 passes complete.',s,count=1)
          s=re.sub(r'- Runtime steps complete: \d+/34\.','- Runtime steps complete: 16/34.',s,count=1)
          s=re.sub(r'- Runtime steps remaining: \d+/34\.','- Runtime steps remaining: 18/34.',s,count=1)
          report='''

## Pass 17 data-path synchronization report
- Result: `PASS_17_DATA_PATH_SYNC_STATIC_VERIFY_PASS`
- E129 dispatches `bauman:theory-content-updated` after successful runtime content application.
- E211 source priority: `window.DB.theory_lecture_content` first, durable JSON fallback second.
- E211 reloads on E129 update event, cross-tab storage update, or DB payload reference change.
- E211 lesson matching remains keyed by lessonId/title.
- E211 slide index remains synchronized with the visible E202 slide counter.
- E202 modification: `none`; C01 already derives from E129 source slides and observes DOM changes.
- Overlay consistency: `static pass`.
- Durable source consistency: `static pass`.
- Existing lessons fallback: `preserved`.
- Browser verification: `not run`.
- Next task: `PASS 18/20 — integrate Reference and Full View artifacts into runtime controls`.
'''
          if '## Pass 17 data-path synchronization report' in s:s=s.split('## Pass 17 data-path synchronization report')[0].rstrip()+report
          else:s=s.rstrip()+report
          ps.write_text(s,encoding='utf-8')
          print('PASS17_STATIC_OK')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subjects/math/assets/theory_skin/theory-tab-E129.js subjects/math/assets/theory_skin/theory-slideshow-reader-content-E211.js CODEX_STATE.md
          git commit -m "fix(math): synchronize theory runtime data paths"
          git push origin HEAD:main
