name: Pass 20 post-cleanup final browser QA
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pass20-final-browser-qa-v6.yml
permissions:
  contents: write
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          mkdir -p /tmp/pass20v6
          cd /tmp/pass20v6
          npm init -y >/dev/null 2>&1
          npm install playwright@1.51.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Prepare and run acceptance
        run: |
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE" >/tmp/pass20-v6-http.log 2>&1 &
          cp "$GITHUB_WORKSPACE/subjects/math/tests/pass20-browser-qa-v2.mjs" /tmp/pass20v6/run.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/pass20v6/run.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace("await page.waitForSelector('.e241-modal.hidden',{timeout:10000});","await page.waitForFunction(()=>document.querySelector('.e241-modal')?.classList.contains('hidden'),{timeout:10000});")
          anchor="await page.waitForFunction(()=>document.querySelector('.e132-clean-main')?.getAttribute('data-e242-slide')==='SL01',{timeout:30000});"
          extra=anchor+"\n  await page.waitForFunction(()=>document.querySelector('[data-e242-diagram]')&&document.querySelector('[data-e242-misconception]'),{timeout:30000});"
          if s.count(anchor)!=1: raise SystemExit('SL01 anchor mismatch '+str(s.count(anchor)))
          p.write_text(s.replace(anchor,extra,1),encoding='utf-8')
          PY
          cd /tmp/pass20v6
          node run.mjs
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subjects/math/PASS20_BROWSER_QA_REPORT.json
          git commit -m "test(math): record post-cleanup final pass20 QA"
          git pull --rebase origin main
          git push origin HEAD:main
