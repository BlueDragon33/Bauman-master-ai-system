name: Bauman Control Service CI

on:
  push:
    branches: [main]
    paths:
      - "control-service/**"
      - "control/application-management.contract.json"
      - "CONTROL_INTEGRATION.md"
      - ".github/workflows/control-service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "control-service/**"
      - "control/application-management.contract.json"
      - "CONTROL_INTEGRATION.md"
      - ".github/workflows/control-service-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: control-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck build and contract tests
        run: npm run gate
