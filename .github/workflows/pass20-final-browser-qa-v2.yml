name: Pass 20 final Math browser QA v2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pass20-final-browser-qa-v2.yml
permissions:
  contents: write
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          mkdir -p /tmp/pass20v2 && cd /tmp/pass20v2
          npm init -y >/dev/null 2>&1
          npm install playwright@1.51.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Run acceptance script
        env:
          NODE_PATH: /tmp/pass20v2/node_modules
        run: |
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE" >/tmp/pass20-v2-http.log 2>&1 &
          node subjects/math/tests/pass20-browser-qa-v2.mjs
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subjects/math/PASS20_BROWSER_QA_REPORT.json
          git commit -m "test(math): record corrected final pass20 browser QA"
          git pull --rebase origin main
          git push origin HEAD:main
