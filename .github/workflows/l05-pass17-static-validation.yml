name: Lesson 1.5 Pass 17 static validation
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/l05-pass17-static-validation.yml
permissions:
  contents: write
concurrency:
  group: l05-pass17-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Repair metadata and validate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('subjects/math')
          norm_path=root/'data/theory_normalization/theory_normalization_c01_l05.json'
          slide_path=root/'data/theory_slideshow/theory_slideshow_c01_l05.json'
          registry_path=root/'assets/theory_skin/theory-artifact-registry-E244.js'
          acceptance_path=root/'THEORY_C01_L05_ACADEMIC_ACCEPTANCE.json'
          state_path=Path('CODEX_STATE.md')

          raw=norm_path.read_text(encoding='utf-8')
          try: norm=json.loads(raw)
          except json.JSONDecodeError:
              pattern=re.compile(r'("displayLatex"\s*:\s*")([^"]*)(")')
              raw,count=pattern.subn(lambda m:m.group(1)+m.group(2).replace('\\','\\\\')+m.group(3),raw)
              if count!=39: raise AssertionError(('displayLatex fields',count))
              norm_path.write_text(raw,encoding='utf-8')
              norm=json.loads(raw)
          if (len(norm['canonicalNotation']),len(norm['canonicalFormulaRegistry']))!=(18,16): raise AssertionError('normalization counts')

          slide=json.loads(slide_path.read_text(encoding='utf-8'))
          misconception_ids=[s['id'] for s in slide['slides'] if s.get('misconceptionIntercept')]
          if len(misconception_ids)!=18: raise AssertionError(misconception_ids)
          slide.setdefault('coverage',{})['misconceptionSlides']=misconception_ids
          slide_path.write_text(json.dumps(slide,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          registry=registry_path.read_text(encoding='utf-8').replace(
              'expected:{slides:22,diagrams:9,retrievalChecks:10,misconceptions:17}',
              'expected:{slides:22,diagrams:9,retrievalChecks:10,misconceptions:18}'
          )
          if 'expected:{slides:22,diagrams:9,retrievalChecks:10,misconceptions:18}' not in registry: raise AssertionError('registry count')
          registry_path.write_text(registry,encoding='utf-8')

          acceptance=json.loads(acceptance_path.read_text(encoding='utf-8'))
          acceptance['artifactCounts']['misconceptionSlides']=18
          acceptance_path.write_text(json.dumps(acceptance,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          state=state_path.read_text(encoding='utf-8').replace('17 misconception slides','18 misconception slides').replace('17 misconception intercepts','18 misconception intercepts')
          state_path.write_text(state,encoding='utf-8')
          PY

          node --check subjects/math/assets/theory_skin/theory-artifact-registry-E244.js
          node --check subjects/math/assets/theory_skin/theory-artifact-reader-E241.js
          node --check subjects/math/assets/theory_skin/theory-slideshow-richness-E242.js

          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('subjects/math'); js=root/'assets/theory_skin'; state_path=Path('CODEX_STATE.md')
          L04='MATH-VN-C01-vector_trong_khong_gian_-L04-basis-span-coordinate-e140'
          L05='MATH-VN-C01-vector_trong_khong_gian_-L05-subspace-data-representation-e140'
          registry=(js/'theory-artifact-registry-E244.js').read_text(encoding='utf-8')
          reader=(js/'theory-artifact-reader-E241.js').read_text(encoding='utf-8')
          richness=(js/'theory-slideshow-richness-E242.js').read_text(encoding='utf-8')
          index=(root/'index.html').read_text(encoding='utf-8')
          checks=[]
          def ok(name,cond,detail=None):
              if not cond: raise AssertionError((name,detail))
              checks.append({'name':name,'status':'PASS','detail':detail})

          ids=re.findall(r"id:'(theory_(?:reference|full_view|normalization|slideshow)_c01_l0[45])'",registry)
          ok('two lesson IDs',L04 in registry and L05 in registry)
          ok('eight unique sources',len(ids)==8 and len(set(ids))==8,ids)
          ok('shared resolver','function resolve(values)' in registry and 'multiLessonResolver:true' in registry)
          ok('L05 count contract','expected:{slides:22,diagrams:9,retrievalChecks:10,misconceptions:18}' in registry)
          ok('reader registry',all(x in reader for x in ['BAUMAN_MATH_THEORY_ARTIFACT_REGISTRY_E244','E241_MULTI_LESSON_REFERENCE_FULL_VIEW_READER','multiLesson:true','canonicalFormulaRegistry']))
          ok('reader L05 schema',all(x in reader for x in ['modelClassification','projectorSelection','rankReporting','preprocessingGate','caseLookup','troubleshootingMatrix','terminologyLookup','interpretationLimits']))
          ok('richness registry',all(x in richness for x in ['BAUMAN_MATH_THEORY_ARTIFACT_REGISTRY_E244','E242_MULTI_LESSON_SLIDESHOW_RICHNESS','multiLesson:true','BAUMAN_MATH_E211_READER_CONTENT']))
          ok('no new engine','newSlideshowEngineCreated:false' in registry and 'newSlideshowEngineCreated:false' in reader and 'newSlideshowEngineCreated:false' in richness)
          ok('load order',index.index('theory-artifact-registry-E244.js')<index.index('theory-artifact-reader-E241.js')<index.index('theory-slideshow-richness-E242.js'))
          ok('protected scripts','theory-formula-fraction-align-E235.js?v=236' in index and all(x not in index for x in ['E236','E237','E238']))

          artifacts=[]
          configs={
            L04:{'reference':('data/theory_reference/theory_reference_c01_l04.json','REFERENCE_C01_L04_V1_APPROVED'),'fullView':('data/theory_full_view/theory_full_view_c01_l04.json','FULL_VIEW_C01_L04_V1_APPROVED'),'normalization':('data/theory_normalization/theory_normalization_c01_l04.json','NORMALIZATION_C01_L04_V1_APPROVED'),'slideshow':('data/theory_slideshow/theory_slideshow_c01_l04.json','SLIDESHOW_C01_L04_V1_APPROVED',(22,8,9,16))},
            L05:{'reference':('data/theory_reference/theory_reference_c01_l05.json','REFERENCE_C01_L05_V1_PASS11'),'fullView':('data/theory_full_view/theory_full_view_c01_l05.json','FULL_VIEW_C01_L05_V1_PASS12'),'normalization':('data/theory_normalization/theory_normalization_c01_l05.json','NORMALIZATION_C01_L05_V1_PASS12'),'slideshow':('data/theory_slideshow/theory_slideshow_c01_l05.json','SLIDESHOW_C01_L05_V1_PASS13',(22,9,10,18))}
          }
          for lesson,items in configs.items():
              for kind,(rel,version,*extra) in items.items():
                  obj=json.loads((root/rel).read_text(encoding='utf-8'))
                  ok(kind+' lesson',obj['lessonId']==lesson,(lesson,rel))
                  ok(kind+' version',obj['version']==version,(obj['version'],version))
                  row={'lessonId':lesson,'kind':kind,'path':rel,'version':version}
                  if kind=='normalization':
                      actual=(len(obj['canonicalNotation']),len(obj['canonicalFormulaRegistry'])); expected=(11,12) if lesson==L04 else (18,16)
                      ok('normalization counts',actual==expected,(actual,expected))
                  if kind=='slideshow':
                      slides=obj['slides']; actual=(len(slides),sum('diagramSpec' in s for s in slides),sum('retrievalCheck' in s for s in slides),sum('misconceptionIntercept' in s for s in slides)); expected=extra[0]
                      ok('slideshow counts',actual==expected,(lesson,actual,expected))
                      ok('slide order',[s['id'] for s in slides]==[f'SL{i:02d}' for i in range(1,23)],lesson)
                      if lesson==L05: ok('L05 coverage IDs',obj['coverage']['misconceptionSlides']==[s['id'] for s in slides if s.get('misconceptionIntercept')])
                      else: ok('L04 historical count',obj['sourceTraceability']['misconceptionIntercepts']==16)
                      row['counts']={'slides':actual[0],'diagrams':actual[1],'retrievalChecks':actual[2],'misconceptions':actual[3]}
                  artifacts.append(row)

          acceptance=json.loads((root/'THEORY_C01_L05_ACADEMIC_ACCEPTANCE.json').read_text(encoding='utf-8'))
          ok('acceptance count',acceptance['artifactCounts']['misconceptionSlides']==18)
          report={'id':'bauman_math_c01_l05_runtime_pass17_v1','schema':'bauman_math_runtime_reader_richness_report_v1','version':'RUNTIME_PASS17_C01_L05_V1','status':'PASS_17_MULTI_LESSON_READER_RICHNESS_STATIC_VERIFY_PASS','date':'2026-07-09','lessonId':L05,'verificationMode':'isolated_pull_request_node_syntax_python_json_contract_validation','browserRun':False,'normalizationJsonRepair':{'path':'subjects/math/data/theory_normalization/theory_normalization_c01_l05.json','scope':'39 displayLatex backslash escapes only','semanticChanges':False,'jsonParseAfterRepair':True},'richnessCountCorrection':{'oldMetadata':17,'actualAndAccepted':18,'contentRemoved':False,'coverageRegeneratedFromSlides':True},'registeredLessons':2,'registeredSources':8,'artifacts':artifacts,'checks':checks,'protectedConstraints':{'existingE202EngineReused':True,'newSlideshowEngineCreated':False,'e235Modified':False,'e236Enabled':False,'e237Enabled':False,'e238Enabled':False},'runtimeProgress':{'completedPasses':3,'totalPasses':5,'remainingPasses':2},'nextTask':'THEORY_C01_L05_ROUTE_IDENTITY_SYNC_PASS_18'}
          (root/'THEORY_C01_L05_RUNTIME_PASS17.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          state=state_path.read_text(encoding='utf-8').replace('Current task: `THEORY_C01_L05_MULTI_LESSON_READER_RICHNESS_PASS_17`','Current task: `THEORY_C01_L05_ROUTE_IDENTITY_SYNC_PASS_18`',1).replace('Status: `PASS_16_RUNTIME_SOURCE_REGISTRATION_STATIC_VERIFY_PASS`','Status: `PASS_17_MULTI_LESSON_READER_RICHNESS_STATIC_VERIFY_PASS`',1).replace('Runtime passes complete: `2/5`.','Runtime passes complete: `3/5`.',1).replace('Runtime passes remaining: `3/5`.','Runtime passes remaining: `2/5`.',1)
          state+='''\n\n### Runtime Pass 17 · Multi-lesson reader and richness\n- Status: `PASS_17_MULTI_LESSON_READER_RICHNESS_STATIC_VERIFY_PASS`.\n- Report: `subjects/math/THEORY_C01_L05_RUNTIME_PASS17.json`.\n- E244 registry: 2 lessons, 8 optional sources.\n- E241/E242: multi-lesson and reuse E202/E211.\n- L04: 22 slides, 8 diagrams, 9 retrieval checks, 16 misconception intercepts.\n- L05: 22 slides, 9 diagrams, 10 retrieval checks, 18 misconception intercepts.\n- Normalization JSON escaping repaired without semantic change.\n- Node syntax and JSON contract checks: PASS.\n- E235 unchanged; E236/E237/E238 disabled.\n- Browser QA: not run.\n- Next: `THEORY_C01_L05_ROUTE_IDENTITY_SYNC_PASS_18`.\n'''
          state_path.write_text(state,encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit validated Pass 17
        run: |
          git rm --ignore-unmatch .github/workflows/l05-pass17-static-validation.yml
          git rm --ignore-unmatch subjects/math/THEORY_C01_L05_RUNTIME_PASS17_DIAGNOSTIC.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CODEX_STATE.md subjects/math/assets/theory_skin/theory-artifact-registry-E244.js subjects/math/data/theory_normalization/theory_normalization_c01_l05.json subjects/math/data/theory_slideshow/theory_slideshow_c01_l05.json subjects/math/THEORY_C01_L05_ACADEMIC_ACCEPTANCE.json subjects/math/THEORY_C01_L05_RUNTIME_PASS17.json
          git commit -m "test(math): validate lesson 1.5 multi-lesson readers"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
