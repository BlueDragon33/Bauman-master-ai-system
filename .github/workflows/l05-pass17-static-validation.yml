name: Lesson 1.5 Pass 17 static validation
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/l05-pass17-static-validation.yml
permissions:
  contents: write
concurrency:
  group: l05-pass17-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Capture diagnostics
        run: |
          set +e
          mkdir -p /tmp/l05-pass17
          node --check subjects/math/assets/theory_skin/theory-artifact-registry-E244.js >/tmp/l05-pass17/e244.txt 2>&1
          echo $? >/tmp/l05-pass17/e244.rc
          node --check subjects/math/assets/theory_skin/theory-artifact-reader-E241.js >/tmp/l05-pass17/e241.txt 2>&1
          echo $? >/tmp/l05-pass17/e241.rc
          node --check subjects/math/assets/theory_skin/theory-slideshow-richness-E242.js >/tmp/l05-pass17/e242.txt 2>&1
          echo $? >/tmp/l05-pass17/e242.rc
          python3 - <<'PY'
          import json, re, traceback
          from pathlib import Path
          root=Path('subjects/math')
          diag={'id':'bauman_math_c01_l05_pass17_diagnostic_v1','status':'DIAGNOSTIC','date':'2026-07-09','node':{},'python':{}}
          for key in ('e244','e241','e242'):
              diag['node'][key]={'returnCode':int(Path(f'/tmp/l05-pass17/{key}.rc').read_text().strip()),'output':Path(f'/tmp/l05-pass17/{key}.txt').read_text(errors='replace')}
          try:
              registry=(root/'assets/theory_skin/theory-artifact-registry-E244.js').read_text(encoding='utf-8')
              reader=(root/'assets/theory_skin/theory-artifact-reader-E241.js').read_text(encoding='utf-8')
              richness=(root/'assets/theory_skin/theory-slideshow-richness-E242.js').read_text(encoding='utf-8')
              index=(root/'index.html').read_text(encoding='utf-8')
              L04='MATH-VN-C01-vector_trong_khong_gian_-L04-basis-span-coordinate-e140'
              L05='MATH-VN-C01-vector_trong_khong_gian_-L05-subspace-data-representation-e140'
              assertions=[]
              def check(name,condition,detail=None):
                  assertions.append({'name':name,'pass':bool(condition),'detail':detail})
                  if not condition: raise AssertionError(f'{name}: {detail!r}')
              check('registry L04',L04 in registry)
              check('registry L05',L05 in registry)
              ids=re.findall(r"id:'(theory_(?:reference|full_view|normalization|slideshow)_c01_l0[45])'",registry)
              check('eight IDs',len(ids)==8 and len(set(ids))==8,ids)
              check('reader registry','BAUMAN_MATH_THEORY_ARTIFACT_REGISTRY_E244' in reader)
              check('richness registry','BAUMAN_MATH_THEORY_ARTIFACT_REGISTRY_E244' in richness)
              check('index order',index.index('theory-artifact-registry-E244.js')<index.index('theory-artifact-reader-E241.js')<index.index('theory-slideshow-richness-E242.js'))
              specs={
                L04:{'reference':('data/theory_reference/theory_reference_c01_l04.json','REFERENCE_C01_L04_V1_APPROVED'),'fullView':('data/theory_full_view/theory_full_view_c01_l04.json','FULL_VIEW_C01_L04_V1_APPROVED'),'normalization':('data/theory_normalization/theory_normalization_c01_l04.json','NORMALIZATION_C01_L04_V1_APPROVED'),'slideshow':('data/theory_slideshow/theory_slideshow_c01_l04.json','SLIDESHOW_C01_L04_V1_APPROVED',(22,8,9,16))},
                L05:{'reference':('data/theory_reference/theory_reference_c01_l05.json','REFERENCE_C01_L05_V1_PASS11'),'fullView':('data/theory_full_view/theory_full_view_c01_l05.json','FULL_VIEW_C01_L05_V1_PASS12'),'normalization':('data/theory_normalization/theory_normalization_c01_l05.json','NORMALIZATION_C01_L05_V1_PASS12'),'slideshow':('data/theory_slideshow/theory_slideshow_c01_l05.json','SLIDESHOW_C01_L05_V1_PASS13',(22,9,10,17))}
              }
              for lesson,items in specs.items():
                  for kind,spec in items.items():
                      obj=json.loads((root/spec[0]).read_text(encoding='utf-8'))
                      check(f'{kind} lesson',obj.get('lessonId')==lesson,(obj.get('lessonId'),lesson))
                      check(f'{kind} version',obj.get('version')==spec[1],(obj.get('version'),spec[1]))
                      if kind=='slideshow':
                          slides=obj.get('slides',[])
                          counts=(len(slides),sum('diagramSpec' in s for s in slides),sum('retrievalCheck' in s for s in slides),sum('misconceptionIntercept' in s for s in slides))
                          check('slideshow counts',counts==spec[2],counts)
              diag['python']={'status':'PASS','assertions':assertions}
          except Exception as exc:
              diag['python']={'status':'FAIL','error':repr(exc),'traceback':traceback.format_exc(),'assertions':locals().get('assertions',[])}
          diag['overallPass']=all(x['returnCode']==0 for x in diag['node'].values()) and diag['python'].get('status')=='PASS'
          (root/'THEORY_C01_L05_RUNTIME_PASS17_DIAGNOSTIC.json').write_text(json.dumps(diag,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(diag,ensure_ascii=False,indent=2))
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subjects/math/THEORY_C01_L05_RUNTIME_PASS17_DIAGNOSTIC.json
          git commit -m "test(math): capture lesson 1.5 Pass 17 diagnostics"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
