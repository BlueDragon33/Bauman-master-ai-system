name: Lesson 1.5 Pass 17 static validation
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/l05-pass17-static-validation.yml
permissions:
  contents: write
concurrency:
  group: l05-pass17-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Capture post-repair diagnostics
        run: |
          set +e
          python3 - <<'PY'
          import json, re, subprocess, traceback
          from pathlib import Path
          root=Path('subjects/math')
          norm_path=root/'data/theory_normalization/theory_normalization_c01_l05.json'
          diag={'id':'bauman_math_c01_l05_pass17_diagnostic_v2','status':'DIAGNOSTIC','date':'2026-07-09','node':{},'repair':{},'python':{}}
          for key,file in [('e244','theory-artifact-registry-E244.js'),('e241','theory-artifact-reader-E241.js'),('e242','theory-slideshow-richness-E242.js')]:
              p=subprocess.run(['node','--check',str(root/'assets/theory_skin'/file)],capture_output=True,text=True)
              diag['node'][key]={'returnCode':p.returncode,'output':p.stdout+p.stderr}
          raw=norm_path.read_text(encoding='utf-8')
          diag['repair']['parseBefore']=True
          try:
              json.loads(raw)
              repaired_raw=raw
              diag['repair']['matchedFields']=0
          except Exception as exc:
              diag['repair']['parseBefore']=False
              diag['repair']['beforeError']=repr(exc)
              pattern=re.compile(r'("displayLatex"\s*:\s*")([^"]*)(")')
              def fix(m): return m.group(1)+m.group(2).replace('\\','\\\\')+m.group(3)
              repaired_raw,count=pattern.subn(fix,raw)
              diag['repair']['matchedFields']=count
          try:
              norm_obj=json.loads(repaired_raw)
              diag['repair']['parseAfter']=True
              diag['repair']['notationCount']=len(norm_obj.get('canonicalNotation',[]))
              diag['repair']['formulaCount']=len(norm_obj.get('canonicalFormulaRegistry',[]))
          except Exception as exc:
              diag['repair']['parseAfter']=False
              diag['repair']['afterError']=repr(exc)
              diag['repair']['traceback']=traceback.format_exc()
              norm_obj=None
          try:
              registry=(root/'assets/theory_skin/theory-artifact-registry-E244.js').read_text(encoding='utf-8')
              reader=(root/'assets/theory_skin/theory-artifact-reader-E241.js').read_text(encoding='utf-8')
              richness=(root/'assets/theory_skin/theory-slideshow-richness-E242.js').read_text(encoding='utf-8')
              index=(root/'index.html').read_text(encoding='utf-8')
              L04='MATH-VN-C01-vector_trong_khong_gian_-L04-basis-span-coordinate-e140'
              L05='MATH-VN-C01-vector_trong_khong_gian_-L05-subspace-data-representation-e140'
              assertions=[]
              def check(name,condition,detail=None):
                  assertions.append({'name':name,'pass':bool(condition),'detail':detail})
                  if not condition: raise AssertionError(f'{name}: {detail!r}')
              check('node all',all(x['returnCode']==0 for x in diag['node'].values()),diag['node'])
              check('normalization parse after',diag['repair'].get('parseAfter') is True,diag['repair'])
              check('normalization counts',len(norm_obj.get('canonicalNotation',[]))==18 and len(norm_obj.get('canonicalFormulaRegistry',[]))==16,(len(norm_obj.get('canonicalNotation',[])),len(norm_obj.get('canonicalFormulaRegistry',[]))))
              ids=re.findall(r"id:'(theory_(?:reference|full_view|normalization|slideshow)_c01_l0[45])'",registry)
              check('eight registry IDs',len(ids)==8 and len(set(ids))==8,ids)
              check('index order',index.index('theory-artifact-registry-E244.js')<index.index('theory-artifact-reader-E241.js')<index.index('theory-slideshow-richness-E242.js'))
              specs={L04:('data/theory_slideshow/theory_slideshow_c01_l04.json','SLIDESHOW_C01_L04_V1_APPROVED',(22,8,9,16)),L05:('data/theory_slideshow/theory_slideshow_c01_l05.json','SLIDESHOW_C01_L05_V1_PASS13',(22,9,10,17))}
              for lesson,(rel,version,expected) in specs.items():
                  obj=json.loads((root/rel).read_text(encoding='utf-8'))
                  slides=obj['slides']
                  counts=(len(slides),sum('diagramSpec' in s for s in slides),sum('retrievalCheck' in s for s in slides),sum('misconceptionIntercept' in s for s in slides))
                  check('slideshow lesson',obj['lessonId']==lesson,(obj['lessonId'],lesson))
                  check('slideshow version',obj['version']==version,(obj['version'],version))
                  check('slideshow counts',counts==expected,(counts,expected))
              diag['python']={'status':'PASS','assertions':assertions}
          except Exception as exc:
              diag['python']={'status':'FAIL','error':repr(exc),'traceback':traceback.format_exc(),'assertions':locals().get('assertions',[])}
          diag['overallPass']=all(x['returnCode']==0 for x in diag['node'].values()) and diag['repair'].get('parseAfter') is True and diag['python'].get('status')=='PASS'
          (root/'THEORY_C01_L05_RUNTIME_PASS17_DIAGNOSTIC.json').write_text(json.dumps(diag,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(diag,ensure_ascii=False,indent=2))
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subjects/math/THEORY_C01_L05_RUNTIME_PASS17_DIAGNOSTIC.json
          git commit -m "test(math): capture post-repair Pass 17 diagnostics"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
