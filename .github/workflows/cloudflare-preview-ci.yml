name: Bauman Cloudflare Preview CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-preview-ci.yml"
      - ".github/workflows/deploy-bauman-preview.yml"
      - "cloudflare/**"
      - "wrangler.runtime.preview.example.jsonc"
      - "scripts/prepare-cloudflare-preview.mjs"
      - "scripts/validate-cloudflare-preview.mjs"
      - "index.html"
      - "assets/css/academic-2026.css"
      - "assets/data/official-curriculum-iu5-2026.json"
      - "assets/data/prerequisite-registry-iu5-2026.json"
      - "assets/data/prerequisite-packs/**"
      - "assets/js/academic-main.js"
      - "assets/js/academic-scheduler-preview.js"
      - "assets/js/academic-scheduler-apply.js"
      - "assets/js/platform/runtime-config.js"
      - "assets/js/platform/device-access-gate.js"
      - "subjects/**"
      - "control-service/**"
      - "foundation/content-registry/**"
      - "scripts/validate-foundation-l10-promotion.mjs"
      - ".github/workflows/content-asset-provenance-gate.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-preview-ci.yml"
      - ".github/workflows/deploy-bauman-preview.yml"
      - "cloudflare/**"
      - "wrangler.runtime.preview.example.jsonc"
      - "scripts/prepare-cloudflare-preview.mjs"
      - "scripts/validate-cloudflare-preview.mjs"
      - "index.html"
      - "assets/css/academic-2026.css"
      - "assets/data/official-curriculum-iu5-2026.json"
      - "assets/data/prerequisite-registry-iu5-2026.json"
      - "assets/data/prerequisite-packs/**"
      - "assets/js/academic-main.js"
      - "assets/js/academic-scheduler-preview.js"
      - "assets/js/academic-scheduler-apply.js"
      - "assets/js/platform/runtime-config.js"
      - "assets/js/platform/device-access-gate.js"
      - "subjects/**"
      - "control-service/**"
      - "foundation/content-registry/**"
      - "scripts/validate-foundation-l10-promotion.mjs"
      - ".github/workflows/content-asset-provenance-gate.yml"

permissions:
  contents: read

jobs:
  preview-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BAUMAN_CONTROL_PREVIEW_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
      BAUMAN_CONTROL_PRODUCTION_D1_DATABASE_ID: 22222222-2222-4222-8222-222222222222
      APPLICATION_MANAGEMENT_PREVIEW_ORIGIN: https://application-management-preview.example.com
      BAUMAN_CONTROL_PREVIEW_ORIGIN: https://bauman-control-preview.example.com
      BAUMAN_RUNTIME_PREVIEW_ORIGIN: https://bauman-runtime-preview.example.com

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install Bauman Control dependencies
        working-directory: control-service
        run: npm ci --no-audit --no-fund

      - name: Validate migration boundary
        run: node scripts/validate-cloudflare-preview.mjs

      - name: Preserve runtime device-gate regression
        run: node scripts/runtime-device-gate-regression.mjs

      - name: Preserve Bauman Control contract
        working-directory: control-service
        run: npm run gate

      - name: Materialize isolated preview configs
        run: node scripts/prepare-cloudflare-preview.mjs

      - name: Verify Academic 2026 runtime is present in packaged preview
        shell: bash
        run: |
          set -euo pipefail
          test -f runtime-dist/assets/js/academic-main.js
          test -f runtime-dist/assets/js/academic-scheduler-preview.js
          test -f runtime-dist/assets/js/academic-scheduler-apply.js
          test -f runtime-dist/assets/css/academic-2026.css
          test -f runtime-dist/assets/data/official-curriculum-iu5-2026.json
          test -f runtime-dist/assets/data/prerequisite-registry-iu5-2026.json
          grep -q 'assets/js/academic-main.js' runtime-dist/index.html
          grep -q 'assets/js/academic-scheduler-preview.js' runtime-dist/index.html
          grep -q 'assets/js/academic-scheduler-apply.js' runtime-dist/index.html

      - name: Verify Subject Web Apps and Russian chunk manifests
        shell: bash
        run: |
          set -euo pipefail
          test -f runtime-dist/subjects/russian/index.html
          test -f runtime-dist/subjects/russian/assets/core.js
          test -f runtime-dist/subjects/russian/assets/russian-reference-ui.js
          test -f runtime-dist/subjects/russian/assets/russian-reference-ui-polish.css
          test -f runtime-dist/subjects/russian/assets/russian-optional-data-loader.js
          test -f runtime-dist/subjects/russian/data/chunks/dialogue-bauman-az/manifest.json
          test -f runtime-dist/subjects/russian/data/chunks/deep-speaking-bauman/manifest.json
          test ! -f runtime-dist/subjects/russian/data/dialogue-bauman-az.json
          test ! -f runtime-dist/subjects/russian/data/deep-speaking-bauman.json
          grep -q 'assets/russian-reference-ui-polish.css' runtime-dist/subjects/russian/index.html
          grep -q 'assets/russian-optional-data-loader.js' runtime-dist/subjects/russian/index.html
          grep -q 'assets/russian-reference-ui.js' runtime-dist/subjects/russian/index.html
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const base='runtime-dist/subjects/russian/data/chunks';
          for (const dataset of ['dialogue-bauman-az','deep-speaking-bauman']) {
            const dir=path.join(base,dataset);
            const manifest=JSON.parse(fs.readFileSync(path.join(dir,'manifest.json'),'utf8'));
            if (manifest.format !== 'json-array-chunks-v1') throw new Error(`${dataset}: invalid manifest format`);
            if (!Array.isArray(manifest.chunks) || !manifest.chunks.length) throw new Error(`${dataset}: no chunks`);
            let count=0;
            for (const chunk of manifest.chunks) {
              const file=path.join(dir,chunk.file);
              if (!fs.existsSync(file)) throw new Error(`${dataset}: missing ${chunk.file}`);
              const size=fs.statSync(file).size;
              if (size >= 24*1024*1024) throw new Error(`${dataset}: ${chunk.file} exceeds safety limit`);
              const rows=JSON.parse(fs.readFileSync(file,'utf8'));
              if (!Array.isArray(rows)) throw new Error(`${dataset}: ${chunk.file} is not an array`);
              if (rows.length !== Number(chunk.count)) throw new Error(`${dataset}: count mismatch in ${chunk.file}`);
              count += rows.length;
            }
            if (count !== Number(manifest.count)) throw new Error(`${dataset}: manifest total mismatch`);
          }
          NODE

      - name: Verify control preview artifact without deployment
        working-directory: control-service
        run: npx wrangler deploy --dry-run --outdir dist-preview --config wrangler.preview.jsonc

      - name: Verify learning runtime preview artifact without deployment
        run: npx --yes wrangler@4.92.0 deploy --dry-run --outdir .wrangler/runtime-preview --config wrangler.runtime.preview.jsonc

      - name: Assert generated configs remain preview-only
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'bauman-control-preview-db' control-service/wrangler.preview.jsonc
          grep -q 'bauman-master-ai-preview' wrangler.runtime.preview.jsonc
          if grep -R '00000000-0000-0000-0000-000000000002' control-service/wrangler.preview.jsonc; then
            echo '::error::Generated preview config references local D1.'
            exit 1
          fi
          if grep -R '22222222-2222-4222-8222-222222222222' control-service/wrangler.preview.jsonc; then
            echo '::error::Generated preview config references production D1.'
            exit 1
          fi
