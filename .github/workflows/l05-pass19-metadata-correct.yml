name: Correct Lesson 1.5 Pass 19 metadata
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/l05-pass19-metadata-correct.yml
permissions:
  contents: write
jobs:
  correct:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false
      - name: Correct report and handoff metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          tested='cb328018e2221d5a5d3650d8ef753e0ca173016e'
          e242='58bab8bd2e131b8250f01a83eb6b611afa0fd2f0'
          e245='8792f6350247a6cbb08b23e13ee4c4dcb248c5d1'
          index_commit='3f9a0af0fd0af7e81330cae7b18649daa7348f34'

          report_path=Path('subjects/math/THEORY_C01_L05_RUNTIME_PASS19.json')
          report=json.loads(report_path.read_text(encoding='utf-8'))
          if report.get('status')!='PASS':
              raise SystemExit('Pass 19 report is not PASS')
          if report.get('acceptance',{}).get('l04SlidesVerified')!=22 or report.get('acceptance',{}).get('l05SlidesVerified')!=22:
              raise SystemExit('44-slide acceptance evidence missing')
          if report.get('unregisteredL06',{}).get('actions')!=0 or report.get('unregisteredL06',{}).get('markers')!=0:
              raise SystemExit('L06 cleanup evidence missing')

          report['testedRuntimeCommit']=tested
          report['runtimeRepairs']={
              'E242':{'commit':e242,'purpose':'Reapply required richness after Reader/artifact rerenders and reject stale richness markers.'},
              'E245':{'commit':e245,'path':'subjects/math/assets/theory_skin/theory-artifact-authoritative-route-E245.js','purpose':'Treat the deck/Reader lesson ID as authoritative and block fallback into a stale registered lesson.'},
              'indexLoadOrder':{'commit':index_commit,'path':'subjects/math/index.html','order':'E244 → E245 → E241 → E242'}
          }
          report['evidenceArtifact']='lesson-1-5-pass19-revalidation-v4'
          report['acceptance']['unregisteredL06Controls']=0
          report['acceptance']['authoritativeUnregisteredLessonFallbackBlocked']=True
          report['finalRuntimeState']='ACADEMIC_14_OF_14_PASS_RUNTIME_5_OF_5_BROWSER_ACCEPTED'
          report_path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          state_path=Path('CODEX_STATE.md')
          state=state_path.read_text(encoding='utf-8')
          state=state.replace('Tested runtime commit: `3acd90894051e86df6c93fadd1e84b54f283b021`.',f'Tested runtime commit: `{tested}`.',1)
          marker='- E242 repair commit: `58bab8bd2e131b8250f01a83eb6b611afa0fd2f0`.'
          replacement=marker+'\n- E245 authoritative artifact route commit: `'+e245+'`.\n- E245 index load-order commit: `'+index_commit+'`.\n- Unregistered §1.6 returned zero E241 controls and zero E242 richness markers.'
          state=state.replace(marker,replacement,1)
          state_path.write_text(state,encoding='utf-8')
          PY
      - name: Remove workflow and commit metadata
        run: |
          git rm .github/workflows/l05-pass19-metadata-correct.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CODEX_STATE.md subjects/math/THEORY_C01_L05_RUNTIME_PASS19.json
          git commit -m "docs(math): correct lesson 1.5 Chromium acceptance metadata"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
