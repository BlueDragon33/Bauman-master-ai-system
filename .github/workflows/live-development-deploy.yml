name: Bauman Live Development Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bauman-live-development
  cancel-in-progress: true

jobs:
  deploy-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    environment: bauman-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BAUMAN_CONTROL_PREVIEW_D1_DATABASE_ID: ${{ secrets.BAUMAN_CONTROL_PREVIEW_D1_DATABASE_ID }}
      BAUMAN_CONTROL_PRODUCTION_D1_DATABASE_ID: ${{ secrets.BAUMAN_CONTROL_PRODUCTION_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN }}
      BAUMAN_CONTROL_PREVIEW_ORIGIN: ${{ vars.BAUMAN_CONTROL_PREVIEW_ORIGIN }}
      BAUMAN_RUNTIME_PREVIEW_ORIGIN: ${{ vars.BAUMAN_RUNTIME_PREVIEW_ORIGIN }}
      BAUMAN_CONTROL_PRODUCTION_ORIGIN: ${{ vars.BAUMAN_CONTROL_PRODUCTION_ORIGIN }}
      BAUMAN_RUNTIME_PRODUCTION_ORIGIN: ${{ vars.BAUMAN_RUNTIME_PRODUCTION_ORIGIN }}
      BAUMAN_ACCESS_MODE: standalone

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Detect live readiness
        id: ready
        shell: bash
        run: |
          missing=()
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BAUMAN_CONTROL_PREVIEW_D1_DATABASE_ID BAUMAN_CONTROL_PRODUCTION_D1_DATABASE_ID APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN BAUMAN_CONTROL_PREVIEW_ORIGIN BAUMAN_RUNTIME_PREVIEW_ORIGIN BAUMAN_CONTROL_PRODUCTION_ORIGIN BAUMAN_RUNTIME_PRODUCTION_ORIGIN; do
            [[ -n "${!key:-}" ]] || missing+=("$key")
          done
          if (( ${#missing[@]} )); then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Bauman live publish skipped; missing: ${missing[*]}"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Control dependencies
        if: steps.ready.outputs.deploy == 'true'
        working-directory: control-service
        run: npm ci --no-audit --no-fund

      - name: Materialize standalone live configs
        if: steps.ready.outputs.deploy == 'true'
        run: node scripts/prepare-cloudflare-production.mjs

      - name: Apply Control D1 migrations
        if: steps.ready.outputs.deploy == 'true'
        working-directory: control-service
        run: npx wrangler d1 migrations apply bauman-control-db --remote --config wrangler.production.jsonc

      - name: Deploy Control live Worker
        if: steps.ready.outputs.deploy == 'true'
        working-directory: control-service
        run: npx wrangler deploy --config wrangler.production.jsonc

      - name: Deploy Learning Runtime live Worker
        if: steps.ready.outputs.deploy == 'true'
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.runtime.production.jsonc

      - name: Verify live Control and Runtime availability
        if: steps.ready.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking exact Control deployment revision..."
          BAUMAN_DEPLOYMENT_URL="$BAUMAN_CONTROL_PRODUCTION_ORIGIN/__deployment" \
          BAUMAN_EXPECTED_REVISION="$GITHUB_SHA" \
          BAUMAN_EXPECTED_CHANNEL="cloudflare-production" \
          BAUMAN_EXPECTED_RUNTIME="control-service" \
          node scripts/wait-cloudflare-deployment-revision.mjs > /tmp/bauman-live-control.json

          echo "Checking exact Learning Runtime deployment revision..."
          BAUMAN_DEPLOYMENT_URL="$BAUMAN_RUNTIME_PRODUCTION_ORIGIN/__deployment" \
          BAUMAN_EXPECTED_REVISION="$GITHUB_SHA" \
          BAUMAN_EXPECTED_CHANNEL="cloudflare-production" \
          BAUMAN_EXPECTED_RUNTIME="learning-runtime" \
          node scripts/wait-cloudflare-deployment-revision.mjs > /tmp/bauman-live-runtime.json

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const control = JSON.parse(fs.readFileSync('/tmp/bauman-live-control.json', 'utf8'));
          const runtime = JSON.parse(fs.readFileSync('/tmp/bauman-live-runtime.json', 'utf8'));
          if (control.ok !== true || control.databaseReady !== true) throw new Error('Live Control D1 readiness is not proven.');
          if (control.controlSecretConfigured !== true) throw new Error('Live Control secret readiness is not proven.');
          if (control.applicationManagementOriginConfigured !== true) throw new Error('Application Management origin is not configured on live Control.');
          if (control.appOriginConfigured !== true) throw new Error('Learning Runtime origin is not configured on live Control.');
          if (runtime.ok !== true || runtime.controlOriginConfigured !== true) throw new Error('Live Runtime → Control origin configuration is not proven.');
          if (runtime.accessMode !== 'standalone') throw new Error('Live Development runtime must be standalone.');
          if (runtime.serverSideLearningGate !== false) throw new Error('Standalone runtime must not require the managed server-side learning gate.');
          NODE

          echo "Checking anonymous Control access remains fail-closed..."
          CONTROL_STATUS_CODE="$(curl --silent --show-error --output /tmp/bauman-live-status-anonymous.json --write-out '%{http_code}' --max-time 20 "$BAUMAN_CONTROL_PRODUCTION_ORIGIN/api/control/status" || true)"
          if [[ "$CONTROL_STATUS_CODE" != "403" ]]; then
            echo "::error::Anonymous Bauman Control status must return HTTP 403; got $CONTROL_STATUS_CODE."
            cat /tmp/bauman-live-status-anonymous.json || true
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/bauman-live-status-anonymous.json', 'utf8'));
          if (payload.code !== 'CONTROL_TICKET_FORBIDDEN') throw new Error('Anonymous Control status did not fail closed with CONTROL_TICKET_FORBIDDEN.');
          NODE

          echo "Checking public homepage..."
          HOME_OK=false
          for i in {1..15}; do
            STATUS="$(curl --silent --show-error --location --output /tmp/bauman-live-home.html --write-out '%{http_code}' --max-time 15 "$BAUMAN_RUNTIME_PRODUCTION_ORIGIN/" || true)"
            if [[ "$STATUS" == "200" ]] && grep -Fqi '<html' /tmp/bauman-live-home.html && grep -Fq 'Bauman Master Hub' /tmp/bauman-live-home.html; then
              HOME_OK=true
              break
            fi
            echo "Homepage not ready yet (attempt $i, HTTP $STATUS)."
            sleep 2
          done
          if [[ "$HOME_OK" != "true" ]]; then
            echo "::error::Bauman public homepage is not reachable or returned unexpected content."
            head -c 1200 /tmp/bauman-live-home.html || true
            exit 1
          fi

          echo "Checking study-plan module routes..."
          while IFS='|' read -r SUBJECT_PATH SUBJECT_MARKER; do
            [[ -n "$SUBJECT_PATH" ]] || continue
            SUBJECT_OK=false
            SAFE_NAME="$(printf '%s' "$SUBJECT_PATH" | tr '/-' '__')"
            for i in {1..10}; do
              STATUS="$(curl --silent --show-error --location --output "/tmp/bauman-live-${SAFE_NAME}.html" --write-out '%{http_code}' --max-time 15 "$BAUMAN_RUNTIME_PRODUCTION_ORIGIN/$SUBJECT_PATH" || true)"
              if [[ "$STATUS" == "200" ]] && grep -Fqi '<html' "/tmp/bauman-live-${SAFE_NAME}.html" && grep -Fq "$SUBJECT_MARKER" "/tmp/bauman-live-${SAFE_NAME}.html"; then
                SUBJECT_OK=true
                break
              fi
              echo "Subject route $SUBJECT_PATH not ready yet (attempt $i, HTTP $STATUS)."
              sleep 2
            done
            if [[ "$SUBJECT_OK" != "true" ]]; then
              echo "::error::Study-plan module route failed: $SUBJECT_PATH"
              head -c 1200 "/tmp/bauman-live-${SAFE_NAME}.html" || true
              exit 1
            fi
          done <<'SUBJECT_ROUTES'
          subjects/entrepreneurship/|Основы предпринимательства
          subjects/ergonomics/|Эргономический анализ
          subjects/mivar/|Миварные технологии
          subjects/foreign-language/|Иностранный язык
          subjects/security-elective/|Elective 1
          subjects/specialization-elective/|Дисциплина по выбору №2
          subjects/practice-workflow/|Practice Workflow
          SUBJECT_ROUTES

          echo "Study-plan module routes PASS."

          echo "Checking every manifest-driven study-plan runtime route..."
          node scripts/list-study-plan-runtime-routes.mjs > /tmp/bauman-study-plan-routes.txt
          ROUTE_COUNT="$(wc -l < /tmp/bauman-study-plan-routes.txt | tr -d ' ')"
          if (( ROUTE_COUNT < 13 )); then
            echo "::error::Expected at least 13 manifest-driven study-plan runtime routes; got $ROUTE_COUNT."
            cat /tmp/bauman-study-plan-routes.txt || true
            exit 1
          fi
          while IFS= read -r SUBJECT_PATH; do
            [[ -n "$SUBJECT_PATH" ]] || continue
            SAFE_NAME="$(printf '%s' "$SUBJECT_PATH" | tr '/-' '__')"
            OUT_FILE="/tmp/bauman-live-all-$SAFE_NAME.html"
            STATUS="$(curl --silent --show-error --location --output "$OUT_FILE" --write-out '%{http_code}' --max-time 20 "$BAUMAN_RUNTIME_PRODUCTION_ORIGIN/$SUBJECT_PATH" || true)"
            if [[ "$STATUS" != "200" ]] || ! grep -Fqi '<html' "$OUT_FILE"; then
              echo "::error::Manifest-driven study-plan route failed: $SUBJECT_PATH (HTTP $STATUS)"
              head -c 1200 "$OUT_FILE" || true
              exit 1
            fi
          done < /tmp/bauman-study-plan-routes.txt
          echo "All manifest-driven study-plan runtime routes PASS ($ROUTE_COUNT routes)."

          echo "Checking standalone learning-data access..."
          DATA_STATUS="$(curl --silent --show-error --location --output /tmp/bauman-live-entrepreneurship-curriculum.json --write-out '%{http_code}' --max-time 15 "$BAUMAN_RUNTIME_PRODUCTION_ORIGIN/subjects/entrepreneurship/data/curriculum.json" || true)"
          if [[ "$DATA_STATUS" != "200" ]]; then
            echo "::error::Standalone learning-data route must return HTTP 200; got $DATA_STATUS."
            cat /tmp/bauman-live-entrepreneurship-curriculum.json || true
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/bauman-live-entrepreneurship-curriculum.json', 'utf8'));
          if (payload.id !== 'entrepreneurship') throw new Error('Standalone learning-data payload identity is invalid.');
          NODE
          echo "Standalone learning-data access PASS."

          echo "Checking Runtime → Control link..."
          LINK_STATUS="$(curl --silent --show-error --output /tmp/bauman-live-control-link.json --write-out '%{http_code}' --max-time 15 "$BAUMAN_RUNTIME_PRODUCTION_ORIGIN/__control-link" || true)"
          if [[ "$LINK_STATUS" != "200" ]]; then
            echo "::error::Runtime cannot reach production Control (HTTP $LINK_STATUS)."
            cat /tmp/bauman-live-control-link.json || true
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/bauman-live-control-link.json', 'utf8'));
          if (payload.ok !== true || payload.controlReachable !== true) throw new Error('Runtime → Control link is unhealthy.');
          NODE

          echo "Bauman live Control + Runtime availability PASS."

      - name: Summary
        if: always()
        run: |
          echo "Bauman Standalone Development Mode: main is live."
          echo "Login/device approval are bypassed while BAUMAN_ACCESS_MODE=standalone."
