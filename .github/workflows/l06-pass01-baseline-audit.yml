name: Lesson 1.6 academic baseline audit
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/l06-pass01-baseline-audit.yml
permissions:
  contents: write
jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false
      - name: Parse lesson-scoped baseline
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          TARGET='MATH-VN-C01-vector_trong_khong_gian_-L06-vector-to-data-matrix-e140'
          root=Path('subjects/math')
          data_root=root/'data'
          named_sources={
            'durable':data_root/'theory_lecture_content.json',
            'frame':data_root/'theory_lecture_frame.json',
            'lessons':data_root/'lessons.json',
            'curriculum':data_root/'curriculum.json',
            'chapterSpine':data_root/'chapter_spine.json',
            'contentManifest':data_root/'content-manifest.json'
          }
          loaded={}
          for name,path in named_sources.items():
            if path.exists():
              loaded[name]=json.loads(path.read_text(encoding='utf-8'))

          checks=[]
          def require(name,condition,detail=None):
            if not condition:
              raise AssertionError(f'{name}: {detail!r}')
            checks.append({'name':name,'status':'PASS','detail':detail})

          durable=loaded['durable']
          records=durable.get('records',[])
          indices=[i for i,r in enumerate(records) if r.get('lessonId')==TARGET]
          require('target occurs once in durable content',len(indices)==1,indices)
          index=indices[0]
          record=records[index]
          previous_id=records[index-1].get('lessonId') if index>0 else None
          next_id=records[index+1].get('lessonId') if index+1<len(records) else None
          require('target has title',bool(record.get('lessonTitle') or record.get('title')))
          require('target has slides',isinstance(record.get('slides'),list) and len(record['slides'])>0,len(record.get('slides',[])))

          def canonical_hash(obj):
            raw=json.dumps(obj,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode('utf-8')
            return hashlib.sha256(raw).hexdigest()

          def walk(obj,path='$'):
            if isinstance(obj,dict):
              yield path,obj
              for k,v in obj.items():
                yield from walk(v,f'{path}.{k}')
            elif isinstance(obj,list):
              for i,v in enumerate(obj):
                yield from walk(v,f'{path}[{i}]')

          source_matches={}
          for name,obj in loaded.items():
            matches=[]
            for path,node in walk(obj):
              identifiers=[node.get(k) for k in ('lessonId','id','lesson_id') if node.get(k)]
              if TARGET in identifiers:
                matches.append({'path':path,'keys':sorted(node.keys()),'title':node.get('lessonTitle') or node.get('title') or node.get('label')})
            source_matches[name]=matches

          slides=record['slides']
          role_counts=Counter(str(s.get('role') or 'missing') for s in slides)
          block_counts=Counter()
          slide_ids=[]
          formula_refs=[]
          formula_bodies=[]
          code_blocks=[]
          qa_blocks=[]
          empty_slides=[]
          duplicate_titles=[]
          titles=[]
          long_bodies=[]
          for position,slide in enumerate(slides,1):
            slide_ids.append(slide.get('id'))
            title=str(slide.get('title') or '').strip()
            titles.append(title)
            blocks=slide.get('blocks') if isinstance(slide.get('blocks'),list) else []
            if not title or not blocks: empty_slides.append(position)
            formula_refs.extend(slide.get('formulaRefs') or [])
            for block in blocks:
              kind=str(block.get('type') or 'missing')
              block_counts[kind]+=1
              body=str(block.get('body') or block.get('text') or block.get('formula') or '')
              if kind=='formula': formula_bodies.append(body)
              if kind=='code': code_blocks.append(body)
              if kind=='qa': qa_blocks.append(body)
              if len(body)>600: long_bodies.append({'slide':position,'type':kind,'length':len(body)})
          title_counter=Counter(t for t in titles if t)
          duplicate_titles=sorted(t for t,c in title_counter.items() if c>1)

          artifact_paths={
            'case':data_root/'theory_case/theory_case_c01_l06.json',
            'core':data_root/'theory_core/theory_core_c01_l06.json',
            'workedExamples':data_root/'theory_worked_examples/theory_worked_examples_c01_l06.json',
            'lab':data_root/'theory_lab/theory_lab_c01_l06.json',
            'assessment':data_root/'theory_assessment/theory_assessment_c01_l06.json',
            'reference':data_root/'theory_reference/theory_reference_c01_l06.json',
            'fullView':data_root/'theory_full_view/theory_full_view_c01_l06.json',
            'normalization':data_root/'theory_normalization/theory_normalization_c01_l06.json',
            'slideshow':data_root/'theory_slideshow/theory_slideshow_c01_l06.json',
            'integrationImport':data_root/'theory_integration/theory_lecture_content_c01_l06_import.json',
            'integrationApproval':data_root/'theory_integration/theory_lecture_content_c01_l06_approval.json'
          }
          artifact_inventory={name:{'path':str(path),'exists':path.exists()} for name,path in artifact_paths.items()}
          existing_artifacts=[name for name,item in artifact_inventory.items() if item['exists']]
          missing_artifacts=[name for name,item in artifact_inventory.items() if not item['exists']]

          baseline_findings=[]
          baseline_findings.append({'id':'F01','severity':'info','finding':f'Durable lesson exists once at record index {index} of {len(records)}.'})
          baseline_findings.append({'id':'F02','severity':'info','finding':f'Current runtime deck contains {len(slides)} slides. The project contract treats 16 as a minimum, not a target maximum.'})
          baseline_findings.append({'id':'F03','severity':'warning' if len(slides)<=16 else 'info','finding':'The current deck is a legacy/general baseline and has not passed the lesson-scoped 14-pass academic workflow.'})
          baseline_findings.append({'id':'F04','severity':'warning' if missing_artifacts else 'info','finding':f'{len(missing_artifacts)} of {len(artifact_inventory)} specialist lesson artifacts are absent: '+', '.join(missing_artifacts)+'.'})
          baseline_findings.append({'id':'F05','severity':'warning' if not formula_refs else 'info','finding':f'Canonical formula references on runtime slides: {len(set(formula_refs))}; raw formula blocks: {len(formula_bodies)}.'})
          baseline_findings.append({'id':'F06','severity':'warning' if not code_blocks else 'info','finding':f'Code blocks: {len(code_blocks)}; Q&A blocks: {len(qa_blocks)}.'})
          baseline_findings.append({'id':'F07','severity':'warning' if empty_slides else 'info','finding':f'Empty/incomplete slide positions: {empty_slides or "none"}.'})
          baseline_findings.append({'id':'F08','severity':'warning' if duplicate_titles else 'info','finding':f'Duplicate slide titles: {duplicate_titles or "none"}.'})
          baseline_findings.append({'id':'F09','severity':'info','finding':'§1.6 is the bridge from individual vectors to a data matrix; Pass 2 must lock orientation, shape semantics, sample/feature contracts and the boundary with later rank/SVD content before expansion.'})
          baseline_findings.append({'id':'F10','severity':'warning','finding':'No §1.6 academic acceptance or browser acceptance exists yet. Existing runtime content must not be promoted as approved source of truth.'})

          scope_hazards=[
            'Rows-as-samples versus columns-as-samples can silently transpose every later formula.',
            'Sample count, feature count, channel order and units must be explicit before matrix operations.',
            'A data matrix is not automatically centred, standardized, full-rank or covariance-ready.',
            'Stacking vectors requires compatible dimension, schema, units and acquisition contract.',
            'Matrix shape alone does not prove semantic compatibility.',
            'PCA/SVD/rank should be previewed only as downstream bridges, not allowed to swallow the core lesson.',
            'Batch, time-window, channel and trajectory matrices are distinct orientations and must not be conflated.',
            'Code examples must assert shapes and metadata rather than only produce numeric output.'
          ]

          recommended_pass2=[
            'Lock prerequisite gates inherited from §1.1–§1.5.',
            'Define the canonical data contract: observations, features, shape m×n, row/column semantics, units and ordering.',
            'Separate vector stacking, matrix notation, indexing, slicing, transpose and batch interpretation.',
            'Define learning outcomes and mastery evidence before formulas or slides are expanded.',
            'Choose one deterministic engineering dataset for later passes without importing PCA/SVD conclusions prematurely.',
            'Lock explicit misconceptions around transpose, shape compatibility, centering and sample/feature orientation.'
          ]

          report={
            'id':'bauman_math_c01_l06_baseline_audit_v1',
            'schema':'bauman_math_theory_baseline_audit_v1',
            'version':'BASELINE_AUDIT_C01_L06_V1',
            'status':'PASS_01_BASELINE_AUDIT_COMPLETE',
            'date':'2026-07-09',
            'lessonId':TARGET,
            'lessonTitle':record.get('lessonTitle') or record.get('title'),
            'chapterId':record.get('chapterId'),
            'recordIndex':index,
            'recordCount':len(records),
            'previousLessonId':previous_id,
            'nextLessonId':next_id,
            'canonicalRecordHash':canonical_hash(record),
            'programLectureId':record.get('programLectureId'),
            'programLectureIds':record.get('programLectureIds') or [],
            'programAnchorTitle':record.get('programAnchorTitle'),
            'roadmapRole':record.get('roadmapRole'),
            'baumanFocus':record.get('baumanFocus'),
            'tags':record.get('tags') or [],
            'runtimeBaseline':{
              'slideCount':len(slides),
              'slideIds':slide_ids,
              'roleCounts':dict(role_counts),
              'blockCounts':dict(block_counts),
              'formulaReferenceCount':len(set(formula_refs)),
              'formulaBlockCount':len(formula_bodies),
              'codeBlockCount':len(code_blocks),
              'qaBlockCount':len(qa_blocks),
              'emptyOrIncompleteSlides':empty_slides,
              'duplicateSlideTitles':duplicate_titles,
              'longBodies':long_bodies,
              'integrationMetaPresent':isinstance(record.get('integrationMeta'),dict),
              'academicApprovalPresent':False
            },
            'sourceMatches':source_matches,
            'artifactInventory':artifact_inventory,
            'existingSpecialistArtifacts':existing_artifacts,
            'missingSpecialistArtifacts':missing_artifacts,
            'findings':baseline_findings,
            'scopeHazards':scope_hazards,
            'recommendedPass2Actions':recommended_pass2,
            'protectedRuntimeDecision':{
              'durableContentModified':False,
              'runtimeReaderModified':False,
              'manifestModified':False,
              'e235Modified':False,
              'newSlideshowEngineCreated':False
            },
            'checks':checks,
            'nextTask':'THEORY_C01_L06_LEARNING_CONTRACT_PASS_02'
          }
          json_path=root/'THEORY_C01_L06_BASELINE_AUDIT.json'
          json_path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          md=[]
          md.append('# §1.6 · Baseline Audit')
          md.append('')
          md.append(f'- Status: `PASS_01_BASELINE_AUDIT_COMPLETE`')
          md.append(f'- Lesson ID: `{TARGET}`')
          md.append(f'- Runtime record index: `{index}` of `{len(records)}` records')
          md.append(f'- Previous: `{previous_id}`')
          md.append(f'- Next: `{next_id}`')
          md.append(f'- Current runtime slides: `{len(slides)}`')
          md.append(f'- Canonical record hash: `{report["canonicalRecordHash"]}`')
          md.append('')
          md.append('## Current runtime inventory')
          md.append('')
          md.append(f'- Roles: `{dict(role_counts)}`')
          md.append(f'- Block types: `{dict(block_counts)}`')
          md.append(f'- Formula references: `{len(set(formula_refs))}`')
          md.append(f'- Formula blocks: `{len(formula_bodies)}`')
          md.append(f'- Code blocks: `{len(code_blocks)}`')
          md.append(f'- Q&A blocks: `{len(qa_blocks)}`')
          md.append(f'- Integration metadata present: `{isinstance(record.get("integrationMeta"),dict)}`')
          md.append('')
          md.append('## Specialist artifact inventory')
          md.append('')
          for name,item in artifact_inventory.items():
            md.append(f'- {name}: `{"present" if item["exists"] else "missing"}` · `{item["path"]}`')
          md.append('')
          md.append('## Findings')
          md.append('')
          for item in baseline_findings:
            md.append(f'- **{item["id"]} · {item["severity"].upper()}**: {item["finding"]}')
          md.append('')
          md.append('## Scope hazards to lock before expansion')
          md.append('')
          for item in scope_hazards: md.append(f'- {item}')
          md.append('')
          md.append('## Pass 2 requirements')
          md.append('')
          for item in recommended_pass2: md.append(f'- {item}')
          md.append('')
          md.append('## Runtime decision')
          md.append('')
          md.append('- No durable content, reader, manifest or E235 modification was performed.')
          md.append('- Existing runtime content remains baseline only, not approved source of truth.')
          md.append('- Next task: `THEORY_C01_L06_LEARNING_CONTRACT_PASS_02`.')
          (root/'THEORY_C01_L06_BASELINE_AUDIT.md').write_text('\n'.join(md)+'\n',encoding='utf-8')

          state_path=Path('CODEX_STATE.md')
          old=state_path.read_text(encoding='utf-8')
          accepted_prefix=old.split('## Current task requirements',1)[0].rstrip()
          state=accepted_prefix+'\n\n## §1.6 academic workflow\n\nLesson ID:\n`'+TARGET+'`\n\nLesson title:\n`'+str(report['lessonTitle'])+'`\n\nProgress:\n- academic passes complete: `1/14`;\n- academic passes remaining: `13/14`;\n- runtime integration: not started;\n- durable runtime content: unchanged baseline;\n- browser QA: not applicable before runtime integration.\n\n### Pass 1 · Baseline audit\n- Status: `PASS_01_BASELINE_AUDIT_COMPLETE`.\n- Files:\n  - `subjects/math/THEORY_C01_L06_BASELINE_AUDIT.md`;\n  - `subjects/math/THEORY_C01_L06_BASELINE_AUDIT.json`.\n- Current runtime slides: `'+str(len(slides))+'`.\n- Current record index: `'+str(index)+'`.\n- Existing specialist artifacts: `'+str(len(existing_artifacts))+'`; missing: `'+str(len(missing_artifacts))+'`.\n- Durable content, runtime readers, manifest and E235 unchanged.\n\n## Current task requirements\n\n`THEORY_C01_L06_LEARNING_CONTRACT_PASS_02`\n\nPass 2 must:\n- lock prerequisite gates from §1.1–§1.5;\n- define learning outcomes before slide expansion;\n- lock canonical data-matrix orientation and shape semantics;\n- separate observations, features, channels, time windows and batches;\n- define mastery evidence and prohibited shortcuts;\n- select one deterministic engineering context for later case development;\n- keep PCA/SVD/rank as downstream bridges rather than replacing the §1.6 core;\n- avoid runtime modification.\n'
          state=state.replace('Current task: `THEORY_C01_L06_BASELINE_AUDIT_PASS_01`','Current task: `THEORY_C01_L06_LEARNING_CONTRACT_PASS_02`',1)
          state=state.replace('Status: `ACADEMIC_14_OF_14_PASS_RUNTIME_5_OF_5_BROWSER_ACCEPTED`','Status: `PASS_01_BASELINE_AUDIT_COMPLETE`',1)
          state_path.write_text(state,encoding='utf-8')
          PY
      - name: Commit audit and remove workflow
        run: |
          git rm .github/workflows/l06-pass01-baseline-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CODEX_STATE.md subjects/math/THEORY_C01_L06_BASELINE_AUDIT.md subjects/math/THEORY_C01_L06_BASELINE_AUDIT.json
          git commit -m "docs(math): audit lesson 1.6 baseline"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
