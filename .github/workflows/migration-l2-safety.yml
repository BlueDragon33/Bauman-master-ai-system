name: Migration L2 Safety Regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l2-static-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch main baseline
        run: git fetch origin main --depth=1

      - name: Run historical L2 deterministic regression
        run: node scripts/migration/l2-static-regression.cjs
