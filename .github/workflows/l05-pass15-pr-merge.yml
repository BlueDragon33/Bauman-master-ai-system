name: Lesson 1.5 isolated durable merge
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/l05-pass15-pr-merge.yml
permissions:
  contents: write
jobs:
  merge-record:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Parse, merge and verify only L05
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from collections import Counter
          from pathlib import Path

          TARGET = 'MATH-VN-C01-vector_trong_khong_gian_-L05-subspace-data-representation-e140'
          EXPECTED_FORMULAS = [f'F{i:02d}' for i in range(1, 17)]
          APPROVED_IMPORT_COMMIT = '00196604e2e68095860e6bf37a205a9d772c0e5e'

          root = Path('subjects/math')
          durable_path = root / 'data/theory_lecture_content.json'
          import_path = root / 'data/theory_integration/theory_lecture_content_c01_l05_import.json'
          approval_path = root / 'data/theory_integration/theory_lecture_content_c01_l05_approval.json'
          acceptance_path = root / 'THEORY_C01_L05_ACADEMIC_ACCEPTANCE.json'
          report_path = root / 'THEORY_C01_L05_RUNTIME_PASS15.json'
          state_path = Path('CODEX_STATE.md')

          durable_raw = durable_path.read_bytes()
          current_import_raw = import_path.read_bytes()
          durable = json.loads(durable_raw)
          package = json.loads(current_import_raw)
          approval = json.loads(approval_path.read_text(encoding='utf-8'))
          acceptance = json.loads(acceptance_path.read_text(encoding='utf-8'))

          checks = []
          def require(name, condition, detail=None):
              if not condition:
                  raise AssertionError(f'{name}: {detail!r}')
              checks.append({'name': name, 'status': 'PASS', 'detail': detail})

          require('academic acceptance PASS', acceptance.get('status') == 'PASS')
          require('academic workflow 14/14', acceptance.get('academicPasses') == {'completed': 14, 'total': 14, 'remaining': 0})
          require('approval status', approval.get('status') == 'approved_for_durable_merge')
          approved = approval.get('approvedImport', {})
          require('approved import commit', approved.get('commit') == APPROVED_IMPORT_COMMIT)
          require('approved import version', approved.get('version') == package.get('version'))
          require('approved package type', package.get('packageType') == 'bauman.math.theory_lecture_content.merge')
          require('approved target', package.get('target') == 'theory_lecture_content')
          require('approved mode', package.get('mode') == 'merge')

          historical_import_raw = subprocess.check_output([
              'git', 'show', f'{APPROVED_IMPORT_COMMIT}:subjects/math/data/theory_integration/theory_lecture_content_c01_l05_import.json'
          ])
          require('immutable import bytes match approved commit', historical_import_raw == current_import_raw)

          records = durable.get('records')
          imported_records = package.get('records')
          require('durable records is list', isinstance(records, list))
          require('one imported record', isinstance(imported_records, list) and len(imported_records) == 1)
          imported = imported_records[0]
          require('import target lesson', imported.get('lessonId') == TARGET)

          before_count = len(records)
          target_indices = [i for i, r in enumerate(records) if r.get('lessonId') == TARGET]
          require('target occurs exactly once before', len(target_indices) == 1, target_indices)
          target_index = target_indices[0]
          previous_id = records[target_index - 1].get('lessonId') if target_index > 0 else None
          next_id = records[target_index + 1].get('lessonId') if target_index + 1 < before_count else None

          def canonical_hash(obj):
              raw = json.dumps(obj, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
              return hashlib.sha256(raw).hexdigest()

          non_target_before = {
              r['lessonId']: canonical_hash(r)
              for r in records
              if r.get('lessonId') != TARGET
          }
          original_target_hash = canonical_hash(records[target_index])
          imported_target_hash = canonical_hash(imported)
          require('target content changes', original_target_hash != imported_target_hash)

          source_slides = package.get('slideCountPolicy', {}).get('actual')
          runtime_slides = imported.get('slides', [])
          require('source slide count 22', source_slides == 22)
          require('runtime slide count 22', len(runtime_slides) == 22)
          require('runtime IDs S01-S22', [s.get('id') for s in runtime_slides] == [f'MATH-VN-C01-L05-S{i:02d}' for i in range(1, 23)])
          require('source mapping SL01-SL22', all(s.get('sourceSlideIds') == [f'SL{i:02d}'] for i, s in enumerate(runtime_slides, 1)))
          formula_coverage = sorted({f for s in runtime_slides for f in s.get('formulaRefs', [])})
          require('formula coverage F01-F16', formula_coverage == EXPECTED_FORMULAS, formula_coverage)
          require('no compression', package.get('slideCountPolicy', {}).get('compression') is False)
          require('minimum 16 no maximum', package.get('slideCountPolicy', {}).get('minimum') == 16 and package.get('slideCountPolicy', {}).get('maximum') is None)

          imported_text = json.dumps(imported, ensure_ascii=False)
          required_locked_strings = [
              '0.0316227766016838',
              '0.3535533905932738',
              '1.44955817',
              '0.77504298',
              '0.03505112',
              '0.00330126',
              '0.9995414686511285',
              'rank_0.05(X_c)=2'
          ]
          require('locked case strings retained', all(x in imported_text for x in required_locked_strings), [x for x in required_locked_strings if x not in imported_text])
          forbidden_positive_claims = [
              'score proves bearing fault',
              'score chứng minh bearing fault',
              'low score proves healthy',
              '99.9541% guarantees prediction accuracy'
          ]
          lower_text = imported_text.lower()
          require('prohibited positive claims absent', not any(x.lower() in lower_text for x in forbidden_positive_claims))

          merged_records = list(records)
          merged_records[target_index] = imported
          durable['records'] = merged_records

          after_count = len(merged_records)
          require('record count unchanged', after_count == before_count, {'before': before_count, 'after': after_count})
          after_target_indices = [i for i, r in enumerate(merged_records) if r.get('lessonId') == TARGET]
          require('target occurs exactly once after', after_target_indices == [target_index], after_target_indices)
          require('previous neighbor unchanged', (merged_records[target_index - 1].get('lessonId') if target_index > 0 else None) == previous_id, previous_id)
          require('next neighbor unchanged', (merged_records[target_index + 1].get('lessonId') if target_index + 1 < after_count else None) == next_id, next_id)

          ids = [r.get('lessonId') for r in merged_records]
          duplicates = sorted(k for k, v in Counter(ids).items() if k and v > 1)
          require('duplicate lesson IDs zero', duplicates == [], duplicates)

          non_target_after = {
              r['lessonId']: canonical_hash(r)
              for r in merged_records
              if r.get('lessonId') != TARGET
          }
          require('non-target key set unchanged', non_target_after.keys() == non_target_before.keys())
          changed_non_targets = sorted(k for k in non_target_before if non_target_before[k] != non_target_after[k])
          require('all non-target canonical hashes unchanged', changed_non_targets == [], changed_non_targets)

          output = json.dumps(durable, ensure_ascii=False, indent=2) + '\n'
          durable_path.write_text(output, encoding='utf-8')
          reparsed = json.loads(durable_path.read_text(encoding='utf-8'))
          require('written JSON reparses', len(reparsed.get('records', [])) == before_count)

          before_sha256 = hashlib.sha256(durable_raw).hexdigest()
          after_sha256 = hashlib.sha256(durable_path.read_bytes()).hexdigest()
          require('file hash changed', before_sha256 != after_sha256)

          approval['runtimeMergePerformed'] = True
          approval['runtimeMergeResult'] = {
              'status': 'PASS_15_DURABLE_MERGE_STATIC_VERIFY_PASS',
              'targetIndex': target_index,
              'previousLessonId': previous_id,
              'nextLessonId': next_id,
              'recordsBefore': before_count,
              'recordsAfter': after_count,
              'sourceSlides': 22,
              'runtimeSlides': 22,
              'changedNonTargetRecords': 0,
              'duplicateLessonIds': 0,
              'durableFileSha256Before': before_sha256,
              'durableFileSha256After': after_sha256
          }
          approval['nextTask'] = 'THEORY_C01_L05_RUNTIME_SOURCE_REGISTRATION_PASS_16'
          approval_path.write_text(json.dumps(approval, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          report = {
              'id': 'bauman_math_c01_l05_runtime_pass15_v1',
              'schema': 'bauman_math_runtime_merge_report_v1',
              'version': 'RUNTIME_PASS15_C01_L05_V1',
              'status': 'PASS_15_DURABLE_MERGE_STATIC_VERIFY_PASS',
              'date': '2026-07-09',
              'lessonId': TARGET,
              'verificationMode': 'isolated_pull_request_python_json_hash_validation',
              'browserRun': False,
              'runtimeReadersModified': False,
              'manifestModified': False,
              'targetIndex': target_index,
              'previousLessonId': previous_id,
              'nextLessonId': next_id,
              'recordsBefore': before_count,
              'recordsAfter': after_count,
              'durableFileBlobShaBefore': '5e767c5f65115a1dbddd34e53831fd3dc0ac8c72',
              'durableFileSha256Before': before_sha256,
              'durableFileSha256After': after_sha256,
              'originalTargetCanonicalHash': original_target_hash,
              'importedTargetCanonicalHash': imported_target_hash,
              'nonTargetRecordCount': len(non_target_before),
              'changedNonTargetRecords': changed_non_targets,
              'duplicateLessonIds': duplicates,
              'sourceSlideCount': 22,
              'runtimeSlideCount': 22,
              'formulaCoverage': formula_coverage,
              'checks': checks,
              'nextTask': 'THEORY_C01_L05_RUNTIME_SOURCE_REGISTRATION_PASS_16'
          }
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          state = state_path.read_text(encoding='utf-8')
          state = state.replace('Current task: `THEORY_C01_L05_DURABLE_MERGE_RUNTIME_PASS_15`', 'Current task: `THEORY_C01_L05_RUNTIME_SOURCE_REGISTRATION_PASS_16`', 1)
          state = state.replace('Status: `PASS_14_ACADEMIC_ACCEPTANCE_COMPLETE`', 'Status: `PASS_15_DURABLE_MERGE_STATIC_VERIFY_PASS`', 1)
          state = state.replace('- runtime integration: not started;', '- runtime integration: 1/5 passes complete;', 1)
          state = state.replace('- durable runtime record: unchanged 16-slide baseline record;', '- durable runtime record: merged 22-slide approved record;', 1)
          state = state.replace('- durable merge: not performed.', '- durable merge: PASS with all non-target canonical hashes unchanged.', 1)
          state += f'''\n\n## §1.5 Runtime Pass 15 · Durable merge\n- Status: `PASS_15_DURABLE_MERGE_STATIC_VERIFY_PASS`.\n- Report: `subjects/math/THEORY_C01_L05_RUNTIME_PASS15.json`.\n- Target index: `{target_index}`.\n- Previous lesson: `{previous_id}`.\n- Next lesson: `{next_id}`.\n- Record count: `{before_count}` before and after.\n- Runtime slides: `22/22`.\n- Changed non-target records: `0`.\n- Duplicate lesson IDs: `0`.\n- Browser QA: not run.\n- Next: `THEORY_C01_L05_RUNTIME_SOURCE_REGISTRATION_PASS_16`.\n'''
          state_path.write_text(state, encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Commit verified branch result
        run: |
          git rm .github/workflows/l05-pass15-pr-merge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CODEX_STATE.md subjects/math/data/theory_lecture_content.json subjects/math/data/theory_integration/theory_lecture_content_c01_l05_approval.json subjects/math/THEORY_C01_L05_RUNTIME_PASS15.json
          git commit -m "content(math): durably merge accepted lesson 1.5"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
