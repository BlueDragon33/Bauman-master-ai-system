name: Dependency Independence Governance

on:
  pull_request:
    paths:
      - "prompts/CONSTITUTION.md"
      - "prompts/EXECUTION_PROTOCOL.md"
      - "prompts/PROMPT_REGISTRY.json"
      - "prompts/constitution/**"
      - "prompts/subjects/SUBJECT_PROMPT_INDEX.json"
      - "prompts/subjects/python/**"
      - "prompts/subjects/algorithms/PROJECT_STATE.json"
      - "prompts/hub/**"
      - "tests/dependency-independence-policy-static.mjs"
      - ".github/workflows/dependency-independence-governance.yml"
  push:
    branches: [main]
    paths:
      - "prompts/CONSTITUTION.md"
      - "prompts/EXECUTION_PROTOCOL.md"
      - "prompts/PROMPT_REGISTRY.json"
      - "prompts/constitution/**"
      - "prompts/subjects/SUBJECT_PROMPT_INDEX.json"
      - "prompts/subjects/python/**"
      - "prompts/subjects/algorithms/PROJECT_STATE.json"
      - "prompts/hub/**"
      - "tests/dependency-independence-policy-static.mjs"
      - ".github/workflows/dependency-independence-governance.yml"

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Validate local-first dependency independence policy
        run: node tests/dependency-independence-policy-static.mjs
      - name: Preserve Russian Constitution router compatibility
        run: node subjects/russian/scripts/validate-constitution-router.mjs
