name: Migration L7 Reference Subjects Regression

on:
  push:
    branches:
      - migration/webapp-l1-audit-storage
    paths:
      - subjects/russian/**
      - subjects/math/**
      - subjects/foundation/**
      - assets/data/roadmap/**
      - assets/data/lesson/**
      - assets/js/platform/universal-lesson/**
      - scripts/academic/l7-**
      - docs/migration/L7_**
      - docs/migration/MIGRATION_PLAN.md
      - CODEX_STATE.md
      - .github/workflows/migration-l7-reference-subjects.yml
  pull_request:
    branches:
      - main
      - migration/webapp-l1-audit-storage
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  l7-reference-subjects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run L7-B1 Russian coverage audit
        id: b1_gate
        run: |
          node --check scripts/academic/l7-b1-russian-coverage-audit.cjs
          node scripts/academic/l7-b1-russian-coverage-audit.cjs
          git diff --exit-code -- docs/migration/L7_B1_RUSSIAN_COVERAGE_AUDIT.generated.json

      - name: Publish L7-B1 status
        if: ${{ always() && github.event_name == 'push' && steps.b1_gate.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_OUTCOME: ${{ steps.b1_gate.outcome }}
        run: |
          STATE=failure
          if [ "$GATE_OUTCOME" = "success" ]; then STATE=success; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="migration/l7-b1-russian-coverage" \
            -f description="L7-B1 Russian coverage: ${GATE_OUTCOME}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Run L7-B2 Russian Universal adapter regression
        id: b2_gate
        run: |
          node --check assets/js/platform/universal-lesson/russian-universal-adapter-v1.js
          node --check scripts/academic/l7-b2-russian-universal-adapter-regression.cjs
          node scripts/academic/l7-b2-russian-universal-adapter-regression.cjs
          git diff --exit-code -- docs/migration/L7_B2_RUSSIAN_UNIVERSAL_ADAPTER.generated.json

      - name: Publish L7-B2 status
        if: ${{ always() && github.event_name == 'push' && steps.b2_gate.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_OUTCOME: ${{ steps.b2_gate.outcome }}
        run: |
          STATE=failure
          if [ "$GATE_OUTCOME" = "success" ]; then STATE=success; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="migration/l7-b2-russian-universal-adapter" \
            -f description="L7-B2 Russian adapter: ${GATE_OUTCOME}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Run L7-B3 Russian Twin registry regression
        id: b3_gate
        run: |
          node --check assets/js/platform/universal-lesson/russian-twin-generator-v1.js
          node --check scripts/academic/l7-b3-russian-twin-registry-regression.cjs
          node scripts/academic/l7-b3-russian-twin-registry-regression.cjs
          git diff --exit-code -- assets/data/lesson/russian-twin-glossary-v1.generated.json
          git diff --exit-code -- docs/migration/L7_B3_RUSSIAN_TWIN_REGISTRY.generated.json

      - name: Publish L7-B3 status
        if: ${{ always() && github.event_name == 'push' && steps.b3_gate.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_OUTCOME: ${{ steps.b3_gate.outcome }}
        run: |
          STATE=failure
          if [ "$GATE_OUTCOME" = "success" ]; then STATE=success; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="migration/l7-b3-russian-twin-registry" \
            -f description="L7-B3 Russian Twin registry: ${GATE_OUTCOME}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Run L7-B4 Math coverage and prerequisite audit
        id: b4_gate
        run: |
          node --check scripts/academic/l7-b4-math-coverage-prerequisite-audit.cjs
          node scripts/academic/l7-b4-math-coverage-prerequisite-audit.cjs
          git diff --exit-code -- assets/data/lesson/math-prerequisite-graph-v1.generated.json
          git diff --exit-code -- docs/migration/L7_B4_MATH_COVERAGE_PREREQUISITE_AUDIT.generated.json

      - name: Publish L7-B4 status
        if: ${{ always() && github.event_name == 'push' && steps.b4_gate.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_OUTCOME: ${{ steps.b4_gate.outcome }}
        run: |
          STATE=failure
          if [ "$GATE_OUTCOME" = "success" ]; then STATE=success; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="migration/l7-b4-math-coverage-prerequisite" \
            -f description="L7-B4 Math audit: ${GATE_OUTCOME}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Run L7-B5 Math Universal adapter regression
        id: b5_gate
        run: |
          node --check assets/js/platform/universal-lesson/math-universal-adapter-v1.js
          node --check scripts/academic/l7-b5-math-universal-adapter-regression.cjs
          node scripts/academic/l7-b5-math-universal-adapter-regression.cjs
          git diff --exit-code -- docs/migration/L7_B5_MATH_UNIVERSAL_ADAPTER.generated.json

      - name: Publish L7-B5 status
        if: ${{ always() && github.event_name == 'push' && steps.b5_gate.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_OUTCOME: ${{ steps.b5_gate.outcome }}
        run: |
          STATE=failure
          if [ "$GATE_OUTCOME" = "success" ]; then STATE=success; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="migration/l7-b5-math-universal-adapter" \
            -f description="L7-B5 Math adapter: ${GATE_OUTCOME}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Run L7-B6 Foundation preparatory completion regression
        id: b6_gate
        run: |
          node --check assets/js/platform/universal-lesson/foundation-preparatory-bridge-v1.js
          node --check scripts/academic/l7-b6-foundation-preparatory-completion-regression.cjs
          node scripts/academic/l7-b6-foundation-preparatory-completion-regression.cjs
          git diff --exit-code -- docs/migration/L7_B6_FOUNDATION_PREPARATORY_COMPLETION.generated.json

      - name: Publish L7-B6 status
        if: ${{ always() && github.event_name == 'push' && steps.b6_gate.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_OUTCOME: ${{ steps.b6_gate.outcome }}
        run: |
          STATE=failure
          if [ "$GATE_OUTCOME" = "success" ]; then STATE=success; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="migration/l7-b6-foundation-preparatory" \
            -f description="L7-B6 Foundation bridge: ${GATE_OUTCOME}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Run L7-B7 reference evidence and spaced-review regression
        id: b7_gate
        run: |
          node --check assets/js/platform/universal-lesson/reference-subject-evidence-review-v1.js
          node --check scripts/academic/l7-b7-reference-evidence-review-regression.cjs
          node scripts/academic/l7-b7-reference-evidence-review-regression.cjs
          git diff --exit-code -- docs/migration/L7_B7_REFERENCE_EVIDENCE_SPACED_REVIEW.generated.json

      - name: Publish L7-B7 status
        if: ${{ always() && github.event_name == 'push' && steps.b7_gate.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_OUTCOME: ${{ steps.b7_gate.outcome }}
        run: |
          STATE=failure
          if [ "$GATE_OUTCOME" = "success" ]; then STATE=success; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="migration/l7-b7-reference-evidence-review" \
            -f description="L7-B7 evidence/review hooks: ${GATE_OUTCOME}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Upload L7-B1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l7-b1-russian-coverage
          path: docs/migration/L7_B1_RUSSIAN_COVERAGE_AUDIT.generated.json

      - name: Upload L7-B2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l7-b2-russian-universal-adapter
          path: docs/migration/L7_B2_RUSSIAN_UNIVERSAL_ADAPTER.generated.json

      - name: Upload L7-B3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l7-b3-russian-twin-registry
          path: |
            assets/data/lesson/russian-twin-glossary-v1.generated.json
            docs/migration/L7_B3_RUSSIAN_TWIN_REGISTRY.generated.json

      - name: Upload L7-B4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l7-b4-math-coverage-prerequisite
          path: |
            assets/data/lesson/math-prerequisite-graph-v1.generated.json
            docs/migration/L7_B4_MATH_COVERAGE_PREREQUISITE_AUDIT.generated.json

      - name: Upload L7-B5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l7-b5-math-universal-adapter
          path: docs/migration/L7_B5_MATH_UNIVERSAL_ADAPTER.generated.json

      - name: Upload L7-B6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l7-b6-foundation-preparatory
          path: docs/migration/L7_B6_FOUNDATION_PREPARATORY_COMPLETION.generated.json

      - name: Upload L7-B7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l7-b7-reference-evidence-review
          path: docs/migration/L7_B7_REFERENCE_EVIDENCE_SPACED_REVIEW.generated.json
