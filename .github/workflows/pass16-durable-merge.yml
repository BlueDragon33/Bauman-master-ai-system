name: Pass 16 durable theory merge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pass16-durable-merge.yml

permissions:
  contents: write

jobs:
  merge-lesson:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Merge and verify lesson 1.4
        shell: bash
        run: |
          python - <<'PY'
          import copy
          import hashlib
          import json
          import re
          from collections import Counter
          from pathlib import Path

          target_path = Path('subjects/math/data/theory_lecture_content.json')
          import_path = Path('subjects/math/data/theory_integration/theory_lecture_content_c01_l04_import.json')
          state_path = Path('CODEX_STATE.md')
          lesson_id = 'MATH-VN-C01-vector_trong_khong_gian_-L04-basis-span-coordinate-e140'
          chapter_id = 'MATH-VN-C01-vector_trong_khong_gian_'
          expected_import_version = 'C01_L04_E129_IMPORT_V2_22_SLIDES_APPROVED'

          def canonical(value):
              return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(',', ':'))

          def digest_bytes(value):
              return hashlib.sha256(value).hexdigest()

          def digest_json(value):
              return digest_bytes(canonical(value).encode('utf-8'))

          def duplicate_ids(records):
              counts = Counter(r.get('lessonId') for r in records if r.get('lessonId'))
              return sorted(k for k, v in counts.items() if v > 1)

          raw_before = target_path.read_bytes()
          target = json.loads(raw_before.decode('utf-8'))
          package = json.loads(import_path.read_text(encoding='utf-8'))

          assert package.get('target') == 'theory_lecture_content', package.get('target')
          assert package.get('mode') == 'merge', package.get('mode')
          assert package.get('version') == expected_import_version, package.get('version')
          assert isinstance(package.get('records'), list) and len(package['records']) == 1

          incoming = package['records'][0]
          assert incoming.get('lessonId') == lesson_id
          assert incoming.get('chapterId') == chapter_id
          slides = incoming.get('slides')
          assert isinstance(slides, list) and len(slides) == 22

          expected_slide_ids = [f'MATH-VN-C01-L04-S{i:02d}' for i in range(1, 23)]
          actual_slide_ids = [s.get('id') for s in slides]
          assert actual_slide_ids == expected_slide_ids, actual_slide_ids
          assert len(actual_slide_ids) == len(set(actual_slide_ids))

          expected_sources = [f'SL{i:02d}' for i in range(1, 23)]
          source_ids = [src for slide in slides for src in slide.get('sourceSlideIds', [])]
          assert source_ids == expected_sources, source_ids
          assert len(source_ids) == len(set(source_ids))

          formula_refs = {ref for slide in slides for ref in slide.get('formulaRefs', [])}
          expected_formulas = {f'F{i}' for i in range(1, 13)}
          assert expected_formulas.issubset(formula_refs), sorted(expected_formulas - formula_refs)

          meta = incoming.get('integrationMeta') or {}
          assert meta.get('sourceSlideCount') == 22
          assert meta.get('runtimeSlideCount') == 22
          assert 'No compression' in str(meta.get('projectionPolicy', ''))

          incoming_text = canonical(incoming)
          lowered = incoming_text.lower()
          forbidden = ['<script', 'javascript:', 'onerror=', 'onclick=', '[object object]', 'todo', 'fixme', 'lorem', '<<<<<<<', '=======', '>>>>>>>']
          found_forbidden = [token for token in forbidden if token in lowered]
          assert not found_forbidden, found_forbidden

          normalized_text = incoming_text.replace('−', '-').replace('–', '-').replace('—', '-')
          required_tokens = [
              '[v]_W=(5,1)^T m/s',
              't=(0.6,0.8)',
              'n=(-0.8,0.6)',
              '[v]_R=(3.8,-3.4)^T m/s',
              'P_{W←R}=[[0.6,-0.8],[0.8,0.6]]',
              'Residual=(0,0)',
              'residual norm=0',
              '||[v]_W||^2=||[v]_R||^2=26',
              '(-3.4,3.8)',
              '+3.4',
              '53.1301°',
              '50°',
              '20 ms'
          ]
          missing_tokens = [token for token in required_tokens if token not in normalized_text]
          assert not missing_tokens, missing_tokens

          records = target.get('records')
          assert isinstance(records, list)
          count_before = len(records)
          indices = [i for i, record in enumerate(records) if record.get('lessonId') == lesson_id]
          assert len(indices) == 1, indices
          target_index = indices[0]
          before_occurrence = len(indices)
          duplicates_before = duplicate_ids(records)
          assert not duplicates_before, duplicates_before

          prev_record = copy.deepcopy(records[target_index - 1]) if target_index > 0 else None
          next_record = copy.deepcopy(records[target_index + 1]) if target_index + 1 < count_before else None
          prev_id = prev_record.get('lessonId') if prev_record else None
          next_id = next_record.get('lessonId') if next_record else None
          prev_hash = digest_json(prev_record) if prev_record else None
          next_hash = digest_json(next_record) if next_record else None
          non_target_hashes = [digest_json(record) for i, record in enumerate(records) if i != target_index]
          top_level_before = {k: digest_json(v) for k, v in target.items() if k != 'records'}
          file_hash_before = digest_bytes(raw_before)

          records[target_index] = incoming
          serialized = json.dumps(target, ensure_ascii=False, indent=2) + '\n'
          target_path.write_text(serialized, encoding='utf-8')

          raw_after = target_path.read_bytes()
          verified = json.loads(raw_after.decode('utf-8'))
          after_records = verified['records']
          count_after = len(after_records)
          after_indices = [i for i, record in enumerate(after_records) if record.get('lessonId') == lesson_id]
          assert count_after == count_before
          assert after_indices == [target_index], after_indices
          assert len(after_records[target_index].get('slides', [])) == 22
          assert [s.get('id') for s in after_records[target_index]['slides']] == expected_slide_ids
          assert [src for slide in after_records[target_index]['slides'] for src in slide.get('sourceSlideIds', [])] == expected_sources
          assert not duplicate_ids(after_records)
          assert [digest_json(record) for i, record in enumerate(after_records) if i != target_index] == non_target_hashes
          assert ({k: digest_json(v) for k, v in verified.items() if k != 'records'} == top_level_before)

          prev_hash_after = digest_json(after_records[target_index - 1]) if prev_record else None
          next_hash_after = digest_json(after_records[target_index + 1]) if next_record else None
          assert prev_hash_after == prev_hash
          assert next_hash_after == next_hash
          file_hash_after = digest_bytes(raw_after)

          state = state_path.read_text(encoding='utf-8')
          state = re.sub(r'Current task: `[^`]+`', 'Current task: `THEORY_DURABLE_CONTENT_MERGE_C01_L04_PASS_16`', state, count=1)
          state = re.sub(r'Status: `[^`]+`', 'Status: `PASS_16_DURABLE_MERGE_STATIC_VERIFY_PASS`', state, count=1)
          state = re.sub(r'- Runtime completion workflow: \d+/6 passes complete\.', '- Runtime completion workflow: 2/6 passes complete.', state, count=1)
          state = re.sub(r'- Runtime steps complete: \d+/34\.', '- Runtime steps complete: 10/34.', state, count=1)
          state = re.sub(r'- Runtime steps remaining: \d+/34\.', '- Runtime steps remaining: 24/34.', state, count=1)

          report = f'''\n\n## Pass 16 durable merge report\n- Result: `PASS_16_DURABLE_MERGE_STATIC_VERIFY_PASS`\n- Target file: `subjects/math/data/theory_lecture_content.json`\n- Import source: `subjects/math/data/theory_integration/theory_lecture_content_c01_l04_import.json`\n- Target lessonId: `{lesson_id}`\n- File SHA-256 before: `{file_hash_before}`\n- File SHA-256 after: `{file_hash_after}`\n- Record count before/after: `{count_before}/{count_after}`\n- Target occurrence before/after: `{before_occurrence}/{len(after_indices)}`\n- Target index: `{target_index}`\n- Previous lessonId: `{prev_id}`\n- Next lessonId: `{next_id}`\n- Previous record hash unchanged: `true`\n- Next record hash unchanged: `true`\n- All other record hashes unchanged: `true`\n- Runtime slides: `22`\n- Source slide mapping: `22/22`\n- Formula trace: `F1-F12 complete`\n- Duplicate lesson IDs: `0`\n- JSON validation: `pass`\n- Security scan: `pass`\n- UGV invariants: `pass`\n- Browser smoke test: `not run`\n- Files modified in this pass: `theory_lecture_content.json`, `CODEX_STATE.md`\n- Next task: `PASS 17/20 — synchronize E129, E202 and E211 data paths`\n'''
          if '## Pass 16 durable merge report' in state:
              state = state.split('## Pass 16 durable merge report')[0].rstrip() + report
          else:
              state = state.rstrip() + report
          state_path.write_text(state, encoding='utf-8')

          print(json.dumps({
              'fileHashBefore': file_hash_before,
              'fileHashAfter': file_hash_after,
              'recordCountBefore': count_before,
              'recordCountAfter': count_after,
              'targetIndex': target_index,
              'previousLessonId': prev_id,
              'nextLessonId': next_id,
              'slides': 22,
              'sourceSlides': 22,
              'duplicates': 0,
              'jsonValidation': 'pass',
              'securityScan': 'pass'
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit durable merge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subjects/math/data/theory_lecture_content.json CODEX_STATE.md
          git diff --cached --quiet && exit 0
          git commit -m "content(math): merge accepted 22-slide lesson 1.4 into theory content"
          git push origin HEAD:main
