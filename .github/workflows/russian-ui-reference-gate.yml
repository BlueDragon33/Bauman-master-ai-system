name: Russian Reference UI Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "subjects/russian/**"
      - ".github/workflows/russian-ui-reference-gate.yml"
  push:
    branches:
      - "main"
    paths:
      - "subjects/russian/**"
      - ".github/workflows/russian-ui-reference-gate.yml"

permissions:
  contents: read

jobs:
  russian-reference-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Validate Russian reference UI contracts
        run: node subjects/russian/scripts/validate-reference-ui.mjs
      - name: Validate Russian lesson learning flow
        run: node subjects/russian/scripts/validate-learning-flow.mjs
      - name: Validate Russian listening and visual-first architecture
        run: node subjects/russian/scripts/validate-listening-visual-first.mjs
      - name: Validate Russian vocabulary SRS runtime
        run: node subjects/russian/scripts/validate-vocab-srs.mjs
      - name: Validate Russian listening speaking coach
        run: node subjects/russian/scripts/validate-speaking-coach.mjs
      - name: Validate Russian grammar reading writing academic bridge
        run: node subjects/russian/scripts/validate-academic-language.mjs
      - name: Validate Russian AI mentor and offline runtime
        run: node subjects/russian/scripts/validate-ai-runtime.mjs
      - name: Validate Russian promotion candidate
        run: node subjects/russian/scripts/validate-promotion-candidate.mjs
      - name: Parse Russian runtime JavaScript
        run: |
          node --check subjects/russian/assets/core.js
          node --check subjects/russian/assets/subject-adapter.js
          node --check subjects/russian/assets/ui-cleanup-contract.js
          node --check subjects/russian/assets/content-contract.js
          node --check subjects/russian/assets/russian-reference-ui.js
          node --check subjects/russian/assets/learning-state.js
          node --check subjects/russian/assets/learning-flow.js
          node --check subjects/russian/assets/vocab-srs.js
          node --check subjects/russian/assets/speaking-coach.js
          node --check subjects/russian/assets/academic-language.js
          node --check subjects/russian/assets/ai-mentor-guard.js
          node --check subjects/russian/assets/runtime-optimizer.js
          node --check subjects/russian/sw.js
      - name: Audit Russian learning datasets
        run: node subjects/russian/scripts/audit-learning-data.mjs
      - name: Audit Russian content contract
        run: node subjects/russian/scripts/audit-content-contract.mjs
      - name: Audit Russian lesson learning flow
        run: node subjects/russian/scripts/audit-learning-flow.mjs
      - name: Audit Russian vocabulary SRS sources
        run: node subjects/russian/scripts/audit-vocab-srs.mjs
      - name: Audit Russian listening speaking source
        run: node subjects/russian/scripts/audit-speaking-coach.mjs
      - name: Audit Russian grammar reading writing academic sources
        run: node subjects/russian/scripts/audit-academic-language.mjs
      - name: Audit Russian offline cache policy
        run: node subjects/russian/scripts/audit-runtime-offline.mjs
      - name: Audit Russian promotion surface and storage
        run: node subjects/russian/scripts/audit-promotion-candidate.mjs
      - name: Confirm redesign did not replace learning datasets
        shell: bash
        run: |
          set -euo pipefail
          test -d subjects/russian/data
          test -f subjects/russian/data/lessons.json
          test -f subjects/russian/data/vocab.json
          test -f subjects/russian/data/grammar.json
          test -f subjects/russian/data/grammar-path.json
          test -f subjects/russian/data/writing.json
          test -f subjects/russian/data/knowledge-index.json
          test -f subjects/russian/data/tests.json
          test -f subjects/russian/data/speaking.json
          test -f subjects/russian/assets/ui-cleanup-contract.js
          test -f subjects/russian/assets/content-contract.js
          test -f subjects/russian/assets/content-contract.css
          test -f subjects/russian/assets/learning-flow.js
          test -f subjects/russian/assets/learning-flow.css
          test -f subjects/russian/assets/vocab-srs.js
          test -f subjects/russian/assets/vocab-srs.css
          test -f subjects/russian/assets/speaking-coach.js
          test -f subjects/russian/assets/speaking-coach.css
          test -f subjects/russian/assets/academic-language.js
          test -f subjects/russian/assets/academic-language.css
          test -f subjects/russian/assets/ai-mentor-guard.js
          test -f subjects/russian/assets/runtime-optimizer.js
          test -f subjects/russian/assets/runtime-optimizer.css
          test -f subjects/russian/manifest.webmanifest
          test -f subjects/russian/sw.js
          test ! -e subjects/russian/assets/core.css.bak
          test ! -e subjects/russian/assets/core.js.bak
          echo "Russian learning datasets and additive learning runtimes remain present; legacy runtime backups are absent."
