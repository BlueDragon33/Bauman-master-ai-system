name: Mobile Overflow Probe
on:
  push:
    branches: [main]
    paths:
      - 'tests/mobile-overflow-probe.mjs'
      - '.github/workflows/mobile-overflow-probe.yml'
      - 'assets/css/**'
      - 'index.html'
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: |
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/probe-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: node tests/mobile-overflow-probe.mjs
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/