name: Lesson 1.5 Pass 17 static verification
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/l05-pass17-static-verify.yml
permissions:
  contents: write
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false
      - name: Check JavaScript syntax
        run: |
          node --check subjects/math/assets/theory_skin/theory-artifact-registry-E244.js
          node --check subjects/math/assets/theory_skin/theory-artifact-reader-E241.js
          node --check subjects/math/assets/theory_skin/theory-slideshow-richness-E242.js
      - name: Verify schemas and contracts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path('subjects/math')
          l04='MATH-VN-C01-vector_trong_khong_gian_-L04-basis-span-coordinate-e140'
          l05='MATH-VN-C01-vector_trong_khong_gian_-L05-subspace-data-representation-e140'
          checks=[]; failures=[]
          def ok(name,cond,detail=None):
              row={'name':name,'status':'PASS' if cond else 'FAIL','detail':detail}
              checks.append(row)
              if not cond: failures.append(row)

          registry=(root/'assets/theory_skin/theory-artifact-registry-E244.js').read_text(encoding='utf-8')
          reader=(root/'assets/theory_skin/theory-artifact-reader-E241.js').read_text(encoding='utf-8')
          richness=(root/'assets/theory_skin/theory-slideshow-richness-E242.js').read_text(encoding='utf-8')
          index=(root/'index.html').read_text(encoding='utf-8')

          ok('registry L04/L05',l04 in registry and l05 in registry)
          ok('registry four kinds',all(x in registry for x in ["'reference'","'fullView'","'normalization'","'slideshow'"]))
          ok('registry eight sources','sources.length===8' in registry)
          ok('registry resolver','resolve:resolve' in registry and 'multiLessonResolver:true' in registry)
          ok('reader registry contract','BAUMAN_MATH_THEORY_ARTIFACT_REGISTRY_E244' in reader and 'E241_MULTI_LESSON_REFERENCE_FULL_VIEW_READER' in reader and 'cacheByLesson' in reader)
          ok('reader L05 schema',all(x in reader for x in ['modelClassification','projectorSelection','rankReporting','preprocessingGate','caseLookup','troubleshootingMatrix','terminologyLookup','interpretationLimits']))
          ok('reader no new deck',"createElement('section')" not in reader and "appendChild(deck)" not in reader and "className='e132-overlay-deck" not in reader)
          ok('richness registry contract','BAUMAN_MATH_THEORY_ARTIFACT_REGISTRY_E244' in richness and 'E242_MULTI_LESSON_SLIDESHOW_RICHNESS' in richness and 'cacheByLesson' in richness)
          ok('richness existing deck only',"document.querySelector('.e132-overlay-deck.open')" in richness and "createElement('section')" not in richness and "appendChild(deck)" not in richness)
          order=[index.index('theory-slideshow-reader-content-E211.js'),index.index('theory-artifact-registry-E244.js'),index.index('theory-artifact-reader-E241.js'),index.index('theory-slideshow-richness-E242.js')]
          ok('load order',order==sorted(order),order)

          specs={
            'l04ref':('data/theory_reference/theory_reference_c01_l04.json',l04,'REFERENCE_C01_L04_V1_APPROVED'),
            'l04full':('data/theory_full_view/theory_full_view_c01_l04.json',l04,'FULL_VIEW_C01_L04_V1_APPROVED'),
            'l04norm':('data/theory_normalization/theory_normalization_c01_l04.json',l04,'NORMALIZATION_C01_L04_V1_APPROVED'),
            'l04show':('data/theory_slideshow/theory_slideshow_c01_l04.json',l04,'SLIDESHOW_C01_L04_V1_APPROVED'),
            'l05ref':('data/theory_reference/theory_reference_c01_l05.json',l05,'REFERENCE_C01_L05_V1_PASS11'),
            'l05full':('data/theory_full_view/theory_full_view_c01_l05.json',l05,'FULL_VIEW_C01_L05_V1_PASS12'),
            'l05norm':('data/theory_normalization/theory_normalization_c01_l05.json',l05,'NORMALIZATION_C01_L05_V1_PASS12'),
            'l05show':('data/theory_slideshow/theory_slideshow_c01_l05.json',l05,'SLIDESHOW_C01_L05_V1_PASS13')
          }
          docs={}
          for key,(rel,lesson,version) in specs.items():
              doc=json.loads((root/rel).read_text(encoding='utf-8')); docs[key]=doc
              ok(key+' lesson/version',doc.get('lessonId')==lesson and doc.get('version')==version,{'lessonId':doc.get('lessonId'),'version':doc.get('version')})

          def counts(doc):
              slides=doc.get('slides',[])
              return {'slides':len(slides),'diagrams':sum('diagramSpec' in s for s in slides),'retrievalChecks':sum('retrievalCheck' in s for s in slides),'misconceptions':sum('misconceptionIntercept' in s for s in slides)}
          c04=counts(docs['l04show']); c05=counts(docs['l05show'])
          ok('L04 counts',c04=={'slides':22,'diagrams':8,'retrievalChecks':9,'misconceptions':16},c04)
          ok('L05 counts',c05=={'slides':22,'diagrams':9,'retrievalChecks':10,'misconceptions':17},c05)
          ok('L04 order',[s.get('id') for s in docs['l04show']['slides']]==[f'SL{i:02d}' for i in range(1,23)])
          ok('L05 order',[s.get('id') for s in docs['l05show']['slides']]==[f'SL{i:02d}' for i in range(1,23)])
          ok('L05 sections',len(docs['l05full'].get('readingFlow',[]))==12 and len(docs['l05ref'].get('informationArchitecture',[]))==8,{'full':len(docs['l05full'].get('readingFlow',[])),'reference':len(docs['l05ref'].get('informationArchitecture',[]))})
          ok('L05 formula normalization',len(docs['l05norm'].get('canonicalFormulaRegistry',[]))==16,len(docs['l05norm'].get('canonicalFormulaRegistry',[])))

          diagnostic={
            'id':'bauman_math_c01_l05_runtime_pass17_diagnostic_v1',
            'status':'FAIL' if failures else 'PASS',
            'lessonId':l05,
            'checks':checks,
            'failures':failures,
            'l04Richness':c04,
            'l05Richness':c05
          }
          diag_path=root/'THEORY_C01_L05_RUNTIME_PASS17_DIAGNOSTIC.json'
          diag_path.write_text(json.dumps(diagnostic,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          if failures:
              print(json.dumps(diagnostic,ensure_ascii=False,indent=2))
              raise SystemExit(1)

          report={
            'id':'bauman_math_c01_l05_runtime_pass17_v1','schema':'bauman_math_multi_lesson_reader_report_v1','version':'RUNTIME_PASS17_C01_L05_V1',
            'status':'PASS_17_MULTI_LESSON_READER_RICHNESS_STATIC_VERIFY_PASS','date':'2026-07-09','lessonId':l05,
            'verificationMode':'isolated_pull_request_node_syntax_python_schema_and_connector_diff_validation','browserRun':False,
            'registryLessons':2,'registeredSources':8,'l04Richness':c04,'l05Richness':c05,'fullViewSectionsL05':12,'referenceSectionsL05':8,'normalizationFormulaCountL05':16,
            'protectedFilesModified':[],'newSlideshowEngineCreated':False,'checks':checks,'nextTask':'THEORY_C01_L05_SELECTION_ROUTE_SYNC_PASS_18'
          }
          (root/'THEORY_C01_L05_RUNTIME_PASS17.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          state=Path('CODEX_STATE.md'); text=state.read_text(encoding='utf-8')
          text=text.replace('Current task: `THEORY_C01_L05_MULTI_LESSON_READER_RICHNESS_PASS_17`','Current task: `THEORY_C01_L05_SELECTION_ROUTE_SYNC_PASS_18`',1)
          text=text.replace('Status: `PASS_16_RUNTIME_SOURCE_REGISTRATION_STATIC_VERIFY_PASS`','Status: `PASS_17_MULTI_LESSON_READER_RICHNESS_STATIC_VERIFY_PASS`',1)
          text=text.replace('Runtime passes complete: `2/5`.','Runtime passes complete: `3/5`.',1)
          text=text.replace('Runtime passes remaining: `3/5`.','Runtime passes remaining: `2/5`.',1)
          text += '\n\n### Runtime Pass 17 · Multi-lesson reader and richness\n- Status: `PASS_17_MULTI_LESSON_READER_RICHNESS_STATIC_VERIFY_PASS`.\n- Report: `subjects/math/THEORY_C01_L05_RUNTIME_PASS17.json`.\n- E244 registry: 2 lessons, 8 optional sources, shared resolver.\n- E241 and E242 support L04/L05 without a new slideshow engine.\n- L04 richness: 22/8/9/16. L05 richness: 22/9/10/17.\n- E202, E211 and E235 unchanged.\n- Browser QA: not run.\n- Next: `THEORY_C01_L05_SELECTION_ROUTE_SYNC_PASS_18`.\n'
          state.write_text(text,encoding='utf-8')
          PY
      - name: Persist result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f subjects/math/THEORY_C01_L05_RUNTIME_PASS17.json ]; then
            git rm .github/workflows/l05-pass17-static-verify.yml
            git rm --ignore-unmatch subjects/math/THEORY_C01_L05_RUNTIME_PASS17_DIAGNOSTIC.json
            git add CODEX_STATE.md subjects/math/THEORY_C01_L05_RUNTIME_PASS17.json
            git commit -m "test(math): verify lesson 1.5 multi-lesson readers"
          else
            git add subjects/math/THEORY_C01_L05_RUNTIME_PASS17_DIAGNOSTIC.json
            git commit -m "test(math): record lesson 1.5 pass 17 diagnostics" || true
          fi
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
