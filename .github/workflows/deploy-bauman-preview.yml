name: Bauman Cloudflare Preview Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Gõ DEPLOY_PREVIEW để triển khai Bauman Control + Learning Runtime vào preview riêng"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bauman-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: bauman-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BAUMAN_CONTROL_PREVIEW_D1_DATABASE_ID: ${{ secrets.BAUMAN_CONTROL_PREVIEW_D1_DATABASE_ID }}
      BAUMAN_CONTROL_PRODUCTION_D1_DATABASE_ID: ${{ secrets.BAUMAN_CONTROL_PRODUCTION_D1_DATABASE_ID }}
      BAUMAN_CONTROL_SERVICE_SECRET: ${{ secrets.BAUMAN_CONTROL_SERVICE_SECRET }}
      APPLICATION_MANAGEMENT_PREVIEW_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PREVIEW_ORIGIN }}
      BAUMAN_CONTROL_PREVIEW_ORIGIN: ${{ vars.BAUMAN_CONTROL_PREVIEW_ORIGIN }}
      BAUMAN_RUNTIME_PREVIEW_ORIGIN: ${{ vars.BAUMAN_RUNTIME_PREVIEW_ORIGIN }}

    steps:
      - name: Require explicit preview confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm }}" != "DEPLOY_PREVIEW" ]]; then
            echo '::error::Deployment cancelled. Enter DEPLOY_PREVIEW exactly.'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Require Cloudflare credentials and Bauman secret
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BAUMAN_CONTROL_PREVIEW_D1_DATABASE_ID BAUMAN_CONTROL_PRODUCTION_D1_DATABASE_ID BAUMAN_CONTROL_SERVICE_SECRET APPLICATION_MANAGEMENT_PREVIEW_ORIGIN BAUMAN_CONTROL_PREVIEW_ORIGIN BAUMAN_RUNTIME_PREVIEW_ORIGIN; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::$key is required in the bauman-preview GitHub environment."
              exit 1
            fi
          done
          if [[ ${#BAUMAN_CONTROL_SERVICE_SECRET} -lt 32 ]]; then
            echo '::error::BAUMAN_CONTROL_SERVICE_SECRET must contain at least 32 characters.'
            exit 1
          fi

      - name: Install Bauman Control dependencies
        working-directory: control-service
        run: npm install --no-audit --no-fund

      - name: Validate migration boundary
        run: node scripts/validate-cloudflare-preview.mjs

      - name: Preserve existing runtime and control regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/runtime-device-gate-regression.mjs
          (cd control-service && npm run gate)

      - name: Materialize isolated preview configs and runtime assets
        run: node scripts/prepare-cloudflare-preview.mjs

      - name: Apply migrations to Bauman preview D1 only
        working-directory: control-service
        run: npx wrangler d1 migrations apply bauman-control-preview-db --remote --config wrangler.preview.jsonc

      - name: Dry-run Bauman Control preview Worker
        working-directory: control-service
        run: npx wrangler deploy --dry-run --outdir dist-preview --config wrangler.preview.jsonc

      - name: Deploy Bauman Control preview Worker
        working-directory: control-service
        run: npx wrangler deploy --config wrangler.preview.jsonc

      - name: Install or rotate Bauman preview control secret
        working-directory: control-service
        shell: bash
        run: printf '%s' "$BAUMAN_CONTROL_SERVICE_SECRET" | npx wrangler secret put BAUMAN_CONTROL_SERVICE_SECRET --config wrangler.preview.jsonc

      - name: Deploy Bauman Learning Runtime preview Worker
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.runtime.preview.jsonc

      - name: Smoke test separated Bauman preview stack
        shell: bash
        run: |
          set -euo pipefail

          for origin in "$APPLICATION_MANAGEMENT_PREVIEW_ORIGIN" "$BAUMAN_CONTROL_PREVIEW_ORIGIN" "$BAUMAN_RUNTIME_PREVIEW_ORIGIN"; do
            case "$origin" in
              https://*) ;;
              *) echo "::error::Preview origin must be HTTPS: $origin"; exit 1 ;;
            esac
            if [[ "$origin" == *.chatgpt.site ]]; then
              echo "::error::Preview origin must not point to ChatGPT Sites: $origin"
              exit 1
            fi
          done

          curl --fail --silent --show-error --max-time 15 "$BAUMAN_CONTROL_PREVIEW_ORIGIN/__deployment" > /tmp/bauman-control-deploy.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync('/tmp/bauman-control-deploy.json', 'utf8'));
          if (value.application !== 'bauman-master-ai' || value.runtime !== 'control-service') throw new Error('Bauman Control identity mismatch.');
          if (value.channel !== 'cloudflare-preview') throw new Error('Bauman Control deployment channel mismatch.');
          if (!value.databaseReady) throw new Error('Bauman preview D1 schema is not ready.');
          if (!value.revision || value.revision === 'unknown') throw new Error('Bauman Control build revision missing.');
          NODE

          curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $BAUMAN_CONTROL_SERVICE_SECRET" \
            -H "x-control-actor: github-preview-smoke" \
            -H "x-control-role: owner" \
            "$BAUMAN_CONTROL_PREVIEW_ORIGIN/api/control/status" > /tmp/bauman-control-status.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync('/tmp/bauman-control-status.json', 'utf8'));
          if (value.application !== 'bauman-master-ai') throw new Error('Bauman control status application mismatch.');
          if (value.readiness?.deviceRegistry !== 'available') throw new Error('Bauman device registry is not ready.');
          if (!value.capabilities?.deviceApproval || !value.capabilities?.deviceIdempotentCommands) throw new Error('Bauman mutation contract is unavailable.');
          NODE

          PREFLIGHT_CODE="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -X OPTIONS -H "Origin: $BAUMAN_RUNTIME_PREVIEW_ORIGIN" \
            "$BAUMAN_CONTROL_PREVIEW_ORIGIN/api/device/status")"
          test "$PREFLIGHT_CODE" = "204"

          curl --fail --silent --show-error --max-time 15 "$BAUMAN_RUNTIME_PREVIEW_ORIGIN/__deployment" > /tmp/bauman-runtime-deploy.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync('/tmp/bauman-runtime-deploy.json', 'utf8'));
          if (value.application !== 'bauman-master-ai' || value.runtime !== 'learning-runtime') throw new Error('Bauman Learning Runtime identity mismatch.');
          if (value.channel !== 'cloudflare-preview' || !value.controlOriginConfigured) throw new Error('Bauman Learning Runtime preview configuration mismatch.');
          if (!value.revision || value.revision === 'unknown') throw new Error('Bauman Learning Runtime build revision missing.');
          NODE

          curl --fail --silent --show-error --max-time 15 "$BAUMAN_RUNTIME_PREVIEW_ORIGIN/" > /tmp/bauman-home.html
          grep -Fq "name=\"bauman-control-origin\" content=\"$BAUMAN_CONTROL_PREVIEW_ORIGIN\"" /tmp/bauman-home.html
          grep -Fq 'assets/js/platform/device-access-gate.js' /tmp/bauman-home.html

          curl --fail --silent --show-error --max-time 20 "$BAUMAN_RUNTIME_PREVIEW_ORIGIN/subjects/russian/" > /tmp/bauman-russian.html
          grep -Fq 'assets/russian-reference-ui.js' /tmp/bauman-russian.html
          grep -Fq 'assets/russian-reference-ui-polish.css' /tmp/bauman-russian.html
          grep -Fq 'assets/russian-optional-data-loader.js' /tmp/bauman-russian.html
          curl --fail --silent --show-error --max-time 20 --output /dev/null "$BAUMAN_RUNTIME_PREVIEW_ORIGIN/subjects/russian/assets/russian-reference-ui.js"
          curl --fail --silent --show-error --max-time 20 --output /dev/null "$BAUMAN_RUNTIME_PREVIEW_ORIGIN/subjects/russian/assets/russian-reference-ui-polish.css"
          curl --fail --silent --show-error --max-time 20 --output /dev/null "$BAUMAN_RUNTIME_PREVIEW_ORIGIN/subjects/russian/assets/russian-optional-data-loader.js"

          for dataset in dialogue-bauman-az deep-speaking-bauman; do
            manifest="/tmp/${dataset}-manifest.json"
            curl --fail --silent --show-error --max-time 20 \
              "$BAUMAN_RUNTIME_PREVIEW_ORIGIN/subjects/russian/data/chunks/$dataset/manifest.json" > "$manifest"
            first="$(node -e "const m=require(process.argv[1]); if(m.format!=='json-array-chunks-v1'||!m.chunks?.length) process.exit(2); process.stdout.write(m.chunks[0].file)" "$manifest")"
            curl --fail --silent --show-error --max-time 30 --output /dev/null \
              "$BAUMAN_RUNTIME_PREVIEW_ORIGIN/subjects/russian/data/chunks/$dataset/$first"
          done

      - name: Deployment boundary summary
        shell: bash
        run: |
          echo 'Bauman preview deployment completed.'
          echo 'Control Worker: bauman-control-preview'
          echo 'D1: bauman-control-preview-db'
          echo 'Learning Worker: bauman-master-ai-preview'
          echo 'Subject Web Apps: /subjects/* packaged and smoke-tested.'
          echo 'Russian lazy datasets: chunk manifests and first chunks smoke-tested.'
          echo 'Application-Management remains the only central control-plane.'
          echo 'No production Worker or production D1 is changed by this workflow.'
