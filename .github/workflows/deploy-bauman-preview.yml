name: Bauman Cloudflare Preview Deploy

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: bauman-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: bauman-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BAUMAN_CONTROL_PREVIEW_D1_DATABASE_ID: ${{ secrets.BAUMAN_CONTROL_PREVIEW_D1_DATABASE_ID }}
      BAUMAN_CONTROL_PRODUCTION_D1_DATABASE_ID: ${{ secrets.BAUMAN_CONTROL_PRODUCTION_D1_DATABASE_ID }}
      BAUMAN_CONTROL_SERVICE_SECRET: ${{ secrets.BAUMAN_CONTROL_SERVICE_SECRET }}
      APPLICATION_MANAGEMENT_PREVIEW_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PREVIEW_ORIGIN }}
      BAUMAN_CONTROL_PREVIEW_ORIGIN: ${{ vars.BAUMAN_CONTROL_PREVIEW_ORIGIN }}
      BAUMAN_RUNTIME_PREVIEW_ORIGIN: ${{ vars.BAUMAN_RUNTIME_PREVIEW_ORIGIN }}
      BAUMAN_ACCESS_MODE: standalone

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Require preview credentials
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BAUMAN_CONTROL_PREVIEW_D1_DATABASE_ID BAUMAN_CONTROL_PRODUCTION_D1_DATABASE_ID APPLICATION_MANAGEMENT_PREVIEW_ORIGIN BAUMAN_CONTROL_PREVIEW_ORIGIN BAUMAN_RUNTIME_PREVIEW_ORIGIN; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::$key is required in the bauman-preview GitHub environment."
              exit 1
            fi
          done

      - name: Install Control dependencies
        working-directory: control-service
        run: npm ci --no-audit --no-fund

      - name: Package preview
        run: node scripts/prepare-cloudflare-preview.mjs

      - name: Apply preview D1 migrations
        working-directory: control-service
        run: npx wrangler d1 migrations apply bauman-control-preview-db --remote --config wrangler.preview.jsonc

      - name: Deploy Control preview
        working-directory: control-service
        run: npx wrangler deploy --config wrangler.preview.jsonc

      - name: Deploy Learning Runtime preview
        run: npx --yes wrangler@4.147.0 deploy --config wrangler.runtime.preview.jsonc

      - name: Verify exact preview runtime and Python activation
        shell: bash
        run: |
          set -euo pipefail
          BAUMAN_DEPLOYMENT_URL="$BAUMAN_RUNTIME_PREVIEW_ORIGIN/__deployment" \
          BAUMAN_EXPECTED_REVISION="$GITHUB_SHA" \
          BAUMAN_EXPECTED_CHANNEL="cloudflare-preview" \
          BAUMAN_EXPECTED_RUNTIME="learning-runtime" \
          node scripts/wait-cloudflare-deployment-revision.mjs > /tmp/bauman-preview-runtime.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const runtime = JSON.parse(fs.readFileSync('/tmp/bauman-preview-runtime.json', 'utf8'));
          if (!runtime.controlOriginConfigured) throw new Error('Preview runtime control origin is not configured.');
          if (runtime.pythonExecutionEnabled !== true) throw new Error('Preview Python execution is not enabled.');
          if (runtime.pythonRuntimeProfile !== 'cpython-3.14.8-stdlib-v1') {
            throw new Error('Preview Python runtime profile mismatch: ' + String(runtime.pythonRuntimeProfile));
          }
          console.log('Exact preview Python release identity PASS.');
          NODE

      - name: Preview summary
        run: |
          echo "Bauman development preview updated."
          echo "Revision: $GITHUB_SHA"
          echo "Heavy validation is intentionally deferred during active development."
