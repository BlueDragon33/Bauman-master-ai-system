name: Pass 20 slideshow deck diagnostic ownership rerun
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pass20-deck-diagnostic.yml
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          mkdir -p /tmp/deckdiag && cd /tmp/deckdiag
          npm init -y >/dev/null 2>&1
          npm install playwright@1.51.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Diagnose real deck
        env:
          NODE_PATH: /tmp/deckdiag/node_modules
        run: |
          python3 -m http.server 4173 --directory "$GITHUB_WORKSPACE" >/tmp/deckdiag-http.log 2>&1 &
          cat > /tmp/deckdiag/run.mjs <<'JS'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const lessonId='MATH-VN-C01-vector_trong_khong_gian_-L04-basis-span-coordinate-e140';
          const chapterId='MATH-VN-C01-vector_trong_khong_gian_';
          const out={executedAt:new Date().toISOString(),status:'FAIL',pageErrors:[],consoleErrors:[],failedRequests:[]};
          let browser;
          try{
            browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            page.on('pageerror',e=>out.pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')out.consoleErrors.push(m.text())});
            page.on('requestfailed',r=>out.failedRequests.push({url:r.url(),error:r.failure()?.errorText||''}));
            await page.goto('http://127.0.0.1:4173/subjects/math/index.html',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>window.BAUMAN_MATH_THEORY_E129&&window.BAUMAN_MATH_THEORY_E132,{timeout:60000});
            await page.waitForFunction(()=>window.BAUMAN_MATH_THEORY_E129.selfCheck().sources.content>0,{timeout:60000});
            await page.evaluate(({lessonId,chapterId})=>{
              const st=(window.__BAUMAN_CORE_API&&window.__BAUMAN_CORE_API.state)||window.__MATH_STATE||(window.__MATH_STATE={});
              st.view='learning';st.learnTab='theory';st.stage='vn';st.e129Stage='vn';st.e129ChapterId=chapterId;st.e129LessonId=lessonId;st.e129Present=false;
              st.e169Path={moduleId:'pure',courseId:'pure-algebra',chapterId:'c01',activityId:'theory',lessonId};
              window.BAUMAN_MATH_THEORY_E129.render();
            },{lessonId,chapterId});
            await page.waitForFunction(id=>document.querySelector('.e129-reader')?.textContent.includes(id),lessonId,{timeout:30000});
            out.readerBefore=await page.evaluate(()=>({
              sourceSlides:document.querySelectorAll('.e129-slide-list .e129-slide').length,
              shellClass:document.querySelector('.e129-theory-shell')?.className||'',
              currentLesson:document.querySelector('[data-current-lesson]')?.getAttribute('data-current-lesson')||'',
              lessonText:document.querySelector('.e129-reader')?.textContent.slice(0,300)||''
            }));
            await page.click('[data-e129-present]');
            await page.waitForSelector('.e132-overlay-deck.open',{timeout:30000});
            await page.waitForTimeout(1800);
            out.deck=await page.evaluate(()=>({
              count:document.querySelector('[data-e202-count]')?.textContent||'',
              mode:document.querySelector('[data-e202-mode]')?.textContent||'',
              role:document.querySelector('.e132-clean-role')?.textContent||'',
              title:document.querySelector('.e132-clean-main h1')?.textContent||'',
              side:document.querySelector('.e132-clean-side small')?.textContent||'',
              sourceSlidesPresenting:document.querySelectorAll('.e129-theory-shell.presenting .e129-slide-list .e129-slide').length,
              sourceSlidesAny:document.querySelectorAll('.e129-slide-list .e129-slide').length,
              currentLesson:document.querySelector('[data-current-lesson]')?.getAttribute('data-current-lesson')||'',
              e202:window.BAUMAN_MATH_THEORY_E132.selfCheck(),
              e211:window.BAUMAN_MATH_E211_READER_CONTENT&&window.BAUMAN_MATH_E211_READER_CONTENT.selfCheck(),
              e242:window.BAUMAN_MATH_E242_SLIDESHOW_RICHNESS&&window.BAUMAN_MATH_E242_SLIDESHOW_RICHNESS.selfCheck(),
              bodyClasses:document.body.className,
              shellClass:document.querySelector('.e129-theory-shell')?.className||'',
              activeTextCandidates:Array.from(document.querySelectorAll('[data-e210-lesson-id],.e210-source-line,.e129-reader-title,.e132-clean-side small,.e132-clean-main h1')).map(x=>x.textContent.trim()).filter(Boolean)
            }));
            out.status='PASS';
          }catch(e){out.error=String(e&&e.stack||e)}finally{
            if(browser)await browser.close();
            fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/subjects/math/PASS20_DECK_DIAGNOSTIC.json',JSON.stringify(out,null,2)+'\n');
          }
          JS
          node /tmp/deckdiag/run.mjs
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subjects/math/PASS20_DECK_DIAGNOSTIC.json
          git commit -m "test(math): record slideshow deck diagnostic"
          git push origin HEAD:main
