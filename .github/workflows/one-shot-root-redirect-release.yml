name: One-shot Bauman root redirect release
on:
  push:
    branches: ["ops/one-shot-root-redirect-release-20260925"]

permissions:
  contents: read
  actions: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_SHA: f21274f7fb5cea8d85db3cc2ae1a99a3e3a5231e
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify exact main
        run: |
          node <<'NODE'
          const repo=process.env.GITHUB_REPOSITORY,target=process.env.TARGET_SHA,token=process.env.GH_TOKEN;
          const h={authorization:`Bearer ${token}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28'};
          const r=await fetch(`https://api.github.com/repos/${repo}/git/ref/heads/main`,{headers:h});
          if(!r.ok) throw new Error(`main ref HTTP ${r.status}`);
          const actual=(await r.json()).object.sha;
          if(actual!==target) throw new Error(`main moved: ${actual} !== ${target}`);
          console.log(`MAIN_EXACT_TARGET_PASS ${actual}`);
          NODE

      - name: Dispatch Preview and wait
        run: |
          node <<'NODE'
          const repo=process.env.GITHUB_REPOSITORY,target=process.env.TARGET_SHA,token=process.env.GH_TOKEN;
          const workflow='deploy-bauman-preview.yml';
          const h={authorization:`Bearer ${token}`,accept:'application/vnd.github+json','content-type':'application/json','x-github-api-version':'2022-11-28'};
          const started=Date.now()-15000;
          let r=await fetch(`https://api.github.com/repos/${repo}/actions/workflows/${workflow}/dispatches`,{method:'POST',headers:h,body:JSON.stringify({ref:'main',inputs:{confirm:'DEPLOY_PREVIEW'}})});
          if(!r.ok) throw new Error(`Preview dispatch HTTP ${r.status}: ${await r.text()}`);
          const deadline=Date.now()+35*60*1000;
          while(Date.now()<deadline){
            r=await fetch(`https://api.github.com/repos/${repo}/actions/workflows/${workflow}/runs?branch=main&event=workflow_dispatch&per_page=20`,{headers:h});
            const runs=(await r.json()).workflow_runs||[];
            const run=runs.find(x=>x.head_sha===target && Date.parse(x.created_at)>=started);
            if(run){
              console.log(`PREVIEW_RUN id=${run.id} status=${run.status} conclusion=${run.conclusion||''}`);
              if(run.status==='completed'){
                if(run.conclusion!=='success') throw new Error(`Preview ${run.id} => ${run.conclusion}`);
                process.exit(0);
              }
            }
            await new Promise(r=>setTimeout(r,10000));
          }
          throw new Error('Preview timeout');
          NODE

      - name: Re-verify exact main
        run: |
          node <<'NODE'
          const repo=process.env.GITHUB_REPOSITORY,target=process.env.TARGET_SHA,token=process.env.GH_TOKEN;
          const h={authorization:`Bearer ${token}`,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28'};
          const r=await fetch(`https://api.github.com/repos/${repo}/git/ref/heads/main`,{headers:h});
          const actual=(await r.json()).object.sha;
          if(actual!==target) throw new Error(`main moved after preview: ${actual} !== ${target}`);
          NODE

      - name: Dispatch Production and wait
        run: |
          node <<'NODE'
          const repo=process.env.GITHUB_REPOSITORY,target=process.env.TARGET_SHA,token=process.env.GH_TOKEN;
          const workflow='deploy-bauman-production.yml';
          const h={authorization:`Bearer ${token}`,accept:'application/vnd.github+json','content-type':'application/json','x-github-api-version':'2022-11-28'};
          const started=Date.now()-15000;
          let r=await fetch(`https://api.github.com/repos/${repo}/actions/workflows/${workflow}/dispatches`,{method:'POST',headers:h,body:JSON.stringify({ref:'main',inputs:{confirm:'DEPLOY_PRODUCTION'}})});
          if(!r.ok) throw new Error(`Production dispatch HTTP ${r.status}: ${await r.text()}`);
          const deadline=Date.now()+35*60*1000;
          while(Date.now()<deadline){
            r=await fetch(`https://api.github.com/repos/${repo}/actions/workflows/${workflow}/runs?branch=main&event=workflow_dispatch&per_page=20`,{headers:h});
            const runs=(await r.json()).workflow_runs||[];
            const run=runs.find(x=>x.head_sha===target && Date.parse(x.created_at)>=started);
            if(run){
              console.log(`PRODUCTION_RUN id=${run.id} status=${run.status} conclusion=${run.conclusion||''}`);
              if(run.status==='completed'){
                if(run.conclusion!=='success') throw new Error(`Production ${run.id} => ${run.conclusion}`);
                process.exit(0);
              }
            }
            await new Promise(r=>setTimeout(r,10000));
          }
          throw new Error('Production timeout');
          NODE
