name: Universal Constitution Compliance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  constitution:
    uses: BlueDragon33/Software-Blueprint-Hub/.github/workflows/constitution-compliance.yml@main

  dependency-sovereignty:
    name: Constitution 1.2 Bauman dependency sovereignty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate project dependency budget
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path(".blueprint/constitution-adoption.json").read_text())
          b=json.loads(Path("prompts/DEPENDENCY_BUDGET.json").read_text())
          assert a["policyVersion"]=="1.2.0"
          assert "operational-sovereignty-dependency-minimization" in a["inheritedPillars"]
          assert b["constitutionPolicy"]=="blueprint-os:universal-century-grade@1.2.0"
          assert "LOCAL_FIRST" in b["defaultPrinciple"]
          deps={d["id"]:d for d in b["dependencies"]}
          assert deps["browser-local-runtime"]["runtimeClass"]=="LOCAL_CORE"
          assert deps["chatgpt"]["runtimeClass"]=="OPTIONAL_INTELLIGENCE"
          assert deps["cloudflare-containers-python"]["runtimeClass"]=="OPTIONAL_PUBLISH"
          assert deps["cloudflare-containers-python"]["costClass"]=="paid-optional"
          assert deps["google-drive"]["runtimeClass"]=="OPTIONAL_SYNC"
          for d in b["dependencies"]:
              assert d.get("degradedBehavior")
              assert d.get("exportPath")
              assert d.get("replacementPath")
          assert b["acceptance"]["productionAuthority"]=="separate-explicit-release-gate"
          print("Bauman Constitution 1.2 dependency sovereignty: PASS")
          PY
