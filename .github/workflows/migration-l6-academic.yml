name: Migration L6 Academic Architecture Regression

on:
  push:
    branches:
      - migration/webapp-l1-audit-storage
    paths:
      - assets/data/lesson/**
      - assets/data/roadmap/**
      - assets/js/platform/universal-lesson/**
      - subjects/**
      - scripts/academic/**
      - docs/migration/L6_**
      - docs/migration/MIGRATION_PLAN.md
      - CODEX_STATE.md
      - .github/workflows/migration-l6-academic.yml
  pull_request:
    branches:
      - main
      - migration/webapp-l1-audit-storage
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: migration-l6-academic-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l6-academic-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run deterministic L6-B1 gate
        id: b1_gate
        run: |
          node --check scripts/academic/l6-b1-reference-audit.cjs
          node scripts/academic/l6-b1-reference-audit.cjs
          git diff --exit-code -- docs/migration/L6_B1_REFERENCE_AUDIT.generated.json

      - name: Run deterministic L6-B2 gate
        id: b2_gate
        run: |
          node --check scripts/academic/l6-b2-universal-lesson-contract-regression.cjs
          node scripts/academic/l6-b2-universal-lesson-contract-regression.cjs
          git diff --exit-code -- docs/migration/L6_B2_UNIVERSAL_LESSON_CONTRACT.generated.json

      - name: Run deterministic L6-B3 gate
        id: b3_gate
        run: |
          node --check scripts/academic/l6-b3-block-policy-regression.cjs
          node scripts/academic/l6-b3-block-policy-regression.cjs
          git diff --exit-code -- docs/migration/L6_B3_BLOCK_POLICY.generated.json

      - name: Run deterministic L6-B4 gate
        id: b4_gate
        run: |
          node --check scripts/academic/l6-b4-lesson-type-registry-regression.cjs
          node scripts/academic/l6-b4-lesson-type-registry-regression.cjs
          git diff --exit-code -- docs/migration/L6_B4_LESSON_TYPE_REGISTRY.generated.json

      - name: Run deterministic L6-B5 gate
        id: b5_gate
        run: |
          node --check scripts/academic/l6-b5-master-ready-regression.cjs
          node scripts/academic/l6-b5-master-ready-regression.cjs
          git diff --exit-code -- docs/migration/L6_B5_MASTER_READY_REGRESSION.generated.json

      - name: Run deterministic L6-B6 gate
        id: b6_gate
        run: |
          node --check scripts/academic/l6-b6-visual-teaching-regression.cjs
          node scripts/academic/l6-b6-visual-teaching-regression.cjs
          git diff --exit-code -- docs/migration/L6_B6_VISUAL_TEACHING_REGRESSION.generated.json

      - name: Run deterministic L6-B7 gate
        id: b7_gate
        run: |
          node --check scripts/academic/l6-b7-language-layer-regression.cjs
          node scripts/academic/l6-b7-language-layer-regression.cjs
          git diff --exit-code -- docs/migration/L6_B7_LANGUAGE_LAYER_REGRESSION.generated.json

      - name: Run deterministic L6-B8 gate
        id: b8_gate
        run: |
          node --check assets/js/platform/universal-lesson/lesson-schema-validator-v1.js
          node --check assets/js/platform/universal-lesson/lesson-version-migrator-v1.js
          node --check scripts/academic/l6-b8-schema-migration-regression.cjs
          node scripts/academic/l6-b8-schema-migration-regression.cjs
          git diff --exit-code -- docs/migration/L6_B8_SCHEMA_MIGRATION_REGRESSION.generated.json

      - name: Run deterministic L6-B9 gate
        id: b9_gate
        run: |
          node --check assets/js/platform/universal-lesson/subject-factory-registry-v1.js
          node --check scripts/academic/l6-b9-subject-factory-regression.cjs
          node scripts/academic/l6-b9-subject-factory-regression.cjs
          git diff --exit-code -- docs/migration/L6_B9_SUBJECT_FACTORY_REGRESSION.generated.json

      - name: Run deterministic L6-B10 gate
        id: b10_gate
        run: |
          node --check assets/js/platform/universal-lesson/universal-lesson-renderer-v1.js
          node --check assets/js/platform/universal-lesson/legacy-lesson-bridge-v1.js
          node --check scripts/academic/l6-b10-renderer-bridge-regression.cjs
          node scripts/academic/l6-b10-renderer-bridge-regression.cjs
          git diff --exit-code -- docs/migration/L6_B10_RENDERER_BRIDGE_REGRESSION.generated.json

      - name: Publish L6-B1 status
        if: ${{ always() && github.event_name == 'push' && steps.b1_gate.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_OUTCOME: ${{ steps.b1_gate.outcome }}
        run: |
          STATE=failure
          if [ "$GATE_OUTCOME" = "success" ]; then STATE=success; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="migration/l6-b1-reference-audit" \
            -f description="L6-B1 reference audit: ${GATE_OUTCOME}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish L6-B2 status
        if: ${{ always() && github.event_name == 'push' && steps.b2_gate.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_OUTCOME: ${{ steps.b2_gate.outcome }}
        run: |
          STATE=failure
          if [ "$GATE_OUTCOME" = "success" ]; then STATE=success; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="migration/l6-b2-universal-contract" \
            -f description="L6-B2 universal contract: ${GATE_OUTCOME}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish L6-B3 status
        if: ${{ always() && github.event_name == 'push' && steps.b3_gate.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_OUTCOME: ${{ steps.b3_gate.outcome }}
        run: |
          STATE=failure
          if [ "$GATE_OUTCOME" = "success" ]; then STATE=success; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="migration/l6-b3-block-policy" \
            -f description="L6-B3 block policy: ${GATE_OUTCOME}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish L6-B4 status
        if: ${{ always() && github.event_name == 'push' && steps.b4_gate.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_OUTCOME: ${{ steps.b4_gate.outcome }}
        run: |
          STATE=failure
          if [ "$GATE_OUTCOME" = "success" ]; then STATE=success; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="migration/l6-b4-lesson-types" \
            -f description="L6-B4 lesson types: ${GATE_OUTCOME}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish L6-B5 status
        if: ${{ always() && github.event_name == 'push' && steps.b5_gate.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_OUTCOME: ${{ steps.b5_gate.outcome }}
        run: |
          STATE=failure
          if [ "$GATE_OUTCOME" = "success" ]; then STATE=success; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="migration/l6-b5-master-ready" \
            -f description="L6-B5 Master-ready: ${GATE_OUTCOME}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish L6-B6 status
        if: ${{ always() && github.event_name == 'push' && steps.b6_gate.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_OUTCOME: ${{ steps.b6_gate.outcome }}
        run: |
          STATE=failure
          if [ "$GATE_OUTCOME" = "success" ]; then STATE=success; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="migration/l6-b6-visual-teaching" \
            -f description="L6-B6 visual teaching: ${GATE_OUTCOME}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish L6-B7 status
        if: ${{ always() && github.event_name == 'push' && steps.b7_gate.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_OUTCOME: ${{ steps.b7_gate.outcome }}
        run: |
          STATE=failure
          if [ "$GATE_OUTCOME" = "success" ]; then STATE=success; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="migration/l6-b7-language-hooks" \
            -f description="L6-B7 language hooks: ${GATE_OUTCOME}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish L6-B8 status
        if: ${{ always() && github.event_name == 'push' && steps.b8_gate.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_OUTCOME: ${{ steps.b8_gate.outcome }}
        run: |
          STATE=failure
          if [ "$GATE_OUTCOME" = "success" ]; then STATE=success; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="migration/l6-b8-schema-migration" \
            -f description="L6-B8 schema migration: ${GATE_OUTCOME}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish L6-B9 status
        if: ${{ always() && github.event_name == 'push' && steps.b9_gate.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_OUTCOME: ${{ steps.b9_gate.outcome }}
        run: |
          STATE=failure
          if [ "$GATE_OUTCOME" = "success" ]; then STATE=success; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="migration/l6-b9-subject-factory" \
            -f description="L6-B9 Subject Factory: ${GATE_OUTCOME}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish L6-B10 status
        if: ${{ always() && github.event_name == 'push' && steps.b10_gate.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_OUTCOME: ${{ steps.b10_gate.outcome }}
        run: |
          STATE=failure
          if [ "$GATE_OUTCOME" = "success" ]; then STATE=success; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="migration/l6-b10-renderer-bridge" \
            -f description="L6-B10 renderer bridge: ${GATE_OUTCOME}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
