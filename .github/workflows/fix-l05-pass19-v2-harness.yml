name: Fix Lesson 1.5 Pass 19 v2 harness
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/fix-l05-pass19-v2-harness.yml
permissions:
  contents: write
jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false
      - name: Add animation-frame stability wait
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/l05-pass19-chromium-qa-v2.yml')
          text=p.read_text(encoding='utf-8')
          old='await moveTo(page,22);'
          wait="await page.waitForFunction(id=>document.querySelector('.e132-overlay-deck.open .e241-actions')?.getAttribute('data-e241-lesson-id')===id,L.id,{timeout:10000});"
          if text.count(old)!=1:
              raise SystemExit(f'Expected exactly one target, found {text.count(old)}')
          p.write_text(text.replace(old,old+wait,1),encoding='utf-8')
          PY
          git rm .github/workflows/fix-l05-pass19-v2-harness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/l05-pass19-chromium-qa-v2.yml
          git commit -m "test(math): wait for lesson artifact controls at slide 22"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
