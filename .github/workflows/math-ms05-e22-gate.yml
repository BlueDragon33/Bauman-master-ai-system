name: Math m_s05 E22 prep synthesis gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'subjects/math/**'
      - 'scripts/validate-math-ms05-e22.mjs'
      - 'scripts/validate-math-ms05-runtime-routing-e22.mjs'
      - 'tests/math-ms05-e22-browser.mjs'
      - '.github/workflows/math-ms05-e22-gate.yml'
permissions:
  contents: read
jobs:
  ms05-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.13.0'}
      - run: node scripts/validate-math-ms05-e22.mjs
      - run: node scripts/validate-math-ms05-runtime-routing-e22.mjs
  ms05-browser:
    needs: ms05-static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.13.0'}
      - name: Install Playwright Chromium
        run: |
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local runtime
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/bauman-ms05-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bauman-ms05-http.log
          exit 1
      - name: Run E22 browser acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/math-ms05-e22
        run: node tests/math-ms05-e22-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: math-ms05-e22-${{ github.run_id }}
          path: artifacts/math-ms05-e22
          if-no-files-found: ignore
