name: Content Asset Provenance Gate

on:
  push:
    branches:
      - main
      - work/foundation-v2-l10-content-asset-provenance
      - promotion/foundation-content-provenance-main-reconciled
    paths:
      - 'foundation/content-registry/**'
      - 'foundation/domain-model/domain-contract.v1.json'
      - 'foundation/domain-model/canonical-identity-runtime.js'
      - 'scripts/validate-content-asset-provenance-registry.mjs'
      - 'scripts/validate-content-asset-registry-runtime.mjs'
      - 'scripts/validate-asset-integrity.mjs'
      - 'scripts/validate-provenance-chain.mjs'
      - 'scripts/validate-access-policy.mjs'
      - 'scripts/validate-registry-snapshot.mjs'
      - 'scripts/validate-registry-snapshot-store.mjs'
      - 'scripts/validate-registry-snapshot-integrity.mjs'
      - 'scripts/validate-foundation-l10-promotion.mjs'
      - 'tests/content-asset-provenance-contract.test.mjs'
      - 'tests/content-asset-registry-runtime.test.mjs'
      - 'tests/asset-integrity.test.mjs'
      - 'tests/provenance-chain.test.mjs'
      - 'tests/access-policy.test.mjs'
      - 'tests/registry-snapshot.test.mjs'
      - 'tests/registry-snapshot-store.test.mjs'
      - 'tests/registry-snapshot-integrity.test.mjs'
      - '.github/workflows/content-asset-provenance-gate.yml'
  pull_request:
    paths:
      - 'foundation/content-registry/**'
      - 'foundation/domain-model/domain-contract.v1.json'
      - 'foundation/domain-model/canonical-identity-runtime.js'
      - 'scripts/validate-content-asset-provenance-registry.mjs'
      - 'scripts/validate-content-asset-registry-runtime.mjs'
      - 'scripts/validate-asset-integrity.mjs'
      - 'scripts/validate-provenance-chain.mjs'
      - 'foundation/content-registry/access-policy.js'
      - 'scripts/validate-access-policy.mjs'
      - 'foundation/content-registry/registry-snapshot.js'
      - 'scripts/validate-registry-snapshot.mjs'
      - 'foundation/content-registry/registry-snapshot-store.js'
      - 'scripts/validate-registry-snapshot-store.mjs'
      - 'foundation/content-registry/registry-snapshot-integrity.js'
      - 'scripts/validate-registry-snapshot-integrity.mjs'
      - 'foundation/content-registry/l10-promotion-manifest.v1.json'
      - 'scripts/validate-foundation-l10-promotion.mjs'
      - 'scripts/validate-foundation-domain-model.mjs'
      - 'tests/content-asset-provenance-contract.test.mjs'
      - 'tests/content-asset-registry-runtime.test.mjs'
      - 'tests/asset-integrity.test.mjs'
      - 'tests/provenance-chain.test.mjs'
      - 'tests/access-policy.test.mjs'
      - 'tests/registry-snapshot.test.mjs'
      - 'tests/registry-snapshot-store.test.mjs'
      - 'tests/registry-snapshot-integrity.test.mjs'
      - '.github/workflows/content-asset-provenance-gate.yml'

permissions:
  contents: read

jobs:
  validate-content-asset-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check validator and runtime syntax
        run: |
          node --check foundation/content-registry/content-asset-registry.js
          node --check foundation/content-registry/asset-integrity.js
          node --check foundation/content-registry/provenance-chain.js
          node --check foundation/content-registry/access-policy.js
          node --check foundation/content-registry/registry-snapshot.js
          node --check foundation/content-registry/registry-snapshot-store.js
          node --check foundation/content-registry/registry-snapshot-integrity.js
          node --check scripts/validate-content-asset-provenance-registry.mjs
          node --check scripts/validate-content-asset-registry-runtime.mjs
          node --check scripts/validate-asset-integrity.mjs
          node --check scripts/validate-provenance-chain.mjs
          node --check scripts/validate-access-policy.mjs
          node --check scripts/validate-registry-snapshot.mjs
          node --check scripts/validate-registry-snapshot-store.mjs
          node --check scripts/validate-registry-snapshot-integrity.mjs
          node --check scripts/validate-foundation-l10-promotion.mjs
          node --check tests/content-asset-provenance-contract.test.mjs
          node --check tests/content-asset-registry-runtime.test.mjs
          node --check tests/asset-integrity.test.mjs
          node --check tests/provenance-chain.test.mjs
          node --check tests/access-policy.test.mjs
          node --check tests/registry-snapshot.test.mjs
          node --check tests/registry-snapshot-store.test.mjs
          node --check tests/registry-snapshot-integrity.test.mjs
      - name: Validate promoted L9 domain foundation
        run: node scripts/validate-foundation-domain-model.mjs
      - name: Validate content asset provenance contract
        run: node scripts/validate-content-asset-provenance-registry.mjs
      - name: Run contract negative tests
        run: node tests/content-asset-provenance-contract.test.mjs
      - name: Validate immutable registry runtime
        run: node scripts/validate-content-asset-registry-runtime.mjs
      - name: Run registry runtime negative tests
        run: node tests/content-asset-registry-runtime.test.mjs
      - name: Validate cryptographic asset integrity
        run: node scripts/validate-asset-integrity.mjs
      - name: Run asset integrity negative tests
        run: node tests/asset-integrity.test.mjs
      - name: Validate provenance chain and lineage
        run: node scripts/validate-provenance-chain.mjs
      - name: Run provenance lineage negative tests
        run: node tests/provenance-chain.test.mjs
      - name: Validate access policy decisions
        run: node scripts/validate-access-policy.mjs
      - name: Run access policy negative tests
        run: node tests/access-policy.test.mjs
      - name: Validate deterministic registry snapshots
        run: node scripts/validate-registry-snapshot.mjs
      - name: Run registry snapshot negative tests
        run: node tests/registry-snapshot.test.mjs
      - name: Validate transactional registry snapshot store
        run: node scripts/validate-registry-snapshot-store.mjs
      - name: Run registry snapshot store negative tests
        run: node tests/registry-snapshot-store.test.mjs
      - name: Validate cryptographic registry snapshot integrity
        run: node scripts/validate-registry-snapshot-integrity.mjs
      - name: Run registry snapshot integrity negative tests
        run: node tests/registry-snapshot-integrity.test.mjs
      - name: Validate L10 promotion freeze
        run: node scripts/validate-foundation-l10-promotion.mjs
      - name: Parse registry JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('foundation/content-registry/registry-contract.v1.json','utf8')); console.log('CONTENT_REGISTRY_JSON_PARSE=PASS')"
          node -e "JSON.parse(require('fs').readFileSync('foundation/content-registry/examples/step1-registry-fixture.v1.json','utf8')); console.log('CONTENT_REGISTRY_FIXTURE_JSON_PARSE=PASS')"
