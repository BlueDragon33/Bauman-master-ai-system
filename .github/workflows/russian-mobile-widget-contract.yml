name: Russian mobile widget contract (P1)

on:
  pull_request:
    paths:
      - 'subjects/russian/engine/mobile/**'
      - 'subjects/russian/engine/tests/test-re59-widget-deck.mjs'
      - '.github/workflows/russian-mobile-widget-contract.yml'
  push:
    branches: [main]
    paths:
      - 'subjects/russian/engine/mobile/**'
      - 'subjects/russian/engine/tests/test-re59-widget-deck.mjs'
      - '.github/workflows/russian-mobile-widget-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  widget-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute fail-closed widget exporter contract tests
        run: node --test subjects/russian/engine/tests/test-re59-widget-deck.mjs
