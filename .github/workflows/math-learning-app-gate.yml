name: Math Learning App Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "subjects/math/**"
      - "tests/math-*.mjs"
      - ".github/workflows/math-learning-app-gate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JSON
        run: node subjects/math/tools/validate-data.js
      - name: Validate manifest links
        run: node subjects/math/tools/validate-links.js
      - name: Validate learning relationships
        run: node subjects/math/tools/validate-learning-relationships.js
      - name: Validate MATH02 canonical contract
        run: node tests/math-p2-canonical-contract.mjs
      - name: Validate MATH03 reasoning and evidence contract
        run: node tests/math-p3-reasoning-contract.mjs
      - name: Validate MATH04 capability contract
        run: node tests/math-p4-capability-contract.mjs
      - name: Validate MATH05 product integration contract
        run: node tests/math-p5-product-contract.mjs
      - name: Validate MATH06 RC contract
        run: node tests/math-p6-rc-contract.mjs
      - name: Syntax check Math runtime
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find subjects/math/assets subjects/math/tools -type f -name '*.js' -print0)
          node --check subjects/math/sw.js

  browser-journey:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static test server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/math-e2e-server.log 2>&1 &
          echo $! >/tmp/math-e2e-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/math-e2e-server.log
          exit 1
      - name: Run learner journey acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/math-learning-journey
        run: node tests/math-learning-journey-browser.mjs
      - name: Run MATH01 forensic baseline probe
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/math-p1-forensic
        run: node tests/math-p1-forensic-browser.mjs
      - name: Run MATH03 reasoning browser acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/math-p3-reasoning
        run: node tests/math-p3-reasoning-browser.mjs
      - name: Run MATH04 capability browser acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/math-p4-capability
        run: node tests/math-p4-capability-browser.mjs
      - name: Run MATH05 product browser acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/math-p5-product
        run: node tests/math-p5-product-browser.mjs
      - name: Run MATH06 RC browser acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/math-p6-rc
        run: node tests/math-p6-rc-browser.mjs
      - name: Upload Math browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-browser-evidence
          path: |
            artifacts/math-learning-journey
            artifacts/math-p1-forensic
            artifacts/math-p3-reasoning
            artifacts/math-p4-capability
            artifacts/math-p5-product
            artifacts/math-p6-rc
          if-no-files-found: warn
