name: Pass 20 presenter routing ownership rerun
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pass20-fix-present-routing.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch E129 early ownership and E202 C01 guard
        run: |
          python - <<'PY'
          from pathlib import Path

          p129=Path('subjects/math/assets/theory_skin/theory-tab-E129.js')
          text=p129.read_text(encoding='utf-8')
          anchor="  document.addEventListener('change',function(e){"
          early="""  window.addEventListener('click',function(e){
    var t=e.target&&e.target.closest&&e.target.closest('[data-e129-present]');
    if(!t)return;
    var st=state();
    var shell=t.closest&&t.closest('.e129-theory-shell');
    var visible=(shell&&shell.querySelector('[data-current-lesson]'))||document.querySelector('[data-current-lesson]');
    var visibleId=S(visible&&visible.getAttribute('data-current-lesson')||st.e129LessonId||e169Path().lessonId||'');
    if(visibleId){st.e129LessonId=visibleId;e169Path().lessonId=visibleId;}
    st.e129Present=!st.e129Present;
    renderTheory();
    e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation)e.stopImmediatePropagation();
  },true);

"""
          assert 'window.addEventListener(\'click\',function(e){\n    var t=e.target&&e.target.closest&&e.target.closest(\'[data-e129-present]\');' not in text
          assert text.count(anchor)==1,text.count(anchor)
          text=text.replace(anchor,early+anchor,1)
          p129.write_text(text,encoding='utf-8')

          p202=Path('subjects/math/assets/theory_skin/theory-slideshow-E202.js')
          text=p202.read_text(encoding='utf-8')
          old="function deckForActive(){var raw=activeText(),n=norm(raw),ks=Object.keys(store);"
          new="function deckForActive(){var raw=activeText(),n=norm(raw);if(/MATH-VN-C01/i.test(raw)||/(^|\\s)(c01|chuong 1|chương 1)(\\s|$)/.test(n))return [];var ks=Object.keys(store);"
          assert text.count(old)==1,text.count(old)
          text=text.replace(old,new,1)
          p202.write_text(text,encoding='utf-8')
          PY
      - name: Rebase and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subjects/math/assets/theory_skin/theory-tab-E129.js subjects/math/assets/theory_skin/theory-slideshow-E202.js
          git commit -m "fix(math): lock C01 lesson and slideshow routing"
          git pull --rebase origin main
          git push origin HEAD:main
