name: Pass 20 presenter event ownership
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pass20-fix-present-selection.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stop competing presenter click handlers
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('subjects/math/assets/theory_skin/theory-tab-E129.js')
          text=path.read_text(encoding='utf-8')
          old="if(t.hasAttribute('data-e129-present')){ var visible=document.querySelector('[data-current-lesson]'); var visibleId=S(visible&&visible.getAttribute('data-current-lesson')||st.e129LessonId||e169Path().lessonId||''); if(visibleId){st.e129LessonId=visibleId;e169Path().lessonId=visibleId;} st.e129Present=!st.e129Present; renderTheory(); e.preventDefault(); return; }"
          new="if(t.hasAttribute('data-e129-present')){ var visible=document.querySelector('[data-current-lesson]'); var visibleId=S(visible&&visible.getAttribute('data-current-lesson')||st.e129LessonId||e169Path().lessonId||''); if(visibleId){st.e129LessonId=visibleId;e169Path().lessonId=visibleId;} st.e129Present=!st.e129Present; renderTheory(); e.preventDefault(); e.stopPropagation(); if(e.stopImmediatePropagation)e.stopImmediatePropagation(); return; }"
          assert text.count(old)==1,text.count(old)
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subjects/math/assets/theory_skin/theory-tab-E129.js
          git commit -m "fix(math): make E129 own slideshow toggle"
          git push origin HEAD:main
