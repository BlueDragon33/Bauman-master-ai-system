name: Russian Listen Speak Literacy Visual Gate

on:
  push:
    branches:
      - work/russian-listen-speak-literacy-visual-semantics
  pull_request:
    paths:
      - 'subjects/russian/**'
      - 'scripts/audit-russian-learning-architecture.mjs'
      - 'scripts/validate-russian-learning-sequence-contract.mjs'
      - 'tests/russian-learning-sequence-contract.test.mjs'
      - 'subjects/russian/contracts/oral-first-route-contract.v1.json'
      - 'scripts/validate-russian-oral-first-route.mjs'
      - 'tests/russian-oral-first-route.test.mjs'
      - 'subjects/russian/contracts/oral-first-warmup-contract.v1.json'
      - 'scripts/validate-russian-oral-first-warmup.mjs'
      - 'tests/russian-oral-first-warmup.test.mjs'
      - 'subjects/russian/contracts/cyrillic-print-recognition-contract.v1.json'
      - 'subjects/russian/assets/cyrillic-literacy.js'
      - 'subjects/russian/assets/cyrillic-literacy.css'
      - 'scripts/validate-russian-cyrillic-print-recognition.mjs'
      - 'tests/russian-cyrillic-print-recognition.test.mjs'
      - 'subjects/russian/contracts/cyrillic-cursive-recognition-contract.v1.json'
      - 'scripts/validate-russian-cyrillic-cursive-recognition.mjs'
      - 'tests/russian-cyrillic-cursive-recognition.test.mjs'
      - 'subjects/russian/data/cyrillic-sound-map.json'
      - 'subjects/russian/contracts/cyrillic-sound-letter-contract.v1.json'
      - 'scripts/validate-russian-cyrillic-sound-letter.mjs'
      - 'tests/russian-cyrillic-sound-letter.test.mjs'
      - 'subjects/russian/contracts/handwriting-motor-practice-contract.v1.json'
      - 'subjects/russian/assets/handwriting-motor-coach.js'
      - 'subjects/russian/assets/handwriting-motor-coach.css'
      - 'scripts/validate-russian-handwriting-motor.mjs'
      - 'tests/russian-handwriting-motor.test.mjs'
      - '.github/workflows/russian-learning-architecture-gate.yml'

permissions:
  contents: read

jobs:
  russian-learning-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Check new architecture scripts
        run: |
          node --check scripts/audit-russian-learning-architecture.mjs
          node --check scripts/validate-russian-learning-sequence-contract.mjs
          node --check tests/russian-learning-sequence-contract.test.mjs
          node --check scripts/validate-russian-oral-first-route.mjs
          node --check tests/russian-oral-first-route.test.mjs
          node --check scripts/validate-russian-oral-first-warmup.mjs
          node --check tests/russian-oral-first-warmup.test.mjs
          node --check subjects/russian/assets/cyrillic-literacy.js
          node --check scripts/validate-russian-cyrillic-print-recognition.mjs
          node --check tests/russian-cyrillic-print-recognition.test.mjs
          node --check scripts/validate-russian-cyrillic-cursive-recognition.mjs
          node --check tests/russian-cyrillic-cursive-recognition.test.mjs
          node --check scripts/validate-russian-cyrillic-sound-letter.mjs
          node --check tests/russian-cyrillic-sound-letter.test.mjs
          node --check subjects/russian/assets/handwriting-motor-coach.js
          node --check scripts/validate-russian-handwriting-motor.mjs
          node --check tests/russian-handwriting-motor.test.mjs
      - name: Validate listen-speak literacy visual contract
        run: node scripts/validate-russian-learning-sequence-contract.mjs
      - name: Run contract negative tests
        run: node tests/russian-learning-sequence-contract.test.mjs
      - name: Run Russian learning baseline audit
        run: node scripts/audit-russian-learning-architecture.mjs
      - name: Validate Russian oral-first route
        run: node scripts/validate-russian-oral-first-route.mjs
      - name: Run Russian oral-first route negative tests
        run: node tests/russian-oral-first-route.test.mjs
      - name: Validate Russian hear-before-see warmup
        run: node scripts/validate-russian-oral-first-warmup.mjs
      - name: Run Russian hear-before-see negative tests
        run: node tests/russian-oral-first-warmup.test.mjs
      - name: Validate Cyrillic print recognition
        run: node scripts/validate-russian-cyrillic-print-recognition.mjs
      - name: Run Cyrillic print recognition negative tests
        run: node tests/russian-cyrillic-print-recognition.test.mjs
      - name: Validate Cyrillic cursive recognition
        run: node scripts/validate-russian-cyrillic-cursive-recognition.mjs
      - name: Run Cyrillic cursive recognition negative tests
        run: node tests/russian-cyrillic-cursive-recognition.test.mjs
      - name: Validate Cyrillic sound-letter mapping
        run: node scripts/validate-russian-cyrillic-sound-letter.mjs
      - name: Run Cyrillic sound-letter negative tests
        run: node tests/russian-cyrillic-sound-letter.test.mjs
      - name: Validate handwriting motor practice
        run: node scripts/validate-russian-handwriting-motor.mjs
      - name: Run handwriting motor negative tests
        run: node tests/russian-handwriting-motor.test.mjs
      - name: Parse pedagogy contracts
        run: node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('subjects/russian/contracts/listen-speak-literacy-visual-contract.v1.json','utf8')); const b=JSON.parse(fs.readFileSync('subjects/russian/contracts/oral-first-route-contract.v1.json','utf8')); if(a.schema!=='RUSSIAN_LISTEN_SPEAK_LITERACY_VISUAL_CONTRACT_V1'||b.schema!=='RUSSIAN_ORAL_FIRST_ROUTE_CONTRACT_V1') process.exit(1); console.log('RUSSIAN_PEDAGOGY_JSON=PASS')"

  russian-existing-regression:
    needs: russian-learning-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Parse Russian runtime JavaScript
        run: |
          node --check subjects/russian/assets/core.js
          node --check subjects/russian/assets/subject-adapter.js
          node --check subjects/russian/assets/russian-reference-ui.js
          node --check subjects/russian/assets/learning-state.js
          node --check subjects/russian/assets/learning-flow.js
          node --check subjects/russian/assets/vocab-srs.js
          node --check subjects/russian/assets/speaking-coach.js
          node --check subjects/russian/assets/academic-language.js
          node --check subjects/russian/assets/ai-mentor-guard.js
          node --check subjects/russian/assets/runtime-optimizer.js
          node --check subjects/russian/sw.js
      - name: Validate existing Russian learning contracts
        run: |
          node subjects/russian/scripts/validate-reference-ui.mjs
          node subjects/russian/scripts/validate-learning-flow.mjs
          node subjects/russian/scripts/validate-vocab-srs.mjs
          node subjects/russian/scripts/validate-speaking-coach.mjs
          node subjects/russian/scripts/validate-academic-language.mjs
          node subjects/russian/scripts/validate-ai-runtime.mjs
          node subjects/russian/scripts/validate-promotion-candidate.mjs
      - name: Audit existing Russian learning data
        run: |
          node subjects/russian/scripts/audit-learning-data.mjs
          node subjects/russian/scripts/audit-content-contract.mjs
          node subjects/russian/scripts/audit-learning-flow.mjs
          node subjects/russian/scripts/audit-vocab-srs.mjs
          node subjects/russian/scripts/audit-speaking-coach.mjs
          node subjects/russian/scripts/audit-academic-language.mjs
          node subjects/russian/scripts/audit-runtime-offline.mjs
          node subjects/russian/scripts/audit-promotion-candidate.mjs
