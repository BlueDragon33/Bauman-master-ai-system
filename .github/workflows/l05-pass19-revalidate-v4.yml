            {key:'l05',id:'MATH-VN-C01-vector_trong_khong_gian_-L05-subspace-data-representation-e140',title:'§1.5 · Không gian con và biểu diễn dữ liệu',short:'Không gian con và biểu diễn dữ liệu',number:'1.5',artifact:'data/theory_slideshow/theory_slideshow_c01_l05.json',referenceToken:'ROTATING_MACHINE_4CH_2MODE',fullMin:12,modalSlide:2}
