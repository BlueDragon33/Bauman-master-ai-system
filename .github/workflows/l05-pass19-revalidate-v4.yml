name: Lesson 1.5 Pass 19 revalidation v4
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/l05-pass19-revalidate-v4.yml
permissions:
  contents: write
jobs:
  chromium-revalidate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false
      - name: Prepare Chromium harness
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          mkdir -p /tmp/bauman-pw /tmp/bauman-qa
          cd /tmp/bauman-pw
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-package-lock playwright-core >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          : > favicon.ico
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/bauman-qa/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/subjects/math/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/bauman-qa/server.log
          exit 1
      - name: Run all-slide Chromium validation
        env:
          NODE_PATH: /tmp/bauman-pw/node_modules
        run: |
          cat >/tmp/bauman-qa/run.js <<'JS'
