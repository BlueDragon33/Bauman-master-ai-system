          async function runLesson(page,lesson,previousTitle){await setLesson(page,lesson.id);const reader=await page.evaluate(id=>{const root=document.querySelector(`[data-current-lesson="${id}"]`);return {slides:root?.querySelectorAll('.e129-slide').length||0,title:root?.querySelector('h2')?.textContent.trim()||'',present:!!document.querySelector('[data-e129-present]')};},lesson.id);must(reader.slides===22&&reader.title.includes(lesson.short)&&reader.title.includes(lesson.number)&&reader.present,`${lesson.key} Reader`,reader);await openDeck(page,lesson);const identity=await page.evaluate(({id,previousTitle,title})=>{const d=document.querySelector('.e132-overlay-deck.open'),c=d.querySelector('[data-e210-lesson-id]');return {routeId:d.getAttribute('data-e243-lesson-id'),routeTitle:d.getAttribute('data-e243-lesson-title'),activeId:d.getAttribute('data-e210-active-lesson-id'),chipId:c?.getAttribute('data-e210-lesson-id')||'',chipText:c?.textContent.trim()||'',actionsId:d.querySelector('.e241-actions')?.getAttribute('data-e241-lesson-id')||'',previousVisible:previousTitle?d.textContent.includes(previousTitle):false,e210:window.BAUMAN_MATH_E210_LESSON_IDENTITY.selfCheck(),e241:window.BAUMAN_MATH_E241_ARTIFACT_READER.selfCheck(),e242:window.BAUMAN_MATH_E242_SLIDESHOW_RICHNESS.selfCheck(),e243:window.BAUMAN_MATH_E243_PRESENTER_ROUTE_LOCK.selfCheck()};},{id:lesson.id,previousTitle,title:lesson.title});must([identity.routeId,identity.activeId,identity.chipId,identity.actionsId,identity.e210.lessonId,identity.e241.activeLessonId,identity.e242.activeLessonId,identity.e243.deckLessonId].every(v=>v===lesson.id),`${lesson.key} canonical IDs`,identity);must(identity.routeTitle===lesson.title&&identity.chipText.includes(lesson.title)&&!identity.previousVisible,`${lesson.key} canonical title`,identity);const artifact=await page.evaluate(async p=>(await fetch(p,{cache:'no-store'})).json(),lesson.artifact);must(artifact.lessonId===lesson.id&&artifact.slides.length===22,`${lesson.key}