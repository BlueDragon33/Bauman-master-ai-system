name: Whole System Integration Gate

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "subjects/**"
      - "foundation/**"
      - "scripts/validate-system-integration.mjs"
      - "tests/system-browser-acceptance.mjs"
      - "tests/foundation-identity-persistence-browser.mjs"
      - "tests/foundation-identity-projection-browser.mjs"
      - "tests/foundation-canonical-context-browser.mjs"
      - "tests/math-study-command-center-browser.mjs"
      - "tests/hub-premium-responsive-browser.mjs"
      - "tests/russian-handwriting-recognition-browser.mjs"
      - "tests/russian-handwriting-offline-authority-browser.mjs"
      - "tests/russian-capability-hub-static.mjs"
      - "tests/russian-capability-hub-browser.mjs"
      - "tests/russian-capability-deeplink-browser.mjs"
      - "tests/russian-capability-route-receipt-browser.mjs"
      - "tests/russian-capability-continue-static.mjs"
      - "tests/russian-capability-continue-browser.mjs"
      - "tests/russian-offline-shell-browser.mjs"
      - "tests/russian-handwriting-listen-write-browser.mjs"
      - "tests/russian-future-ui-browser.mjs"
      - "tests/subject-progress-contract-static.mjs"
      - "tests/subject-progress-contract-browser.mjs"
      - "tests/deep-study-journal-browser.mjs"
      - "scripts/validate-deep-study-journal-v1.js"
      - "scripts/prepare-cloudflare-preview.mjs"
      - "scripts/prepare-chatgpt-site.mjs"
      - ".openai/hosting.json"
      - ".github/workflows/system-integration-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "subjects/**"
      - "foundation/**"
      - "scripts/validate-system-integration.mjs"
      - "tests/system-browser-acceptance.mjs"
      - "tests/foundation-identity-persistence-browser.mjs"
      - "tests/foundation-identity-projection-browser.mjs"
      - "tests/foundation-canonical-context-browser.mjs"
      - "tests/math-study-command-center-browser.mjs"
      - "tests/hub-premium-responsive-browser.mjs"
      - "tests/russian-handwriting-recognition-browser.mjs"
      - "tests/russian-handwriting-offline-authority-browser.mjs"
      - "tests/russian-capability-hub-static.mjs"
      - "tests/russian-capability-hub-browser.mjs"
      - "tests/russian-capability-deeplink-browser.mjs"
      - "tests/russian-capability-route-receipt-browser.mjs"
      - "tests/russian-capability-continue-static.mjs"
      - "tests/russian-capability-continue-browser.mjs"
      - "tests/russian-offline-shell-browser.mjs"
      - "tests/subject-progress-contract-static.mjs"
      - "tests/subject-progress-contract-browser.mjs"
      - "tests/deep-study-journal-browser.mjs"
      - "scripts/validate-deep-study-journal-v1.js"
      - "scripts/prepare-cloudflare-preview.mjs"
      - "scripts/prepare-chatgpt-site.mjs"
      - ".openai/hosting.json"
      - ".github/workflows/system-integration-ci.yml"

permissions:
  contents: read

jobs:
  validate-system-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Validate Hub, subject packages, bridge and locked Math runtime
        run: node scripts/validate-system-integration.mjs
      - name: Validate Russian capability Hub consumer
        run: node tests/russian-capability-hub-static.mjs
      - name: Validate Russian future reference UI
        run: node subjects/russian/scripts/validate-reference-ui.mjs
      - name: Validate Russian capability deep link
        run: node subjects/russian/scripts/validate-capability-deeplink.mjs
      - name: Validate Russian capability route receipt
        run: node subjects/russian/scripts/validate-capability-route-receipt.mjs
      - name: Validate Russian capability-aware continue
        run: node tests/russian-capability-continue-static.mjs
      - name: Validate subject progress report contract
        run: node tests/subject-progress-contract-static.mjs
      - name: Validate Deep Study Journal boundaries
        run: node scripts/validate-deep-study-journal-v1.js
      - name: Parse changed runtime JavaScript
        run: |
          node --check assets/js/main.js
          node --check assets/js/deep-study-journal-v1.js
          node --check scripts/validate-deep-study-journal-v1.js
          node --check assets/js/hub-safe-shell.js
          node --check assets/js/hub-overview-search-v2.js
          node --check assets/js/planning-main.js
          node --check assets/js/hub-premium-v2.js
          node --check subjects/shared/host-bridge.js
          node --check subjects/shared/foundation-identity-bootstrap.js
          node --check subjects/shared/foundation-identity-persistence.js
          node --check subjects/shared/foundation-identity-projection.js
          node --check subjects/shared/foundation-canonical-context.js
          node --check foundation/domain-model/canonical-identity-runtime.js
          node --check foundation/domain-model/identity-overlay-store.js
          node --check foundation/domain-model/legacy-snapshot-extractor.js
          node --check foundation/domain-model/canonical-read-projection.js
          node --check subjects/ai/assets/ai.js
          node --check subjects/foundation/assets/foundation.js
          node --check subjects/research/assets/research.js
          node --check subjects/signal/assets/signal.js
          node --check subjects/systems/assets/systems.js
          node --check subjects/russian/assets/core.js
          node --check subjects/russian/assets/russian-future-ui.js
          node --check tests/russian-future-ui-browser.mjs
          node --check subjects/russian/assets/listen-write-factory.js
          node --check subjects/russian/assets/ai-mentor-guard.js
          node --check subjects/programming/assets/core.js
          node --check subjects/math/assets/math-study-command-center.js
          node --check tests/foundation-identity-persistence-browser.mjs
          node --check tests/foundation-identity-projection-browser.mjs
          node --check tests/foundation-canonical-context-browser.mjs
          node --check tests/math-study-command-center-browser.mjs
          node --check tests/hub-premium-responsive-browser.mjs
          node --check tests/russian-handwriting-recognition-browser.mjs
          node --check tests/russian-handwriting-offline-authority-browser.mjs
          node --check tests/russian-capability-hub-static.mjs
          node --check tests/russian-capability-hub-browser.mjs
          node --check tests/russian-capability-deeplink-browser.mjs
          node --check tests/russian-capability-route-receipt-browser.mjs
          node --check tests/russian-capability-continue-static.mjs
          node --check tests/russian-capability-continue-browser.mjs
          node --check tests/russian-offline-shell-browser.mjs
          node --check tests/russian-handwriting-listen-write-browser.mjs
          node --check tests/subject-progress-contract-static.mjs
          node --check tests/subject-progress-contract-browser.mjs
          node --check tests/deep-study-journal-browser.mjs

  browser-system-acceptance:
    needs: validate-system-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install Playwright Chromium
        run: |
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local runtime
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/bauman-system-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bauman-system-http.log
          exit 1
      - name: Run whole-system browser acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/system-browser
        run: node tests/system-browser-acceptance.mjs
      - name: Run Foundation identity persistence browser acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/foundation-identity-persistence
        run: node tests/foundation-identity-persistence-browser.mjs
      - name: Run Foundation canonical projection browser acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/foundation-identity-projection
        run: node tests/foundation-identity-projection-browser.mjs
      - name: Run Foundation canonical context browser acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/foundation-canonical-context
        run: node tests/foundation-canonical-context-browser.mjs
      - name: Run Math Study Command Center browser acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/math-study-command-center
        run: node tests/math-study-command-center-browser.mjs
      - name: Run Hub V2 responsive acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/hub-premium-responsive
        run: node tests/hub-premium-responsive-browser.mjs
      - name: Run Russian Handwriting Recognition Acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-handwriting-recognition
        run: node tests/russian-handwriting-recognition-browser.mjs
      - name: Run Ready Russian Handwriting Authority Offline Acceptance
        env:
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-handwriting-offline-authority
        run: node tests/russian-handwriting-offline-authority-browser.mjs
      - name: Run Russian capability Hub acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-capability-hub
        run: node tests/russian-capability-hub-browser.mjs
      - name: Run Russian capability deep-link acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-capability-deeplink
        run: node tests/russian-capability-deeplink-browser.mjs
      - name: Run Russian capability route receipt acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-capability-route-receipt
        run: node tests/russian-capability-route-receipt-browser.mjs
      - name: Run Russian capability-aware continue acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-capability-continue
        run: node tests/russian-capability-continue-browser.mjs
      - name: Run subject progress contract acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/subject-progress-contract
        run: node tests/subject-progress-contract-browser.mjs
      - name: Run Deep Study Journal browser acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/deep-study-journal
        run: node tests/deep-study-journal-browser.mjs
      - name: Run Russian true-offline shell acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-offline-shell
        run: node tests/russian-offline-shell-browser.mjs
      - name: Run Russian handwriting listen-write acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-handwriting-listen-write
        run: node tests/russian-handwriting-listen-write-browser.mjs
      - name: Run Russian future UI acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-future-ui
        run: node tests/russian-future-ui-browser.mjs
      - name: Materialize owner-private ChatGPT Site package
        env:
          BAUMAN_CONTROL_PREVIEW_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
          BAUMAN_CONTROL_PRODUCTION_D1_DATABASE_ID: 22222222-2222-4222-8222-222222222222
          APPLICATION_MANAGEMENT_PREVIEW_ORIGIN: https://application-management-preview.example.com
          BAUMAN_CONTROL_PREVIEW_ORIGIN: https://bauman-control-preview.example.com
          BAUMAN_RUNTIME_PREVIEW_ORIGIN: https://bauman-runtime-preview.example.com
        run: |
          node scripts/prepare-cloudflare-preview.mjs
          node scripts/prepare-chatgpt-site.mjs
      - name: Start packaged ChatGPT Site runtime
        run: |
          node scripts/serve-local-runtime.mjs --root dist --port 4174 > /tmp/bauman-sites-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bauman-sites-http.log
          exit 1
      - name: Run packaged ChatGPT Site browser acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4174/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/chatgpt-site-browser
          BAUMAN_E2E_EXPECT_PLATFORM_ACCESS: "1"
        run: node tests/system-browser-acceptance.mjs
      - name: Run packaged Foundation identity persistence acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4174/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/chatgpt-site-foundation-identity-persistence
        run: node tests/foundation-identity-persistence-browser.mjs
      - name: Run packaged Foundation canonical projection acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4174/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/chatgpt-site-foundation-identity-projection
        run: node tests/foundation-identity-projection-browser.mjs
      - name: Run packaged Foundation canonical context acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4174/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/chatgpt-site-foundation-canonical-context
        run: node tests/foundation-canonical-context-browser.mjs
      - name: Run Packaged Russian Handwriting Recognition Acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4174/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/chatgpt-site-russian-handwriting-recognition
        run: node tests/russian-handwriting-recognition-browser.mjs
      - name: Run Packaged Ready Russian Handwriting Authority Offline Acceptance
        env:
          BAUMAN_OFFLINE_FIXTURE_ROOT: dist
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/chatgpt-site-russian-handwriting-offline-authority
        run: node tests/russian-handwriting-offline-authority-browser.mjs
      - name: Run packaged Hub V2 responsive acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4174/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/chatgpt-site-hub-responsive
        run: node tests/hub-premium-responsive-browser.mjs
      - name: Run packaged Russian capability Hub acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4174/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/chatgpt-site-russian-capability-hub
        run: node tests/russian-capability-hub-browser.mjs
      - name: Run packaged Russian capability deep-link acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4174/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/chatgpt-site-russian-capability-deeplink
        run: node tests/russian-capability-deeplink-browser.mjs
      - name: Run packaged Russian capability route receipt acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4174/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/chatgpt-site-russian-capability-route-receipt
        run: node tests/russian-capability-route-receipt-browser.mjs
      - name: Run packaged Russian capability-aware continue acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4174/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/chatgpt-site-russian-capability-continue
        run: node tests/russian-capability-continue-browser.mjs
      - name: Run packaged subject progress contract acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4174/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/chatgpt-site-subject-progress-contract
        run: node tests/subject-progress-contract-browser.mjs
      - name: Run packaged Deep Study Journal browser acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4174/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/chatgpt-site-deep-study-journal
        run: node tests/deep-study-journal-browser.mjs
      - name: Run packaged Russian true-offline shell acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4174/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/chatgpt-site-russian-offline-shell
        run: node tests/russian-offline-shell-browser.mjs
      - name: Run packaged Russian handwriting listen-write acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4174/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/chatgpt-site-russian-handwriting-listen-write
        run: node tests/russian-handwriting-listen-write-browser.mjs
      - name: Run packaged Russian future UI acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4174/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/chatgpt-site-russian-future-ui
        run: node tests/russian-future-ui-browser.mjs
      - name: Show server log on failure
        if: failure()
        run: |
          cat /tmp/bauman-system-http.log || true
          cat /tmp/bauman-sites-http.log || true
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whole-system-browser-${{ github.run_id }}
          path: |
            artifacts/system-browser
            artifacts/foundation-identity-persistence
            artifacts/foundation-identity-projection
            artifacts/foundation-canonical-context
            artifacts/math-study-command-center
            artifacts/hub-premium-responsive
            artifacts/russian-handwriting-recognition
            artifacts/russian-handwriting-offline-authority
            artifacts/russian-capability-hub
            artifacts/russian-capability-deeplink
            artifacts/russian-capability-route-receipt
            artifacts/russian-capability-continue
            artifacts/russian-offline-shell
            artifacts/russian-handwriting-listen-write
            artifacts/russian-future-ui
            artifacts/subject-progress-contract
            artifacts/deep-study-journal
            artifacts/chatgpt-site-browser
            artifacts/chatgpt-site-foundation-identity-persistence
            artifacts/chatgpt-site-foundation-identity-projection
            artifacts/chatgpt-site-foundation-canonical-context
            artifacts/chatgpt-site-russian-handwriting-recognition
            artifacts/chatgpt-site-russian-handwriting-offline-authority
            artifacts/chatgpt-site-hub-responsive
            artifacts/chatgpt-site-russian-capability-hub
            artifacts/chatgpt-site-russian-capability-deeplink
            artifacts/chatgpt-site-russian-capability-route-receipt
            artifacts/chatgpt-site-russian-capability-continue
            artifacts/chatgpt-site-russian-offline-shell
            artifacts/chatgpt-site-russian-handwriting-listen-write
            artifacts/chatgpt-site-russian-future-ui
            artifacts/chatgpt-site-subject-progress-contract
            artifacts/chatgpt-site-deep-study-journal
          if-no-files-found: warn
          retention-days: 7
