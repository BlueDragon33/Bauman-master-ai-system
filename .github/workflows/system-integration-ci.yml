name: Whole System Integration Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "subjects/math/**"
      - "subjects/russian/**"
      - "subjects/shared/**"
      - "foundation/domain-model/**"
      - "assets/js/**"
      - "assets/css/**"
      - "index.html"
      - "platform/ui/**"
      - "control/application-management.contract.json"
      - "tests/math-*.mjs"
      - "scripts/prepare-chatgpt-site.mjs"
      - "scripts/prepare-cloudflare-preview.mjs"
      - ".github/workflows/system-integration-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "subjects/math/**"
      - "subjects/russian/**"
      - "subjects/shared/**"
      - "foundation/domain-model/**"
      - "assets/js/**"
      - "assets/css/**"
      - "index.html"
      - "platform/ui/**"
      - "control/application-management.contract.json"
      - "tests/math-*.mjs"
      - "scripts/prepare-chatgpt-site.mjs"
      - "scripts/prepare-cloudflare-preview.mjs"
      - ".github/workflows/system-integration-ci.yml"

permissions:
  contents: read

jobs:
  validate-system-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Validate Hub, subject packages, bridge and locked Math runtime
        run: node scripts/validate-system-integration.mjs
      - name: Validate Russian capability Hub consumer
        run: node tests/russian-capability-hub-static.mjs
      - name: Validate Russian future reference UI
        run: node subjects/russian/scripts/validate-reference-ui.mjs
      - name: Validate Russian capability deep link
        run: node subjects/russian/scripts/validate-capability-deeplink.mjs
      - name: Validate Russian capability route receipt
        run: node subjects/russian/scripts/validate-capability-route-receipt.mjs
      - name: Validate Russian capability-aware continue
        run: node tests/russian-capability-continue-static.mjs
      - name: Validate subject progress report contract
        run: node tests/subject-progress-contract-static.mjs
      - name: Validate Deep Study Journal boundaries
        run: node scripts/validate-deep-study-journal-v1.js
      - name: Validate stable V6 primary-page shell
        run: node tests/hub-primary-pages-v6-static.mjs
      - name: Validate Hub data-truth contract
        run: node tests/hub-data-truth-static.mjs
      - name: Validate scoped Schedule reference UI
        run: node tests/schedule-reference-v1-static.mjs
      - name: Validate scoped Subjects reference UI
        run: node tests/subjects-reference-v1-static.mjs
      - name: Validate scoped Thesis reference UI
        run: node tests/thesis-reference-v1-static.mjs
      - name: Validate deployment propagation fail-closed helper
        run: node scripts/test-deployment-propagation-wait.mjs
      - name: Parse changed runtime JavaScript
        run: |
          node --check assets/js/main.js
          node --check assets/js/deep-study-journal-v1.js
          node --check scripts/validate-deep-study-journal-v1.js
          node --check assets/js/hub-safe-shell.js
          node --check assets/js/hub-overview-search-v2.js
          node --check assets/js/hub-primary-pages-v6.js
          node --check assets/js/hub-data-truth.js
          node --check assets/js/schedule-reference-v1.js
          node --check assets/js/subjects-reference-v1.js
          node --check assets/js/thesis-reference-v1.js
          node --check tests/hub-primary-pages-v6-static.mjs
          node --check tests/hub-data-truth-static.mjs
          node --check tests/hub-data-truth-browser.mjs
          node --check tests/schedule-reference-v1-static.mjs
          node --check tests/schedule-reference-v1-browser.mjs
          node --check tests/subjects-reference-v1-static.mjs
          node --check tests/subjects-reference-v1-browser.mjs
          node --check tests/thesis-reference-v1-static.mjs
          node --check tests/thesis-reference-v1-browser.mjs
          node --check assets/js/planning-main.js
          node --check assets/js/hub-premium-v2.js
          node --check subjects/shared/host-bridge.js
          node --check subjects/shared/foundation-identity-bootstrap.js
          node --check subjects/shared/foundation-identity-persistence.js
          node --check subjects/shared/foundation-identity-projection.js
          node --check subjects/shared/foundation-canonical-context.js
          node --check foundation/domain-model/canonical-identity-runtime.js
          node --check foundation/domain-model/identity-overlay-store.js
          node --check foundation/domain-model/legacy-snapshot-extractor.js
          node --check foundation/domain-model/canonical-read-projection.js
          node --check subjects/ai/assets/ai.js
          node --check subjects/foundation/assets/foundation.js
          node --check subjects/research/assets/research.js
          node --check subjects/signal/assets/signal.js
          node --check subjects/systems/assets/systems.js
          node --check subjects/russian/assets/core.js
          node --check subjects/russian/assets/assessment-mastery.js
          node --check tests/russian-p4-assessment-mastery-browser.mjs
          node --check subjects/russian/assets/russian-future-ui.js
          node --check tests/russian-future-ui-browser.mjs
          node --check subjects/russian/assets/listen-write-factory.js
          node --check subjects/russian/assets/ai-mentor-guard.js
          node --check subjects/programming/assets/core.js
          node --check subjects/math/assets/math-study-command-center.js
          node --check tests/foundation-identity-persistence-browser.mjs
          node --check tests/foundation-identity-projection-browser.mjs
          node --check tests/foundation-canonical-context-browser.mjs
          node --check tests/math-study-command-center-browser.mjs
          node --check tests/math-learning-journey-browser.mjs
          node --check tests/hub-premium-responsive-browser.mjs
          node --check tests/russian-handwriting-recognition-browser.mjs
          node --check tests/russian-handwriting-offline-authority-browser.mjs
          node --check tests/russian-capability-hub-static.mjs
          node --check tests/russian-capability-hub-browser.mjs
          node --check tests/russian-capability-deeplink-browser.mjs
          node --check tests/russian-capability-route-receipt-browser.mjs
          node --check tests/russian-capability-continue-static.mjs
          node --check tests/russian-capability-continue-browser.mjs
          node --check tests/russian-offline-shell-browser.mjs
          node --check tests/russian-handwriting-listen-write-browser.mjs
          node --check tests/subject-progress-contract-static.mjs
          node --check tests/subject-progress-contract-browser.mjs
          node --check tests/deep-study-journal-browser.mjs

  russian-p1-browser-acceptance:
    needs: validate-system-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install Playwright Chromium for Russian P1
        run: |
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          node --check tests/russian-p1-forensic-browser.mjs
          node --check tests/russian-ru08-journeys-browser.mjs
          node --check tests/russian-ru08-author-browser.mjs
          node --check subjects/russian/engine/tests/browser-grounded-acceptance.mjs
      - name: Start Russian P1 source runtime
        run: |
          python3 -m http.server 4175 --bind 127.0.0.1 > /tmp/russian-p1-source-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/russian-p1-source-http.log
          exit 1
      - name: Run Russian P1 11-viewport forensic audit
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4175/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-p1-forensic-source
        run: node tests/russian-p1-forensic-browser.mjs
      - name: Run Russian P4 assessment mastery acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4175/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-p4-assessment-source
        run: node tests/russian-p4-assessment-mastery-browser.mjs
      - name: Run Russian Future UI route acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4175/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-p1-future-ui-source
        run: node tests/russian-future-ui-browser.mjs
      - name: Run Russian Engine grounded slice acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4175/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-engine-grounded-source
        run: node subjects/russian/engine/tests/browser-grounded-acceptance.mjs
      - name: Run Russian handwriting acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4175/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-p1-handwriting-source
        run: node tests/russian-handwriting-recognition-browser.mjs
      - name: Run Russian capability Hub acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4175/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-p1-capability-hub-source
        run: node tests/russian-capability-hub-browser.mjs
      - name: Run Russian capability deep-link acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4175/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-p1-deeplink-source
        run: node tests/russian-capability-deeplink-browser.mjs
      - name: Run Russian capability route-receipt acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4175/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-p1-route-receipt-source
        run: node tests/russian-capability-route-receipt-browser.mjs
      - name: Run Russian capability-aware continue acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4175/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-p1-continue-source
        run: node tests/russian-capability-continue-browser.mjs
      - name: Run Russian true-offline shell acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4175/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-p1-offline-source
        run: node tests/russian-offline-shell-browser.mjs
      - name: Run Russian handwriting listen-write acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4175/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-p1-listen-write-source
        run: node tests/russian-handwriting-listen-write-browser.mjs
      - name: Run Russian RU08 representative learner journeys
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4175/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-ru08-journeys-source
        run: node tests/russian-ru08-journeys-browser.mjs
      - name: Run Russian RU08 author journey
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4175/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-ru08-author-source
        run: node tests/russian-ru08-author-browser.mjs
      - name: Materialize Russian P1 packaged runtime
        env:
          BAUMAN_CONTROL_PREVIEW_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
          BAUMAN_CONTROL_PRODUCTION_D1_DATABASE_ID: 22222222-2222-4222-8222-222222222222
          APPLICATION_MANAGEMENT_PREVIEW_ORIGIN: https://application-management-preview.example.com
          BAUMAN_CONTROL_PREVIEW_ORIGIN: https://bauman-control-preview.example.com
          BAUMAN_RUNTIME_PREVIEW_ORIGIN: https://bauman-runtime-preview.example.com
        run: |
          node scripts/prepare-cloudflare-preview.mjs
          node scripts/prepare-chatgpt-site.mjs
      - name: Start Russian P1 packaged runtime
        run: |
          node scripts/serve-local-runtime.mjs --root dist --port 4176 > /tmp/russian-p1-package-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4176/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/russian-p1-package-http.log
          exit 1
      - name: Run packaged Russian P1 11-viewport forensic audit
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4176/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-p1-forensic-package
        run: node tests/russian-p1-forensic-browser.mjs
      - name: Run packaged Russian P4 assessment mastery acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4176/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-p4-assessment-package
        run: node tests/russian-p4-assessment-mastery-browser.mjs
      - name: Run packaged Russian Future UI acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4176/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-p1-future-ui-package
        run: node tests/russian-future-ui-browser.mjs
      - name: Run packaged Russian Engine grounded slice acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4176/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-engine-grounded-package
        run: node subjects/russian/engine/tests/browser-grounded-acceptance.mjs
      - name: Run packaged Russian handwriting acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4176/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-p1-handwriting-package
        run: node tests/russian-handwriting-recognition-browser.mjs
      - name: Run packaged Russian deep-link acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4176/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-p1-deeplink-package
          BAUMAN_E2E_EXPECT_PLATFORM_ACCESS: "1"
        run: node tests/russian-capability-deeplink-browser.mjs
      - name: Run packaged Russian route-receipt acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4176/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-p1-route-receipt-package
          BAUMAN_E2E_EXPECT_PLATFORM_ACCESS: "1"
        run: node tests/russian-capability-route-receipt-browser.mjs
      - name: Run packaged Russian true-offline shell acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4176/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-p1-offline-package
        run: node tests/russian-offline-shell-browser.mjs
      - name: Run packaged Russian RU08 representative learner journeys
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4176/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-ru08-journeys-package
        run: node tests/russian-ru08-journeys-browser.mjs
      - name: Run packaged Russian RU08 author journey
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4176/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/russian-ru08-author-package
        run: node tests/russian-ru08-author-browser.mjs
      - name: Upload Russian P1 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: russian-p1-browser-${{ github.run_id }}
          path: |
            artifacts/russian-p1-forensic-source
            artifacts/russian-p4-assessment-source
            artifacts/russian-p1-future-ui-source
            artifacts/russian-engine-grounded-source
            artifacts/russian-p1-handwriting-source
            artifacts/russian-p1-capability-hub-source
            artifacts/russian-p1-deeplink-source
            artifacts/russian-p1-route-receipt-source
            artifacts/russian-p1-continue-source
            artifacts/russian-p1-offline-source
            artifacts/russian-p1-listen-write-source
            artifacts/russian-ru08-journeys-source
            artifacts/russian-ru08-author-source
            artifacts/russian-p1-forensic-package
            artifacts/russian-p4-assessment-package
            artifacts/russian-p1-future-ui-package
            artifacts/russian-engine-grounded-package
            artifacts/russian-p1-handwriting-package
            artifacts/russian-p1-deeplink-package
            artifacts/russian-p1-route-receipt-package
            artifacts/russian-p1-offline-package
            artifacts/russian-ru08-journeys-package
            artifacts/russian-ru08-author-package
      - name: Show Russian P1 server logs on failure
        if: failure()
        run: |
          cat /tmp/russian-p1-source-http.log || true
          cat /tmp/russian-p1-package-http.log || true

