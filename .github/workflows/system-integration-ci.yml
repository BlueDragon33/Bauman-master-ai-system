name: Whole System Integration Gate

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "subjects/**"
      - "scripts/validate-system-integration.mjs"
      - "tests/system-browser-acceptance.mjs"
      - "tests/math-study-command-center-browser.mjs"
      - "tests/hub-premium-responsive-browser.mjs"
      - "scripts/prepare-chatgpt-site.mjs"
      - ".openai/hosting.json"
      - ".github/workflows/system-integration-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "subjects/**"
      - "scripts/validate-system-integration.mjs"
      - "tests/system-browser-acceptance.mjs"
      - "tests/math-study-command-center-browser.mjs"
      - "tests/hub-premium-responsive-browser.mjs"
      - "scripts/prepare-chatgpt-site.mjs"
      - ".openai/hosting.json"
      - ".github/workflows/system-integration-ci.yml"

permissions:
  contents: read

jobs:
  validate-system-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Validate Hub, subject packages, bridge and locked Math runtime
        run: node scripts/validate-system-integration.mjs
      - name: Parse changed runtime JavaScript
        run: |
          node --check assets/js/main.js
          node --check assets/js/planning-main.js
          node --check assets/js/hub-premium-v2.js
          node --check subjects/shared/host-bridge.js
          node --check subjects/ai/assets/ai.js
          node --check subjects/foundation/assets/foundation.js
          node --check subjects/research/assets/research.js
          node --check subjects/signal/assets/signal.js
          node --check subjects/systems/assets/systems.js
          node --check subjects/russian/assets/core.js
          node --check subjects/programming/assets/core.js
          node --check subjects/math/assets/math-study-command-center.js
          node --check tests/math-study-command-center-browser.mjs
          node --check tests/hub-premium-responsive-browser.mjs

  browser-system-acceptance:
    needs: validate-system-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install Playwright Chromium
        run: |
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local runtime
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/bauman-system-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bauman-system-http.log
          exit 1
      - name: Run whole-system browser acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/system-browser
        run: node tests/system-browser-acceptance.mjs
      - name: Run Math Study Command Center browser acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/math-study-command-center
        run: node tests/math-study-command-center-browser.mjs
      - name: Run Hub V2 responsive acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/hub-premium-responsive
        run: node tests/hub-premium-responsive-browser.mjs
      - name: Materialize owner-private ChatGPT Site package
        env:
          BAUMAN_CONTROL_PREVIEW_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
          BAUMAN_CONTROL_PRODUCTION_D1_DATABASE_ID: 22222222-2222-4222-8222-222222222222
          APPLICATION_MANAGEMENT_PREVIEW_ORIGIN: https://application-management-preview.example.com
          BAUMAN_CONTROL_PREVIEW_ORIGIN: https://bauman-control-preview.example.com
          BAUMAN_RUNTIME_PREVIEW_ORIGIN: https://bauman-runtime-preview.example.com
        run: |
          node scripts/prepare-cloudflare-preview.mjs
          node scripts/prepare-chatgpt-site.mjs
      - name: Start packaged ChatGPT Site runtime
        run: |
          node scripts/serve-local-runtime.mjs --root dist --port 4174 > /tmp/bauman-sites-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bauman-sites-http.log
          exit 1
      - name: Run packaged ChatGPT Site browser acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4174/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/chatgpt-site-browser
          BAUMAN_E2E_EXPECT_PLATFORM_ACCESS: "1"
        run: node tests/system-browser-acceptance.mjs
      - name: Run packaged Hub V2 responsive acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4174/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/chatgpt-site-hub-responsive
        run: node tests/hub-premium-responsive-browser.mjs
      - name: Show server log on failure
        if: failure()
        run: |
          cat /tmp/bauman-system-http.log || true
          cat /tmp/bauman-sites-http.log || true
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whole-system-browser-${{ github.run_id }}
          path: |
            artifacts/system-browser
            artifacts/math-study-command-center
            artifacts/hub-premium-responsive
            artifacts/chatgpt-site-browser
            artifacts/chatgpt-site-hub-responsive
          if-no-files-found: warn
          retention-days: 7
