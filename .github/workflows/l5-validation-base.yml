name: L5 + Academic Factory Validation

on:
  pull_request:
    branches:
      - validation/l5-ci-base
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l5-academic-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-l5-and-academic-factory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Syntax and deterministic gates
        run: |
          node --check assets/js/academic-data-v3.js
          node --check assets/js/platform/academic-runtime-v3-bridge.js
          node --check assets/js/platform/academic-roadmap-v3-bridge.js
          node --check assets/js/platform/offline-content-library.js
          node --check assets/js/platform/offline-direct-file-reader.js
          node --check assets/js/platform/offline-library-ui.js
          node --check assets/js/platform/offline-html-sandbox-guard.js
          node --check assets/js/platform/offline-import-quota-guard.js
          node --check assets/js/platform/offline-subject-pack-refcount-guard.js
          node --check assets/js/platform/offline-subject-pack-manager.js
          node --check assets/js/platform/runtime-self-diagnostics.js
          node --check assets/js/platform/site-runtime.js
          node --check service-worker.js
          node --check subjects/russian/assets/lazy-heavy-data-v1341.js
          node --check subjects/math/assets/theory_skin/theory-legacy-route-E246.js
          node --check scripts/migration/l5-static-routing-audit.cjs
          node --check scripts/migration/l5-academic-runtime-v3-regression.cjs
          node --check scripts/migration/l5-service-worker-lifecycle-regression.cjs
          node --check scripts/migration/l5-runtime-self-diagnostics-regression.cjs
          node --check scripts/migration/l5-roadmap-offline-static-regression.cjs
          node --check scripts/migration/l5-data-loading-audit.cjs
          node --check scripts/migration/l5-direct-file-reader-regression.cjs
          node --check scripts/migration/l5-offline-report-integrity-regression.cjs
          node --check scripts/academic/universal-lesson-contract-regression.cjs
          node scripts/migration/l5-static-routing-audit.cjs
          node scripts/migration/l5-academic-runtime-v3-regression.cjs
          node scripts/migration/l5-service-worker-lifecycle-regression.cjs
          node scripts/migration/l5-runtime-self-diagnostics-regression.cjs
          node scripts/migration/l5-roadmap-offline-static-regression.cjs
          node scripts/migration/l5-data-loading-audit.cjs
          node scripts/academic/universal-lesson-contract-regression.cjs

      - name: Install browser dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Start local Web App server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/bauman-validation-http.log 2>&1 &

      - name: Browser, responsive, render and offline gates
        run: |
          sleep 1
          node scripts/migration/l5-browser-network-regression.cjs
          node scripts/migration/l5-responsive-regression.cjs
          node scripts/migration/l5-render-performance-regression.cjs
          node scripts/migration/l5-direct-file-reader-regression.cjs
          node scripts/migration/l5-roadmap-offline-browser-regression.cjs
          node scripts/migration/l5-offline-report-integrity-regression.cjs

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l5-academic-validation-reports
          path: |
            docs/migration/L5_*generated*
            docs/academic/*generated*
          if-no-files-found: warn
          retention-days: 7
