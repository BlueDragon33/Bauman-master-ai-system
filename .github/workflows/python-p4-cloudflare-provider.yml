name: Python04 Cloudflare Provider Proof

on:
  workflow_dispatch:
  push:
    branches: [codex/python04-cloudflare-provider]
  pull_request:
    branches: [main]
    paths: ['runtime/python-cloudflare/**', 'cloudflare/runtime-worker.mjs', 'tests/python-p4-cloudflare-*', 'tests/python-p4-facade.test.mjs', 'subjects/programming/**', '.github/workflows/python-p4-cloudflare-provider.yml']

permissions:
  contents: write

concurrency:
  group: python04-cloudflare-proof
  cancel-in-progress: false

jobs:
  provider-proof:
    runs-on: ubuntu-24.04
    environment: bauman-preview
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      BAUMAN_BUILD_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install pinned provider toolchain
        run: npm ci --prefix runtime/python-cloudflare --no-audit --no-fund
      - name: Static, owner regressions, integration and controller fault injection
        id: static
        run: |
          set -euo pipefail
          npm run typecheck --prefix runtime/python-cloudflare
          npm run build --prefix runtime/python-cloudflare
          node tests/python-p1-forensic-static.mjs
          node tests/python-p2-canonical-contract.mjs
          node tests/python-p3-assessment-contract.mjs
          node tests/python-p4-runtime-security-contract.mjs
          node scripts/validate-system-integration.mjs
          node --test tests/python-p4-cloudflare-controller.test.mjs tests/python-p4-cloudflare-lifecycle.test.mjs tests/python-p4-facade.test.mjs
          docker build --network none -t bauman-python04-cf-spike:3.14.8 runtime/python-cloudflare
          node --test tests/python-p4-cloudflare-bootstrap.test.mjs
      - name: Desktop/mobile gated UI, offline and state-preservation browser checks
        id: gated_browser
        run: |
          set -euo pipefail
          runtime/python-cloudflare/node_modules/.bin/playwright install --with-deps chromium
          node tests/python-p4-cloudflare-browser.mjs > /tmp/python04-gated-browser.json
      - name: Require actual configured Cloudflare test infrastructure
        id: infrastructure
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing repository Cloudflare token binding'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing repository Cloudflare account binding'; exit 1; }
          worker_name="bauman-python04-spike-${GITHUB_SHA:0:12}"
          echo "PYTHON04_WORKER_NAME=$worker_name" >> "$GITHUB_ENV"
          node --input-type=module -e 'import {randomBytes} from "node:crypto"; import {appendFileSync} from "node:fs"; const key=randomBytes(32).toString("hex"); process.stdout.write("::add-mask::"+key+"\n"); appendFileSync(process.env.GITHUB_ENV,"BAUMAN_PYTHON04_ACCEPTANCE_SECRET="+key+"\n");'
      - name: Deploy only a unique, gated non-production test Worker
        id: deploy
        working-directory: runtime/python-cloudflare
        run: |
          set -euo pipefail
          case "$PYTHON04_WORKER_NAME" in bauman-python04-spike-*) ;; *) exit 1;; esac
          echo 'PYTHON04_DEPLOY_ATTEMPTED=true' >> "$GITHUB_ENV"
          ./node_modules/.bin/wrangler deploy --config wrangler.jsonc --name "$PYTHON04_WORKER_NAME" --var "BAUMAN_BUILD_REVISION:$GITHUB_SHA" > /tmp/python04-deploy.log 2>&1
          printf '%s' "$BAUMAN_PYTHON04_ACCEPTANCE_SECRET" | ./node_modules/.bin/wrangler secret put BAUMAN_PYTHON04_ACCEPTANCE_SECRET --config wrangler.jsonc --name "$PYTHON04_WORKER_NAME"
          python - <<'PY'
          import os,re
          from pathlib import Path
          name=os.environ['PYTHON04_WORKER_NAME']
          urls=re.findall(r'https://'+re.escape(name)+r'\.[a-z0-9-]+\.workers\.dev',Path('/tmp/python04-deploy.log').read_text())
          if not urls: raise SystemExit('Missing actual deployed test URL')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('BAUMAN_PYTHON04_BASE_URL='+urls[-1]+'\n')
          PY
      - name: Golden security and lifecycle fixtures on real Cloudflare Containers
        id: real_provider
        env:
          BAUMAN_PYTHON04_RECEIPT: /tmp/python04-cloudflare-real-receipt.json
        run: node tests/python-p4-cloudflare-real.mjs
      - name: Desktop/mobile journeys through the real provider
        id: real_browser
        env:
          BAUMAN_PYTHON04_BROWSER_REAL: 'true'
        run: node tests/python-p4-cloudflare-browser.mjs > /tmp/python04-real-browser.json
      - name: Remove only this non-production test Worker
        id: cleanup
        if: always() && env.PYTHON04_DEPLOY_ATTEMPTED == 'true'
        working-directory: runtime/python-cloudflare
        run: |
          set -euo pipefail
          case "$PYTHON04_WORKER_NAME" in bauman-python04-spike-*) ;; *) exit 1;; esac
          ./node_modules/.bin/wrangler delete --config wrangler.jsonc --name "$PYTHON04_WORKER_NAME" --force
      - name: Publish exact-source receipt on a separate evidence branch
        if: always() && github.event_name == 'push'
        env:
          GATED_BROWSER_OUTCOME: ${{ steps.gated_browser.outcome }}
          REAL_BROWSER_OUTCOME: ${{ steps.real_browser.outcome }}
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          INFRASTRUCTURE_OUTCOME: ${{ steps.infrastructure.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          PROVIDER_OUTCOME: ${{ steps.real_provider.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          mkdir -p prompts/subjects/python/evidence/cloudflare-ci
          python - <<'PY'
          import json,os
          from pathlib import Path
          sha=os.environ['GITHUB_SHA']; source=Path('/tmp/python04-cloudflare-real-receipt.json')
          receipt=json.loads(source.read_text()) if source.exists() else {'status':'NO_REAL_PROVIDER_RECEIPT'}
          receipt.update(credentialBindings={key:bool(os.environ.get(key)) for key in ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID']},githubEnvironment='bauman-preview',exactTestedSha=sha,workflowRunUrl='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],outcomes={key:os.environ.get(key,'unknown') for key in ['GATED_BROWSER_OUTCOME','REAL_BROWSER_OUTCOME','STATIC_OUTCOME','INFRASTRUCTURE_OUTCOME','DEPLOY_OUTCOME','PROVIDER_OUTCOME','CLEANUP_OUTCOME']},learnerExecutionEnabled=False,productionDeployed=False,moduleAcceptance='PENDING_EXACT_HEAD_REVIEW')
          Path('prompts/subjects/python/evidence/cloudflare-ci/'+sha+'.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "prompts/subjects/python/evidence/cloudflare-ci/$GITHUB_SHA.json"
          git commit -m "Python P4: CI provider receipt for $GITHUB_SHA"
          git push origin "HEAD:refs/heads/codex/python04-ci-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python04-cloudflare-${{ github.sha }}
          path: |
            /tmp/python04-deploy.log
            /tmp/python04-cloudflare-real-receipt.json
            /tmp/python04-gated-browser.json
            /tmp/python04-real-browser.json
          if-no-files-found: warn
