        run: node scripts/validate-roadmap-v2-l24-h1-prerequisite-policy.mjs
      - name: Validate current L24 B95 mastery/prerequisite gates
        run: node scripts/validate-roadmap-v2-l24-b95.mjs
      - name: Validate current L24 B96 closeout
        run: node scripts/validate-roadmap-v2-l24-b96.mjs
