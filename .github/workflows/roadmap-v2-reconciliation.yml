name: Roadmap V2 Current Gate

on:
  push:
    branches:
      - stabilization/roadmap-v2-reconcile-current-runtime
  pull_request:
    branches: [main]
    paths:
      - 'recovery/roadmap-v2/**'
      - 'scripts/validate-roadmap-v2-reconciliation.mjs'
      - 'scripts/validate-roadmap-v2-r2a.mjs'
      - 'scripts/validate-roadmap-v2-r2b0.mjs'
      - 'scripts/validate-roadmap-v2-r2b.mjs'
      - 'scripts/validate-roadmap-v2-r2c0.mjs'
      - 'scripts/validate-roadmap-v2-r2c1.mjs'
      - 'scripts/validate-roadmap-v2-r2c2a.mjs'
      - 'roadmap_v2/**'
      - 'roadmap_v2/admission/**'
      - 'docs/roadmap_v2/**'
      - 'scripts/validate-roadmap-v2-l23-b89.mjs'
      - 'scripts/build-roadmap-v2-consumer-blueprint.mjs'
      - 'scripts/validate-roadmap-v2-l23-h1-consumer-blueprint.mjs'
      - 'scripts/build-roadmap-v2-diagnostic-catalog.mjs'
      - 'scripts/validate-roadmap-v2-l23-b90.mjs'
      - 'scripts/validate-roadmap-v2-l23-b91.mjs'
      - 'scripts/validate-roadmap-v2-l23-b92.mjs'
      - 'scripts/validate-roadmap-v2-l24-b93.mjs'
      - 'scripts/validate-roadmap-v2-l24-b94.mjs'
      - 'scripts/validate-roadmap-v2-l24-h1-prerequisite-policy.mjs'
      - 'scripts/validate-roadmap-v2-l24-b95.mjs'
      - 'scripts/validate-roadmap-v2-l24-b96.mjs'
      - 'scripts/validate-roadmap-v2-l25-b97.mjs'
      - 'scripts/validate-roadmap-v2-l25-h1-priority-result-schema.mjs'
      - 'scripts/validate-roadmap-v2-l25-b98.mjs'
      - 'scripts/validate-roadmap-v2-l25-b99.mjs'
      - 'scripts/validate-roadmap-v2-l25-b100.mjs'
      - 'scripts/validate-roadmap-v2-l26-b101.mjs'
      - 'scripts/roadmap-v2-scheduler-harness.mjs'
      - 'scripts/validate-roadmap-v2-l26-b102.mjs'
      - 'scripts/validate-roadmap-v2-l26-b103.mjs'
      - 'scripts/validate-roadmap-v2-l27-b105.mjs'
      - 'scripts/validate-roadmap-v2-l27-b106.mjs'
      - 'scripts/validate-roadmap-v2-l27-b107.mjs'
      - 'scripts/validate-roadmap-v2-l27-b108.mjs'
      - 'scripts/validate-roadmap-v2-l28-b109.mjs'
      - 'scripts/roadmap-v2-admission-harness.mjs'
      - 'scripts/validate-roadmap-v2-l28-b110.mjs'
      - 'scripts/validate-roadmap-v2-l28-b111.mjs'
      - 'scripts/validate-roadmap-v2-l28-b112.mjs'
      - 'scripts/validate-roadmap-v2-l29-b113.mjs'
      - 'scripts/validate-roadmap-v2-l29-h1-consumer-admission-request.mjs'
      - 'scripts/roadmap-v2-consumer-admission-harness.mjs'
      - 'scripts/validate-roadmap-v2-l29-b114.mjs'
      - 'scripts/validate-roadmap-v2-l29-b115.mjs'
      - '.github/workflows/roadmap-v2-reconciliation.yml'

permissions:
  contents: read

jobs:
  current-roadmap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Validate current Roadmap state
        run: node scripts/validate-roadmap-v2-reconciliation.mjs
      - name: Validate historical archive integrity
        run: node scripts/validate-roadmap-v2-r2a.mjs
      - name: Validate historical contract hygiene
        run: node scripts/validate-roadmap-v2-r2b0.mjs
      - name: Validate static baseline invariants
        run: node scripts/validate-roadmap-v2-r2b.mjs
      - name: Validate historical tool/data classification
        run: node scripts/validate-roadmap-v2-r2c0.mjs
      - name: Validate legacy toolchain quarantine
        run: node scripts/validate-roadmap-v2-r2c1.mjs
      - name: Validate recovery tool safety
        run: node scripts/validate-roadmap-v2-r2c2a.mjs
      - name: Validate current L23 B89 diagnostic contract
        run: node scripts/validate-roadmap-v2-l23-b89.mjs
      - name: Validate L23 H1 current consumer blueprint
        run: node scripts/validate-roadmap-v2-l23-h1-consumer-blueprint.mjs
