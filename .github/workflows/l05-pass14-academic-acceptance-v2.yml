name: Lesson 1.5 academic acceptance v2
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/l05-pass14-academic-acceptance-v2.yml
permissions:
  contents: write
jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate JSON package
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('subjects/math')
          lesson='MATH-VN-C01-vector_trong_khong_gian_-L05-subspace-data-representation-e140'
          files={
            'case':root/'data/theory_case/theory_case_c01_l05.json',
            'core':root/'data/theory_core/theory_core_c01_l05.json',
            'worked':root/'data/theory_worked_examples/theory_worked_examples_c01_l05.json',
            'lab':root/'data/theory_lab/theory_lab_c01_l05.json',
            'assessment':root/'data/theory_assessment/theory_assessment_c01_l05.json',
            'reference':root/'data/theory_reference/theory_reference_c01_l05.json',
            'full':root/'data/theory_full_view/theory_full_view_c01_l05.json',
            'normalization':root/'data/theory_normalization/theory_normalization_c01_l05.json',
            'slideshow':root/'data/theory_slideshow/theory_slideshow_c01_l05.json',
            'import':root/'data/theory_integration/theory_lecture_content_c01_l05_import.json'
          }
          d={k:json.loads(p.read_text(encoding='utf-8')) for k,p in files.items()}
          passed=[]
          def ok(name,cond):
            if not cond: raise AssertionError(name)
            passed.append(name)
          for k,v in d.items():
            ok(k+' lesson', (v['records'][0]['lessonId'] if k=='import' else v['lessonId'])==lesson)
          fids=[f'F{i:02d}' for i in range(1,17)]
          ok('case version',d['case']['version']=='CASE_C01_L05_V1_LOCKED')
          ok('case normal score',d['case']['normalSample']['score']==0.0316227766016838)
          ok('case mismatch score',d['case']['mismatchSample']['score']==0.3535533905932738)
          ok('case ranks',d['case']['calibrationMatrix']['exactFloatingPointRank']==4 and d['case']['calibrationMatrix']['numericalRankContract']['rank']==2)
          ok('core beats',len(d['core']['learningBeats'])==20)
          ok('worked examples',len(d['worked']['examples'])==12)
          ok('lab counts',len(d['lab']['labSequence'])==8 and len(d['lab']['brokenCodeAudits'])==6)
          ok('assessment counts',len(d['assessment']['retrievalChecks'])==16 and len(d['assessment']['professorQuestions'])==14 and len(d['assessment']['masteryGates'])==5)
          ok('reference counts',len(d['reference']['informationArchitecture'])==8 and len(d['reference']['formulaTable'])==16 and len(d['reference']['terminologyLookup'])==22)
          ok('full sections',len(d['full']['readingFlow'])==12)
          ok('normalization counts',len(d['normalization']['canonicalNotation'])==18 and [x['id'] for x in d['normalization']['canonicalFormulaRegistry']]==fids)
          s=d['slideshow']['slides']
          ok('slides 22',len(s)==22 and [x['id'] for x in s]==[f'SL{i:02d}' for i in range(1,23)])
          ok('slide features',sum('diagramSpec' in x for x in s)==9 and sum('retrievalCheck' in x for x in s)==10 and sum('misconceptionIntercept' in x for x in s)==17)
          ok('slide formulas',sorted({z for x in s for z in x.get('formulaRefs',[])})==fids)
          imp=d['import']; rec=imp['records'][0]; rs=rec['slides']
          ok('runtime slides 22',len(rs)==22 and [x['id'] for x in rs]==[f'MATH-VN-C01-L05-S{i:02d}' for i in range(1,23)])
          ok('one to one',all(x['sourceSlideIds']==[f'SL{i:02d}'] for i,x in enumerate(rs,1)))
          ok('three blocks',all(len(x['blocks'])==3 for x in rs))
          ok('import blocked before acceptance',imp['runtimeMergeAllowed'] is False)
          report={'id':'bauman_math_c01_l05_academic_acceptance_v1','schema':'bauman_math_academic_acceptance_v1','version':'ACADEMIC_ACCEPTANCE_C01_L05_V1','status':'PASS','date':'2026-07-09','lessonId':lesson,'lessonTitle':'§1.5 · Không gian con và biểu diễn dữ liệu','academicPasses':{'completed':14,'total':14,'remaining':0},'artifactCounts':{'learningBeats':20,'workedExamples':12,'labStages':8,'brokenCodeAudits':6,'retrievalChecks':16,'professorQuestions':14,'masteryGates':5,'referenceSections':8,'fullViewSections':12,'slides':22,'diagrams':9,'retrievalSlides':10,'misconceptionSlides':17,'formulas':16,'terms':22},'lockedCase':{'version':'CASE_C01_L05_V1_LOCKED','normalScore':0.0316227766016838,'mismatchScore':0.3535533905932738,'floatingPointRank':4,'numericalRank':2,'rankTolerance':0.05,'retainedEnergyK2':0.9995414686511285},'slidePolicy':{'minimum':16,'actual':22,'maximum':None,'compression':False,'oneToOneMapping':True},'checks':[{'name':x,'status':'PASS'} for x in passed],'runtimeDecision':{'importPackageApproved':True,'durableMergePerformed':False,'runtimeIntegrationStarted':False,'nextTask':'THEORY_C01_L05_DURABLE_MERGE_RUNTIME_PASS_15'},'protectedConstraints':{'E235Modified':False,'E236Enabled':False,'E237Enabled':False,'E238Enabled':False,'newSlideshowEngineCreated':False}}
          (root/'THEORY_C01_L05_ACADEMIC_ACCEPTANCE.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          # Promote only after validation.
          changes={
            'core':('CORE_C01_L05_V1_APPROVED','approved_against_gold_standard'),
            'worked':('WORKED_EXAMPLES_C01_L05_V1_APPROVED','approved_against_core_formula_case'),
            'lab':('LAB_C01_L05_V1_APPROVED','approved_against_case_and_formulas'),
            'assessment':('ASSESSMENT_C01_L05_V1_APPROVED','approved_against_core_case_misconceptions'),
            'reference':('REFERENCE_C01_L05_V1_APPROVED','approved_against_core'),
            'full':('FULL_VIEW_C01_L05_V1_APPROVED','approved_against_core_reference_slideshow'),
            'normalization':('NORMALIZATION_C01_L05_V1_APPROVED','approved_across_core_reference_slideshow_full_view'),
            'slideshow':('SLIDESHOW_C01_L05_V1_APPROVED','approved_against_core_reference_full_view_normalization')
          }
          for k,(ver,status) in changes.items(): d[k]['version']=ver; d[k]['status']=status
          d['core']['contentContract']['sourceOfTruth']=True; d['core']['contentContract']['sourceOfTruthCandidate']=False; d['core']['contentContract']['approvalBlockedUntilPass09']=False; d['core']['contentContract']['completedAcademicPasses']=list(range(1,15)); d['core']['contentContract']['runtimeMergeAllowed']=True
          d['reference']['sourceCore']['version']='CORE_C01_L05_V1_APPROVED'; d['reference']['sourceCore']['status']='approved_against_gold_standard'; d['reference']['sourceCore']['sourceOfTruth']=True
          d['full']['sources']['core']['version']='CORE_C01_L05_V1_APPROVED'; d['full']['sources']['reference']['version']='REFERENCE_C01_L05_V1_APPROVED'
          d['normalization']['sources']['core']['version']='CORE_C01_L05_V1_APPROVED'; d['normalization']['sources']['reference']['version']='REFERENCE_C01_L05_V1_APPROVED'; d['normalization']['sources']['fullView']['version']='FULL_VIEW_C01_L05_V1_APPROVED'; d['normalization']['integrationGate']['runtimeIntegrationAllowed']=True; d['normalization']['integrationGate']['reason']='Academic Pass 14 accepted; durable merge is separate.'
          d['slideshow']['sourceCore']['version']='CORE_C01_L05_V1_APPROVED'; d['slideshow']['sourceReference']['version']='REFERENCE_C01_L05_V1_APPROVED'; d['slideshow']['sourceFullView']['version']='FULL_VIEW_C01_L05_V1_APPROVED'; d['slideshow']['sourceNormalization']['version']='NORMALIZATION_C01_L05_V1_APPROVED'
          imp['version']='C01_L05_E129_IMPORT_V1_22_SLIDES_APPROVED'; imp['sourceIntegrationVersion']='INTEGRATION_C01_L05_V1_22_SLIDES_ACCEPTED'; imp['academicStatus']='accepted_pass14'; imp['runtimeMergeAllowed']=True
          meta=rec['integrationMeta']; meta.update({'coreVersion':'CORE_C01_L05_V1_APPROVED','referenceVersion':'REFERENCE_C01_L05_V1_APPROVED','slideshowVersion':'SLIDESHOW_C01_L05_V1_APPROVED','fullViewVersion':'FULL_VIEW_C01_L05_V1_APPROVED','normalizationVersion':'NORMALIZATION_C01_L05_V1_APPROVED','assessmentVersion':'ASSESSMENT_C01_L05_V1_APPROVED','mergeBlockedUntil':None})
          for k,p in files.items(): p.write_text(json.dumps(d[k],ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          state=Path('CODEX_STATE.md'); text=state.read_text(encoding='utf-8')
          text=text.replace('Current task: `THEORY_C01_L05_REFERENCE_ARTIFACT_PASS_11`','Current task: `THEORY_C01_L05_DURABLE_MERGE_RUNTIME_PASS_15`',1).replace('Status: `PASS_10_RETRIEVAL_PROFESSOR_QA_COMPLETE`','Status: `PASS_14_ACADEMIC_ACCEPTANCE_COMPLETE`',1).replace('- academic passes complete: `10/14`;','- academic passes complete: `14/14`;',1).replace('- academic passes remaining: `4/14`;','- academic passes remaining: `0/14`;',1).replace('- accepted specialist package: not yet approved;','- accepted specialist package: approved;',1).replace('- next task: Pass 11 Reference artifact.','- next task: Runtime Pass 15 durable merge.',1)
          text += '\n\n## §1.5 Passes 11–14\n- Pass 11 Reference: complete, 8 sections, F01–F16, T01–T22.\n- Pass 12 Full View/Normalization: complete, 12 sections, N01–N18, semantic conflicts 0.\n- Pass 13 Slideshow/Import: complete, 22/22 one-to-one, 9 diagrams, 10 retrieval, 17 misconception slides, no compression.\n- Pass 14 Academic acceptance: PASS. Report: `subjects/math/THEORY_C01_L05_ACADEMIC_ACCEPTANCE.json`.\n- Durable runtime merge has not been performed.\n- Next: `THEORY_C01_L05_DURABLE_MERGE_RUNTIME_PASS_15`.\n\n## §1.5 runtime roadmap\n1. Durable merge with non-target preservation.\n2. Register Reference, Full View and Normalization.\n3. Extend existing slideshow richness/readers for L05 without a new engine.\n4. Synchronize lesson selection and route locking while preserving L04.\n5. Chromium QA, leak checks and final acceptance.\n'
          state.write_text(text,encoding='utf-8')
          print('PASS14',len(passed))
          PY
      - name: Commit accepted package
        run: |
          git rm --ignore-unmatch .github/workflows/l05-pass14-academic-acceptance.yml .github/workflows/l05-pass14-academic-acceptance-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CODEX_STATE.md subjects/math
          git commit -m "content(math): academically accept lesson 1.5 package"
          git pull --rebase origin main
          git push origin HEAD:main
