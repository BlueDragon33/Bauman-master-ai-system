name: Math m_s03 E20 Russian probability statistics gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'subjects/math/**'
      - 'scripts/validate-math-ms03-e20.mjs'
      - 'scripts/validate-math-ms03-runtime-routing-e20.mjs'
      - 'tests/math-ms03-e20-browser.mjs'
      - '.github/workflows/math-ms03-e20-gate.yml'
permissions:
  contents: read
jobs:
  ms03-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: node scripts/validate-math-ms03-e20.mjs
      - run: node scripts/validate-math-ms03-runtime-routing-e20.mjs
  ms03-browser:
    needs: ms03-static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install Playwright Chromium
        run: |
          printf '{"private":true,"type":"module"}\n' > package.json
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local runtime
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/bauman-ms03-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bauman-ms03-http.log
          exit 1
      - name: Run E20 browser acceptance
        env:
          BAUMAN_E2E_BASE_URL: http://127.0.0.1:4173/
          BAUMAN_E2E_ARTIFACT_DIR: artifacts/math-ms03-e20
        run: node tests/math-ms03-e20-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: math-ms03-e20-${{ github.run_id }}
          path: artifacts/math-ms03-e20
          if-no-files-found: ignore
